name: Garden report

# Health signals, never a gate. A draft is a legitimate state; a draft that has sat for a year
# while a dozen notes link to it is worth seeing. This reports the number and stops there.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build site
        run: node ./quartz/bootstrap-cli.mjs build

      - name: Report
        run: |
          {
            bun Tools/garden-report.ts .
            echo
            echo "### Built-site link audit"
            echo '```'
            bun Tools/link-audit-built.ts public --max-links 99999 --max-images 99999 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
