<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .node { fill: #58a6ff; }
    .t { fill: #e8e8e8; font-size: 14px; }
    .anno { fill: #d29922; font-size: 12px; }
    .desc { fill: #8b949e; font-size: 12px; }
    .green { fill: #84a59d; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93a3b8"/>
    </marker>
  </defs>

  <!-- input nodes -->
  <circle class="node" cx="70" cy="55"  r="12"/>
  <circle class="node" cx="70" cy="120" r="12"/>
  <circle class="node" cx="70" cy="185" r="12"/>
  <circle class="node" cx="70" cy="280" r="12"/>
  <text class="t" x="42" y="60"  text-anchor="end">x0=1</text>
  <text class="t" x="42" y="125" text-anchor="end">x1</text>
  <text class="t" x="42" y="190" text-anchor="end">x2</text>
  <text class="t" x="42" y="285" text-anchor="end">xn</text>
  <text class="desc" x="70" y="235" text-anchor="middle">.</text>
  <text class="desc" x="70" y="248" text-anchor="middle">.</text>

  <!-- edges to sum with weight labels -->
  <line class="edge" x1="84" y1="58"  x2="288" y2="150" marker-end="url(#arr)"/>
  <line class="edge" x1="84" y1="122" x2="288" y2="158" marker-end="url(#arr)"/>
  <line class="edge" x1="84" y1="185" x2="288" y2="166" marker-end="url(#arr)"/>
  <line class="edge" x1="84" y1="278" x2="288" y2="178" marker-end="url(#arr)"/>
  <text class="anno" x="175" y="92">w0 (bias b)</text>
  <text class="anno" x="185" y="132">w1</text>
  <text class="anno" x="185" y="182">w2</text>
  <text class="anno" x="185" y="238">wn</text>

  <!-- sum node -->
  <circle class="box" cx="320" cy="162" r="34"/>
  <text class="t" x="320" y="168" text-anchor="middle" font-size="22">&#931;</text>
  <text class="desc" x="320" y="222" text-anchor="middle">net = &#931; wi xi</text>

  <!-- activation box -->
  <rect class="box" x="410" y="130" width="90" height="64" rx="8"/>
  <text class="t" x="455" y="158" text-anchor="middle">step /</text>
  <text class="t" x="455" y="178" text-anchor="middle">sigmoid</text>
  <line class="edge" x1="354" y1="162" x2="406" y2="162" marker-end="url(#arr)"/>

  <!-- output -->
  <line class="edge" x1="500" y1="162" x2="600" y2="162" marker-end="url(#arr)"/>
  <text class="green" x="560" y="152" text-anchor="middle" font-size="15">output</text>
  <text class="desc" x="560" y="184" text-anchor="middle">o = f(net)</text>

  <!-- caption -->
  <text class="anno" x="320" y="315" text-anchor="middle">weighted sum, then a nonlinearity: the atom every network is built from</text>
</svg>
