<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.9 0 640 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .edge { stroke: #93a3b8; stroke-width: 1.2; }
    .node { fill: #58a6ff; }
    .t { fill: #e8e8e8; font-size: 13px; }
    .anno { fill: #d29922; font-size: 12px; }
    .desc { fill: #8b949e; font-size: 11px; }
    .lat { fill: #84a59d; }
  </style>

  <!-- input nodes -->
  <circle class="node" cx="60" cy="80"  r="9"/>
  <circle class="node" cx="60" cy="120" r="9"/>
  <circle class="node" cx="60" cy="160" r="9"/>
  <circle class="node" cx="60" cy="200" r="9"/>
  <text class="t" x="60" y="240" text-anchor="middle">x</text>
  <text class="desc" x="60" y="258" text-anchor="middle">input</text>

  <!-- latent (bottleneck) nodes -->
  <circle class="lat" cx="320" cy="120" r="10"/>
  <circle class="lat" cx="320" cy="160" r="10"/>
  <text class="anno" x="320" y="205" text-anchor="middle">z = f(x)</text>
  <text class="desc" x="320" y="223" text-anchor="middle">latent code</text>

  <!-- output nodes -->
  <circle class="node" cx="580" cy="80"  r="9"/>
  <circle class="node" cx="580" cy="120" r="9"/>
  <circle class="node" cx="580" cy="160" r="9"/>
  <circle class="node" cx="580" cy="200" r="9"/>
  <text class="t" x="580" y="240" text-anchor="middle">x'</text>
  <text class="desc" x="580" y="258" text-anchor="middle">reconstruction</text>

  <!-- encoder edges: inputs to latent -->
  <g class="edge">
    <line x1="69" y1="80"  x2="311" y2="120"/>
    <line x1="69" y1="120" x2="311" y2="120"/>
    <line x1="69" y1="160" x2="311" y2="120"/>
    <line x1="69" y1="200" x2="311" y2="120"/>
    <line x1="69" y1="80"  x2="311" y2="160"/>
    <line x1="69" y1="120" x2="311" y2="160"/>
    <line x1="69" y1="160" x2="311" y2="160"/>
    <line x1="69" y1="200" x2="311" y2="160"/>
  </g>

  <!-- decoder edges: latent to outputs -->
  <g class="edge">
    <line x1="329" y1="120" x2="571" y2="80"/>
    <line x1="329" y1="120" x2="571" y2="120"/>
    <line x1="329" y1="120" x2="571" y2="160"/>
    <line x1="329" y1="120" x2="571" y2="200"/>
    <line x1="329" y1="160" x2="571" y2="80"/>
    <line x1="329" y1="160" x2="571" y2="120"/>
    <line x1="329" y1="160" x2="571" y2="160"/>
    <line x1="329" y1="160" x2="571" y2="200"/>
  </g>

  <!-- section labels -->
  <text class="anno" x="190" y="35" text-anchor="middle">encoder f</text>
  <text class="anno" x="450" y="35" text-anchor="middle">decoder g</text>
  <text class="desc" x="190" y="52" text-anchor="middle">compress</text>
  <text class="desc" x="450" y="52" text-anchor="middle">reconstruct</text>

  <!-- bottleneck brace hint -->
  <text class="t" x="320" y="35" text-anchor="middle" font-size="12">bottleneck</text>
</svg>
