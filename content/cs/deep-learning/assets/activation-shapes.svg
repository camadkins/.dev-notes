<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.1 0 698 280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .axis { stroke: #93a3b8; stroke-width: 1; fill: none; }
    .curve { stroke: #58a6ff; stroke-width: 2.5; fill: none; }
    .t { fill: #e8e8e8; font-size: 14px; }
    .anno { fill: #d29922; font-size: 12px; }
    .desc { fill: #8b949e; font-size: 12px; }
  </style>

  <!-- Panel 1: sigmoid -->
  <line class="axis" x1="30"  y1="210" x2="190" y2="210"/>
  <line class="axis" x1="110" y1="55"  x2="110" y2="230"/>
  <path class="curve" d="M 30 206 C 70 205, 95 200, 110 140 C 125 80, 150 75, 190 74"/>
  <text class="t"    x="110" y="252" text-anchor="middle">sigmoid</text>
  <text class="desc" x="110" y="270" text-anchor="middle">range (0, 1), saturates</text>

  <!-- Panel 2: tanh -->
  <line class="axis" x1="260" y1="140" x2="420" y2="140"/>
  <line class="axis" x1="340" y1="55"  x2="340" y2="225"/>
  <path class="curve" d="M 260 205 C 300 203, 325 195, 340 140 C 355 85, 380 77, 420 75"/>
  <text class="t"    x="340" y="252" text-anchor="middle">tanh</text>
  <text class="desc" x="340" y="270" text-anchor="middle">range (-1, 1), saturates</text>

  <!-- Panel 3: ReLU -->
  <line class="axis" x1="490" y1="210" x2="650" y2="210"/>
  <line class="axis" x1="570" y1="55"  x2="570" y2="230"/>
  <path class="curve" d="M 490 210 L 570 210 L 650 72"/>
  <text class="t"    x="570" y="252" text-anchor="middle">ReLU</text>
  <text class="desc" x="570" y="270" text-anchor="middle">max(0, x), no positive saturation</text>
</svg>
