<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .taskbox { fill: rgba(30,40,55,0.95); stroke: #84a59d; stroke-width: 1.5; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .back { stroke: #d29922; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .t { fill: #e8e8e8; font-size: 14px; }
    .small { fill: #e8e8e8; font-size: 12px; }
    .anno { fill: #d29922; font-size: 13px; }
    .desc { fill: #8b949e; font-size: 12px; }
    .green { fill: #84a59d; font-size: 13px; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93a3b8"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="t">MAML: an outer loop over tasks, an inner loop within each task</text>

  <!-- meta parameters box -->
  <rect x="270" y="52" width="180" height="52" rx="8" class="box"/>
  <text x="360" y="74" text-anchor="middle" class="t">initialization &#952;</text>
  <text x="360" y="92" text-anchor="middle" class="desc">shared across tasks</text>

  <!-- arrows down to tasks -->
  <line x1="310" y1="104" x2="150" y2="160" class="edge" marker-end="url(#arr)"/>
  <line x1="360" y1="104" x2="360" y2="160" class="edge" marker-end="url(#arr)"/>
  <line x1="410" y1="104" x2="570" y2="160" class="edge" marker-end="url(#arr)"/>

  <!-- task boxes -->
  <g>
    <rect x="60" y="162" width="180" height="96" rx="8" class="taskbox"/>
    <text x="150" y="186" text-anchor="middle" class="small">task A</text>
    <text x="150" y="208" text-anchor="middle" class="green">few gradient steps</text>
    <text x="150" y="226" text-anchor="middle" class="small">&#952; &#8594; &#952;&#8242;_A</text>
    <text x="150" y="246" text-anchor="middle" class="desc">on K examples</text>
  </g>
  <g>
    <rect x="270" y="162" width="180" height="96" rx="8" class="taskbox"/>
    <text x="360" y="186" text-anchor="middle" class="small">task B</text>
    <text x="360" y="208" text-anchor="middle" class="green">few gradient steps</text>
    <text x="360" y="226" text-anchor="middle" class="small">&#952; &#8594; &#952;&#8242;_B</text>
    <text x="360" y="246" text-anchor="middle" class="desc">on K examples</text>
  </g>
  <g>
    <rect x="480" y="162" width="180" height="96" rx="8" class="taskbox"/>
    <text x="570" y="186" text-anchor="middle" class="small">task C</text>
    <text x="570" y="208" text-anchor="middle" class="green">few gradient steps</text>
    <text x="570" y="226" text-anchor="middle" class="small">&#952; &#8594; &#952;&#8242;_C</text>
    <text x="570" y="246" text-anchor="middle" class="desc">on K examples</text>
  </g>

  <!-- inner loop label -->
  <text x="360" y="284" text-anchor="middle" class="desc">inner loop: adapt a copy of &#952; to each task</text>

  <!-- outer loop: losses flow back up -->
  <path d="M 150 258 C 150 330, 300 344, 348 344" class="back"/>
  <path d="M 570 258 C 570 330, 420 344, 372 344" class="back"/>
  <rect x="250" y="322" width="220" height="44" rx="8" class="box"/>
  <text x="360" y="341" text-anchor="middle" class="small">post-adaptation losses</text>
  <text x="360" y="358" text-anchor="middle" class="small">update &#952; itself</text>
  <path d="M 250 344 C 120 344, 100 78, 266 78" class="back" marker-end="url(#arrO)"/>
  <text x="118" y="120" class="anno">outer loop</text>
</svg>
