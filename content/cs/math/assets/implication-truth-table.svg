<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" fill="none" role="img" aria-label="Truth table for material implication p implies q, with the two rows where p is false highlighted as vacuously true">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .edge { stroke: #93a3b8; stroke-width: 1.4; }
    .t    { fill: #e8e8e8; }
    .anno { fill: #d29922; }
    .desc { fill: #8b949e; }
    .hl   { fill: rgba(88,166,255,0.12); stroke: #58a6ff; stroke-dasharray: 4 3; stroke-width: 1; }
  </style>
  <text class="t" x="30" y="30" font-size="15">p</text>
  <text class="t" x="110" y="30" font-size="15">q</text>
  <text class="anno" x="200" y="30" font-size="15">p &#8594; q</text>
  <line class="edge" x1="20" y1="42" x2="300" y2="42"/>
  <text class="t" x="30" y="70" font-size="14">T</text>
  <text class="t" x="110" y="70" font-size="14">T</text>
  <text class="t" x="210" y="70" font-size="14">T</text>
  <text class="t" x="30" y="98" font-size="14">T</text>
  <text class="t" x="110" y="98" font-size="14">F</text>
  <text class="anno" x="210" y="98" font-size="14">F</text>
  <rect class="hl" x="20" y="112" width="280" height="26"/>
  <text class="t" x="30" y="130" font-size="14">F</text>
  <text class="t" x="110" y="130" font-size="14">T</text>
  <text class="t" x="210" y="130" font-size="14">T</text>
  <rect class="hl" x="20" y="142" width="280" height="26"/>
  <text class="t" x="30" y="160" font-size="14">F</text>
  <text class="t" x="110" y="160" font-size="14">F</text>
  <text class="t" x="210" y="160" font-size="14">T</text>
  <text class="desc" x="20" y="190" font-size="11">False premise makes the implication vacuously true (highlighted rows).</text>
</svg>
