<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" fill="none" role="img" aria-label="Four IP delivery modes side by side. Unicast: a source reaches one of several nodes. Broadcast: a source reaches every node. Multicast: a source reaches only the subscribed group members. Anycast: a source reaches the single nearest node among several sharing one address.">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .src   { fill: #58a6ff; }
    .node  { fill: rgba(30,40,55,0.95); stroke: #93a3b8; stroke-width: 1.3; }
    .recv  { fill: rgba(30,55,40,0.6); stroke: #84a59d; stroke-width: 1.5; }
    .edge  { stroke: #93a3b8; stroke-width: 1.3; }
    .hit   { stroke: #58a6ff; stroke-width: 1.6; }
    .ttl   { fill: #e8e8e8; font-size: 13px; text-anchor: middle; }
    .desc  { fill: #8b949e; font-size: 11px; text-anchor: middle; }
  </style>

  <!-- unicast -->
  <text class="ttl" x="80" y="24">unicast</text>
  <circle class="src" cx="80" cy="60" r="7"/>
  <line class="hit" x1="80" y1="67" x2="52" y2="120"/>
  <circle class="recv" cx="52" cy="128" r="7"/>
  <circle class="node" cx="80" cy="128" r="7"/>
  <circle class="node" cx="108" cy="128" r="7"/>
  <text class="desc" x="80" y="168">one to one</text>

  <!-- broadcast -->
  <text class="ttl" x="230" y="24">broadcast</text>
  <circle class="src" cx="230" cy="60" r="7"/>
  <line class="hit" x1="230" y1="67" x2="202" y2="120"/>
  <line class="hit" x1="230" y1="67" x2="230" y2="120"/>
  <line class="hit" x1="230" y1="67" x2="258" y2="120"/>
  <circle class="recv" cx="202" cy="128" r="7"/>
  <circle class="recv" cx="230" cy="128" r="7"/>
  <circle class="recv" cx="258" cy="128" r="7"/>
  <text class="desc" x="230" y="168">one to all in subnet</text>

  <!-- multicast -->
  <text class="ttl" x="390" y="24">multicast</text>
  <circle class="src" cx="390" cy="60" r="7"/>
  <line class="hit" x1="390" y1="67" x2="362" y2="120"/>
  <line class="hit" x1="390" y1="67" x2="418" y2="120"/>
  <circle class="recv" cx="362" cy="128" r="7"/>
  <circle class="node" cx="390" cy="128" r="7"/>
  <circle class="recv" cx="418" cy="128" r="7"/>
  <text class="desc" x="390" y="168">one to a joined group</text>

  <!-- anycast -->
  <text class="ttl" x="545" y="24">anycast</text>
  <circle class="src" cx="545" cy="60" r="7"/>
  <line class="hit" x1="545" y1="67" x2="517" y2="120"/>
  <circle class="recv" cx="517" cy="128" r="7"/>
  <circle class="node" cx="545" cy="128" r="7"/>
  <circle class="node" cx="573" cy="128" r="7"/>
  <text class="desc" x="545" y="168">one to the nearest</text>
  <text class="desc" x="545" y="184">(same address)</text>

  <text class="desc" x="310" y="216">blue = source   green = receives   gray = same net, no delivery</text>
</svg>
