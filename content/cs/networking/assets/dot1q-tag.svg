<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" fill="none" role="img" aria-label="An Ethernet frame with an 802.1Q tag inserted: destination MAC, source MAC, then the 32-bit 802.1Q tag holding TPID 0x8100 and a 12-bit VLAN ID, then EtherType and payload">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .box  { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .tag  { fill: rgba(210,153,34,0.14); stroke: #d29922; stroke-width: 1.5; }
    .lbl  { fill: #e8e8e8; font-size: 13px; text-anchor: middle; }
    .anno { fill: #d29922; font-size: 12px; text-anchor: middle; }
    .net  { fill: #58a6ff; font-size: 12px; text-anchor: middle; }
    .desc { fill: #8b949e; font-size: 11px; text-anchor: middle; }
    .edge { stroke: #93a3b8; stroke-width: 1.4; }
  </style>

  <rect class="box" x="16"  y="70" width="96" height="46" rx="4"/>
  <rect class="box" x="120" y="70" width="96" height="46" rx="4"/>
  <rect class="tag" x="224" y="70" width="168" height="46" rx="4"/>
  <rect class="box" x="400" y="70" width="96" height="46" rx="4"/>
  <rect class="box" x="504" y="70" width="100" height="46" rx="4"/>

  <text class="lbl" x="64"  y="98">dest MAC</text>
  <text class="lbl" x="168" y="98">src MAC</text>
  <text class="anno" x="308" y="93">802.1Q tag</text>
  <text class="anno" x="308" y="109">32 bits</text>
  <text class="lbl" x="448" y="98">EtherType</text>
  <text class="lbl" x="554" y="98">payload</text>

  <line class="edge" x1="224" y1="58" x2="392" y2="58"/>
  <text class="net"  x="308" y="48">inserted here</text>

  <text class="desc" x="308" y="140">TPID 0x8100  |  TCI: PCP, DEI, VID</text>
  <text class="desc" x="308" y="158">VID = 12 bits, up to 4,094 VLANs</text>
  <text class="desc" x="308" y="182">frame max 1,518 to 1,522 bytes</text>
</svg>
