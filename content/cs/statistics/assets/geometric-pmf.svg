<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
<style>
  text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
  .edge { stroke: #93a3b8; stroke-width: 1.5; }
  .anno { font-size: 10px; fill: #d29922; font-weight: 600; }
  .desc { font-size: 9px; fill: #8b949e; font-style: italic; }
  .title { font-size: 13px; fill: #e6edf3; font-weight: 700; }
  .axis-label { font-size: 9px; fill: #8b949e; }
  .tick-label { font-size: 8px; fill: #8b949e; }
  .grid { stroke: #30363d; stroke-width: 0.5; stroke-dasharray: 2,3; }
  @media (prefers-color-scheme: light) {
    .edge { stroke: #b8b8b8; }
    .anno { fill: #9e6000; }
    .desc { fill: #6e7781; }
    .title { fill: #1f2328; }
    .axis-label { fill: #6e7781; }
    .tick-label { fill: #6e7781; }
    .grid { stroke: #d1d9e0; }
  }
</style>
<!-- Title -->
<text x="280" y="28" text-anchor="middle" class="title">Geometric PMF: Geom(p = 0.2)</text>
<!-- Chart area: x=60..490, y=50..200, height=150 -->
<!-- Y-axis gridlines: 0.0, 0.05, 0.10, 0.15, 0.20 -->
<line x1="60" y1="200" x2="490" y2="200" class="grid"/>
<text x="57" y="203" text-anchor="end" class="tick-label">0.00</text>
<line x1="60" y1="162.5" x2="490" y2="162.5" class="grid"/>
<text x="57" y="165.5" text-anchor="end" class="tick-label">0.05</text>
<line x1="60" y1="125" x2="490" y2="125" class="grid"/>
<text x="57" y="128" text-anchor="end" class="tick-label">0.10</text>
<line x1="60" y1="87.5" x2="490" y2="87.5" class="grid"/>
<text x="57" y="90.5" text-anchor="end" class="tick-label">0.15</text>
<line x1="60" y1="50" x2="490" y2="50" class="grid"/>
<text x="57" y="53" text-anchor="end" class="tick-label">0.20</text>
<!-- Axes -->
<line x1="60" y1="50" x2="60" y2="200" class="edge"/>
<line x1="60" y1="200" x2="490" y2="200" class="edge"/>
<!-- Bars: 12 bars, each 28px wide with 6px gap = 34px pitch -->
<!-- bar x starts at 66, pitch 34, barWidth 28 -->
<!-- maxP=0.20 maps to height 150 (y=50), so scale = 150/0.20 = 750 -->
<!-- k=1: P=0.2000, h=150.0, y=50.0 -->
<rect x="66" y="50" width="28" height="150" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=2: P=0.1600, h=120.0, y=80.0 -->
<rect x="100" y="80" width="28" height="120" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=3: P=0.1280, h=96.0, y=104.0 -->
<rect x="134" y="104" width="28" height="96" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=4: P=0.1024, h=76.8, y=123.2 -->
<rect x="168" y="123.2" width="28" height="76.8" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=5: P=0.0819, h=61.4, y=138.6 -->
<rect x="202" y="138.6" width="28" height="61.4" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=6: P=0.0655, h=49.2, y=150.8 -->
<rect x="236" y="150.8" width="28" height="49.2" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=7: P=0.0524, h=39.3, y=160.7 -->
<rect x="270" y="160.7" width="28" height="39.3" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=8: P=0.0419, h=31.5, y=168.5 -->
<rect x="304" y="168.5" width="28" height="31.5" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=9: P=0.0336, h=25.2, y=174.8 -->
<rect x="338" y="174.8" width="28" height="25.2" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=10: P=0.0268, h=20.1, y=179.9 -->
<rect x="372" y="179.9" width="28" height="20.1" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=11: P=0.0215, h=16.1, y=183.9 -->
<rect x="406" y="183.9" width="28" height="16.1" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- k=12: P=0.0172, h=12.9, y=187.1 -->
<rect x="440" y="187.1" width="28" height="12.9" fill="rgba(88,166,255,0.6)" stroke="rgba(88,166,255,0.9)" stroke-width="0.5" rx="1"/>
<!-- X-axis tick labels (centered on bars) -->
<text x="80" y="212" text-anchor="middle" class="tick-label">1</text>
<text x="114" y="212" text-anchor="middle" class="tick-label">2</text>
<text x="148" y="212" text-anchor="middle" class="tick-label">3</text>
<text x="182" y="212" text-anchor="middle" class="tick-label">4</text>
<text x="216" y="212" text-anchor="middle" class="tick-label">5</text>
<text x="250" y="212" text-anchor="middle" class="tick-label">6</text>
<text x="284" y="212" text-anchor="middle" class="tick-label">7</text>
<text x="318" y="212" text-anchor="middle" class="tick-label">8</text>
<text x="352" y="212" text-anchor="middle" class="tick-label">9</text>
<text x="386" y="212" text-anchor="middle" class="tick-label">10</text>
<text x="420" y="212" text-anchor="middle" class="tick-label">11</text>
<text x="454" y="212" text-anchor="middle" class="tick-label">12</text>
<!-- Axis labels -->
<text x="280" y="232" text-anchor="middle" class="axis-label">k (trial number of first success)</text>
<text x="20" y="125" text-anchor="middle" class="axis-label" transform="rotate(-90,20,125)">P(X = k)</text>
<!-- Annotation: formula and mean -->
<text x="370" y="68" text-anchor="start" class="anno">P(X=k) = 0.2 x 0.8^(k-1)</text>
<text x="370" y="82" text-anchor="start" class="desc">mean = 1/p = 5 trials</text>
<!-- Decay annotation -->
<text x="280" y="248" text-anchor="middle" class="desc">each bar is 0.8x the previous -- constant decay ratio q = 1 - p</text>
</svg>