    .tick-label { font-size: 8px; fill: #8b949e; }
    .trend { stroke: #93a3b8; stroke-width: 1.2; stroke-dasharray: 6,4; opacity: 0.6; }
    @media (prefers-color-scheme: light) {
      .edge { stroke: #b8b8b8; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
      .axis-label { fill: #1f2328; }
