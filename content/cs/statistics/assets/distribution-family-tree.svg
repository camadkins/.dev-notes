<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .node-root { fill: rgba(30,40,55,0.95); stroke: #d29922; stroke-width: 2; }
    .node-text { font-size: 11px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .node-desc { font-size: 8px; fill: #8b949e; text-anchor: middle; dominant-baseline: central; font-style: italic; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .approx { stroke: #d29922; stroke-width: 1.2; stroke-dasharray: 5 3; fill: none; }
    .anno { font-size: 8px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; }
    @media (prefers-color-scheme: light) {
      .node { fill: #1a1a2e; stroke: #284b63; }
      .node-root { fill: #1a1a2e; stroke: #9e6000; }
      .node-text { fill: #f0f0f0; }
      .node-desc { fill: #6e7781; }
      .edge { stroke: #b8b8b8; }
      .approx { stroke: #9e6000; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
    }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#d29922" stroke-width="1"/>
    </marker>
  </defs>

  <!-- ═══ LEVEL 0: Root ═══ -->
  <rect x="325" y="20" width="130" height="34" rx="8" class="node-root"/>
  <text x="390" y="37" class="node-text" style="fill:#d29922;">Distributions</text>

  <!-- Root → Branch edges -->
  <line x1="355" y1="54" x2="215" y2="100" class="edge"/>
  <line x1="425" y1="54" x2="565" y2="100" class="edge"/>

  <!-- ═══ LEVEL 1: Branches ═══ -->
  <rect x="145" y="100" width="140" height="38" rx="8" class="node"/>
  <text x="215" y="113" class="node-text">Discrete</text>
  <text x="215" y="128" class="node-desc">PMF: P(X = x)</text>

  <rect x="495" y="100" width="140" height="38" rx="8" class="node"/>
  <text x="565" y="113" class="node-text">Continuous</text>
  <text x="565" y="128" class="node-desc">PDF: f(x)</text>

  <!-- Discrete → leaf edges -->
  <line x1="175" y1="138" x2="75" y2="200" class="edge"/>
  <line x1="200" y1="138" x2="195" y2="200" class="edge"/>
  <line x1="230" y1="138" x2="315" y2="200" class="edge"/>
  <line x1="255" y1="138" x2="435" y2="200" class="edge"/>

  <!-- Continuous → leaf edges -->
  <line x1="545" y1="138" x2="555" y2="200" class="edge"/>
  <line x1="585" y1="138" x2="695" y2="200" class="edge"/>

  <!-- ═══ LEVEL 2: Leaf nodes ═══ -->
  <!-- Discrete leaves -->
  <rect x="20" y="200" width="110" height="46" rx="8" class="node"/>
  <text x="75" y="217" class="node-text">Bernoulli</text>
  <text x="75" y="233" class="node-desc">single trial</text>

  <rect x="140" y="200" width="110" height="46" rx="8" class="node"/>
  <text x="195" y="217" class="node-text">Binomial</text>
  <text x="195" y="233" class="node-desc">n trials, k wins</text>

  <rect x="260" y="200" width="110" height="46" rx="8" class="node"/>
  <text x="315" y="217" class="node-text">Poisson</text>
  <text x="315" y="233" class="node-desc">events / interval</text>

  <rect x="380" y="200" width="110" height="46" rx="8" class="node"/>
  <text x="435" y="217" class="node-text">Geometric</text>
  <text x="435" y="233" class="node-desc">trials to 1st win</text>

  <!-- Continuous leaves -->
  <rect x="500" y="200" width="110" height="46" rx="8" class="node"/>
  <text x="555" y="217" class="node-text">Normal</text>
  <text x="555" y="233" class="node-desc">bell curve (CLT)</text>

  <rect x="640" y="200" width="110" height="46" rx="8" class="node"/>
  <text x="695" y="217" class="node-text">Exponential</text>
  <text x="695" y="233" class="node-desc">time btwn events</text>

  <!-- ═══ Approximation arrows (dashed gold) ═══ -->

  <!-- Binomial → Normal: large n, CLT approximation -->
  <path d="M 230,246 C 300,340 440,340 510,246" class="approx" marker-end="url(#arr)"/>
  <text x="375" y="340" class="anno">Binomial → Normal  (large n, CLT)</text>

  <!-- Poisson approx Binomial: large n, small p -->
  <path d="M 280,246 C 265,288 215,288 210,246" class="approx" marker-end="url(#arr)"/>
  <text x="245" y="296" class="anno">n large, p small</text>

  <!-- Poisson ↔ Exponential: count-time duality -->
  <path d="M 355,246 C 430,310 580,310 650,246" class="approx" marker-end="url(#arr)"/>
  <text x="510" y="318" class="anno">count ↔ interarrival duality</text>

</svg>