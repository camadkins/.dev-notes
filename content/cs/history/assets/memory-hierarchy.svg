<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" fill="none" role="img" aria-label="The memory hierarchy: registers and cache are small and fast at the top, disk and tape large and slow at the bottom, with random-access disk in the middle">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .lvl { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .disk { fill: rgba(210,153,34,0.14); stroke: #d29922; stroke-width: 1.8; }
    .t { fill: #e8e8e8; font-size: 13px; text-anchor: middle; }
    .ax { fill: #8b949e; font-size: 11px; text-anchor: middle; }
  </style>
  <rect class="lvl"  x="160" y="20"  width="120" height="30" rx="3"/><text class="t" x="220" y="40">registers</text>
  <rect class="lvl"  x="135" y="54"  width="170" height="30" rx="3"/><text class="t" x="220" y="74">cache</text>
  <rect class="lvl"  x="105" y="88"  width="230" height="30" rx="3"/><text class="t" x="220" y="108">main memory (RAM / core)</text>
  <rect class="disk" x="75"  y="122" width="290" height="30" rx="3"/><text class="t" x="220" y="142">disk (random access)</text>
  <rect class="lvl"  x="45"  y="156" width="350" height="30" rx="3"/><text class="t" x="220" y="176">tape (sequential)</text>
  <text class="ax" x="220" y="208">top: faster, smaller, costlier per byte</text>
  <text class="ax" x="220" y="224">bottom: slower, larger, cheaper per byte</text>
</svg>
