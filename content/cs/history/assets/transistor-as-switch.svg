<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 0 456 190" fill="none" role="img" aria-label="A transistor as a switch: a control voltage on the gate decides whether current flows from source to drain">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .wire { stroke: #93a3b8; stroke-width: 2; }
    .ch { stroke: #58a6ff; stroke-width: 2.4; }
    .gate { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.6; }
    .lab { fill: #d29922; font-size: 13px; text-anchor: middle; }
    .term { fill: #8b949e; font-size: 12px; text-anchor: middle; }
    .cap { fill: #e8e8e8; font-size: 13px; text-anchor: middle; }
  </style>
  <line class="wire" x1="40" y1="110" x2="170" y2="110"/>
  <line class="ch" x1="170" y1="110" x2="250" y2="110" stroke-dasharray="5 5"/>
  <line class="wire" x1="250" y1="110" x2="380" y2="110"/>
  <circle cx="40" cy="110" r="4" fill="#93a3b8"/><circle cx="380" cy="110" r="4" fill="#93a3b8"/>
  <text class="term" x="40" y="132">source</text><text class="term" x="380" y="132">drain</text>
  <rect class="gate" x="180" y="44" width="60" height="28" rx="3"/>
  <text class="lab" x="210" y="63">gate</text>
  <line class="ch" x1="210" y1="72" x2="210" y2="100"/>
  <text class="cap" x="210" y="168">a voltage on the gate lets current flow:  ON = 1,  OFF = 0</text>
</svg>
