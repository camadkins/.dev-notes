<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" fill="none" role="img" aria-label="A spreadsheet grid where cell B1 holds the formula A1 plus A2 and recalculates when A1 changes">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .cell { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.1; }
    .hdr { fill: rgba(88,166,255,0.16); stroke: #58a6ff; stroke-width: 1.1; }
    .out { fill: rgba(210,153,34,0.14); stroke: #d29922; stroke-width: 1.5; }
    .h { fill: #8b949e; font-size: 12px; text-anchor: middle; }
    .v { fill: #e8e8e8; font-size: 13px; text-anchor: middle; }
    .f { fill: #d29922; font-size: 12px; text-anchor: middle; }
    .arr { stroke: #d29922; stroke-width: 1.4; fill: none; }
    .cap { fill: #8b949e; font-size: 12px; text-anchor: middle; }
  </style>
  <rect class="hdr" x="40" y="20" width="40" height="24"/>
  <rect class="hdr" x="80" y="20" width="90" height="24"/><text class="h" x="125" y="36">A</text>
  <rect class="hdr" x="170" y="20" width="90" height="24"/><text class="h" x="215" y="36">B</text>
  <rect class="hdr" x="40" y="44" width="40" height="34"/><text class="h" x="60" y="65">1</text>
  <rect class="cell" x="80" y="44" width="90" height="34"/><text class="v" x="125" y="65">5</text>
  <rect class="out" x="170" y="44" width="90" height="34"/><text class="f" x="215" y="62">=A1+A2</text>
  <rect class="hdr" x="40" y="78" width="40" height="34"/><text class="h" x="60" y="99">2</text>
  <rect class="cell" x="80" y="78" width="90" height="34"/><text class="v" x="125" y="99">8</text>
  <rect class="cell" x="170" y="78" width="90" height="34"/><text class="v" x="215" y="99">13</text>
  <path class="arr" d="M125,82 C140,120 200,120 215,114"/><polygon points="215,114 207,112 211,120" fill="#d29922"/>
  <text class="cap" x="190" y="160">change A1 and B1 recalculates automatically</text>
</svg>
