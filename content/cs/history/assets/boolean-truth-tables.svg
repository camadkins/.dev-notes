<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" fill="none" role="img" aria-label="Truth tables for the Boolean operations AND, OR, and NOT">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .title { fill: #58a6ff; font-size: 15px; text-anchor: middle; }
    .hd { fill: #d29922; font-size: 13px; text-anchor: middle; }
    .c { fill: #e8e8e8; font-size: 13px; text-anchor: middle; }
    .rule { stroke: #93a3b8; stroke-width: 1; opacity: 0.5; }
  </style>
  <!-- AND -->
  <text class="title" x="80" y="24">AND</text>
  <text class="hd" x="50" y="50">a</text><text class="hd" x="80" y="50">b</text><text class="hd" x="120" y="50">a·b</text>
  <line class="rule" x1="30" y1="58" x2="140" y2="58"/>
  <text class="c" x="50" y="78">0</text><text class="c" x="80" y="78">0</text><text class="c" x="120" y="78">0</text>
  <text class="c" x="50" y="98">0</text><text class="c" x="80" y="98">1</text><text class="c" x="120" y="98">0</text>
  <text class="c" x="50" y="118">1</text><text class="c" x="80" y="118">0</text><text class="c" x="120" y="118">0</text>
  <text class="c" x="50" y="138">1</text><text class="c" x="80" y="138">1</text><text class="c" x="120" y="138">1</text>
  <!-- OR -->
  <text class="title" x="230" y="24">OR</text>
  <text class="hd" x="200" y="50">a</text><text class="hd" x="230" y="50">b</text><text class="hd" x="272" y="50">a+b</text>
  <line class="rule" x1="180" y1="58" x2="292" y2="58"/>
  <text class="c" x="200" y="78">0</text><text class="c" x="230" y="78">0</text><text class="c" x="272" y="78">0</text>
  <text class="c" x="200" y="98">0</text><text class="c" x="230" y="98">1</text><text class="c" x="272" y="98">1</text>
  <text class="c" x="200" y="118">1</text><text class="c" x="230" y="118">0</text><text class="c" x="272" y="118">1</text>
  <text class="c" x="200" y="138">1</text><text class="c" x="230" y="138">1</text><text class="c" x="272" y="138">1</text>
  <!-- NOT -->
  <text class="title" x="380" y="24">NOT</text>
  <text class="hd" x="360" y="50">a</text><text class="hd" x="404" y="50">¬a</text>
  <line class="rule" x1="345" y1="58" x2="418" y2="58"/>
  <text class="c" x="360" y="78">0</text><text class="c" x="404" y="78">1</text>
  <text class="c" x="360" y="98">1</text><text class="c" x="404" y="98">0</text>
</svg>
