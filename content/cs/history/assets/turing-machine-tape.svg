<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 182" fill="none" role="img" aria-label="A Turing machine: a finite-state head reads and writes one cell of an infinite tape, then moves left or right and changes state">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .box  { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .cell { fill: rgba(30,40,55,0.95); stroke: #93a3b8; stroke-width: 1.2; }
    .hl   { fill: rgba(88,166,255,0.18); stroke: #58a6ff; stroke-width: 1.8; }
    .t  { fill: #e8e8e8; font-size: 14px; text-anchor: middle; }
    .s  { fill: #8b949e; font-size: 11px; text-anchor: middle; }
    .anno { fill: #d29922; font-size: 11px; text-anchor: middle; }
    .a  { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
  </style>
  <rect class="box" x="180" y="20" width="120" height="38" rx="4"/>
  <text class="t" x="240" y="44">state: q3</text>
  <line class="a" x1="240" y1="58" x2="240" y2="94"/><polygon points="240,94 236,86 244,86" fill="#93a3b8"/>
  <rect class="cell" x="30"  y="98" width="60" height="44"/><text class="t" x="60"  y="126">…</text>
  <rect class="cell" x="90"  y="98" width="60" height="44"/><text class="t" x="120" y="126">1</text>
  <rect class="cell" x="150" y="98" width="60" height="44"/><text class="t" x="180" y="126">0</text>
  <rect class="hl"   x="210" y="98" width="60" height="44"/><text class="t" x="240" y="126">1</text>
  <rect class="cell" x="270" y="98" width="60" height="44"/><text class="t" x="300" y="126">1</text>
  <rect class="cell" x="330" y="98" width="60" height="44"/><text class="t" x="360" y="126">0</text>
  <rect class="cell" x="390" y="98" width="60" height="44"/><text class="t" x="420" y="126">…</text>
  <text class="anno" x="240" y="164">read symbol, write, move L/R, change state</text>
  <text class="s" x="240" y="178">the simplest machine that captures everything mechanically computable</text>
</svg>
