<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170" fill="none" role="img" aria-label="Binary place values: the bits 1101 mean 8 plus 4 plus 1, which is 13">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .off { fill: rgba(30,40,55,0.6); stroke: #93a3b8; stroke-width: 1.3; }
    .bit { fill: #e8e8e8; font-size: 22px; text-anchor: middle; }
    .pv { fill: #d29922; font-size: 14px; text-anchor: middle; }
    .eq { fill: #8b949e; font-size: 14px; text-anchor: middle; }
  </style>
  <rect class="box" x="40"  y="28" width="64" height="56" rx="4"/><text class="bit" x="72"  y="64">1</text><text class="pv" x="72"  y="106">8</text>
  <rect class="box" x="116" y="28" width="64" height="56" rx="4"/><text class="bit" x="148" y="64">1</text><text class="pv" x="148" y="106">4</text>
  <rect class="off" x="192" y="28" width="64" height="56" rx="4"/><text class="bit" x="224" y="64">0</text><text class="pv" x="224" y="106">2</text>
  <rect class="box" x="268" y="28" width="64" height="56" rx="4"/><text class="bit" x="300" y="64">1</text><text class="pv" x="300" y="106">1</text>
  <text class="eq" x="190" y="146">1101 in binary  =  8 + 4 + 1  =  13</text>
</svg>
