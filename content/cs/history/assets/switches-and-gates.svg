<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" fill="none" role="img" aria-label="Switches in series make an AND; switches in parallel make an OR">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .wire { stroke: #93a3b8; stroke-width: 1.8; }
    .sw { stroke: #58a6ff; stroke-width: 2.2; }
    .term { fill: #58a6ff; }
    .lab { fill: #d29922; font-size: 13px; text-anchor: middle; }
    .cap { fill: #e8e8e8; font-size: 14px; }
  </style>
  <!-- series = AND -->
  <text class="cap" x="20" y="46">AND</text>
  <circle class="term" cx="120" cy="60" r="4"/>
  <line class="wire" x1="120" y1="60" x2="170" y2="60"/>
  <line class="sw" x1="170" y1="60" x2="200" y2="44"/>
  <line class="wire" x1="205" y1="60" x2="255" y2="60"/>
  <line class="sw" x1="255" y1="60" x2="285" y2="44"/>
  <line class="wire" x1="290" y1="60" x2="340" y2="60"/>
  <circle class="term" cx="340" cy="60" r="4"/>
  <text class="lab" x="185" y="84">A</text><text class="lab" x="270" y="84">B</text>
  <text class="cap" x="350" y="64" font-size="11" fill="#8b949e">conducts only if A and B closed</text>
  <!-- parallel = OR -->
  <text class="cap" x="20" y="160">OR</text>
  <circle class="term" cx="120" cy="160" r="4"/>
  <line class="wire" x1="120" y1="160" x2="150" y2="160"/>
  <line class="wire" x1="150" y1="130" x2="150" y2="190"/>
  <line class="sw" x1="150" y1="130" x2="200" y2="118"/><line class="wire" x1="205" y1="130" x2="310" y2="130"/>
  <line class="sw" x1="150" y1="190" x2="200" y2="178"/><line class="wire" x1="205" y1="190" x2="310" y2="190"/>
  <line class="wire" x1="310" y1="130" x2="310" y2="190"/>
  <line class="wire" x1="310" y1="160" x2="340" y2="160"/>
  <circle class="term" cx="340" cy="160" r="4"/>
  <text class="lab" x="178" y="116">A</text><text class="lab" x="178" y="208">B</text>
  <text class="cap" x="350" y="164" font-size="11" fill="#8b949e">conducts if A or B closed</text>
</svg>
