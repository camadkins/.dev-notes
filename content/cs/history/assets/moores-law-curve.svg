<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16.6 -105 440 345" fill="none" role="img" aria-label="Transistors per chip on a logarithmic scale rise in a straight line over the decades, doubling roughly every two years">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .axis { stroke: #93a3b8; stroke-width: 1.4; }
    .grid { stroke: #93a3b8; stroke-width: 1; opacity: 0.25; }
    .line { stroke: #58a6ff; stroke-width: 2.2; fill: none; }
    .dot { fill: #58a6ff; }
    .lab { fill: #8b949e; font-size: 11px; }
    .note { fill: #d29922; font-size: 12px; }
  </style>
  <line class="grid" x1="60" y1="50" x2="400" y2="50"/>
  <line class="grid" x1="60" y1="100" x2="400" y2="100"/>
  <line class="grid" x1="60" y1="150" x2="400" y2="150"/>
  <line class="axis" x1="60" y1="30" x2="60" y2="195"/>
  <line class="axis" x1="60" y1="195" x2="405" y2="195"/>
  <polyline class="line" points="80,178 160,140 240,102 320,64 390,40"/>
  <circle class="dot" cx="80" cy="178" r="4"/><circle class="dot" cx="160" cy="140" r="4"/><circle class="dot" cx="240" cy="102" r="4"/><circle class="dot" cx="320" cy="64" r="4"/><circle class="dot" cx="390" cy="40" r="4"/>
  <text class="lab" x="12" y="115" transform="rotate(-90 12 115)">transistors per chip (log scale)</text>
  <text class="lab" x="80" y="212">1971</text><text class="lab" x="370" y="212">2020s</text>
  <text class="note" x="150" y="78">doubling roughly every two years</text>
</svg>
