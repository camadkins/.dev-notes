<svg xmlns="http://www.w3.org/2000/svg" viewBox="-23 0 586 150" fill="none" role="img" aria-label="A Unix pipeline: grep, sort, uniq and sort each do one job, composed left to right by pipes into a single query">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.6; }
    .t  { fill: #e8e8e8; font-size: 13px; text-anchor: middle; }
    .s  { fill: #8b949e; font-size: 11px; text-anchor: middle; }
    .a  { stroke: #93a3b8; stroke-width: 1.6; fill: none; }
    .pipe { fill: #d29922; font-size: 15px; text-anchor: middle; }
  </style>
  <rect class="box" x="16"  y="42" width="104" height="48" rx="4"/><text class="t" x="68"  y="71">grep</text>
  <line class="a" x1="120" y1="66" x2="150" y2="66"/><polygon points="150,66 142,62 142,70" fill="#93a3b8"/>
  <text class="pipe" x="135" y="52">|</text>
  <rect class="box" x="152" y="42" width="104" height="48" rx="4"/><text class="t" x="204" y="71">sort</text>
  <line class="a" x1="256" y1="66" x2="286" y2="66"/><polygon points="286,66 278,62 278,70" fill="#93a3b8"/>
  <text class="pipe" x="271" y="52">|</text>
  <rect class="box" x="288" y="42" width="104" height="48" rx="4"/><text class="t" x="340" y="71">uniq -c</text>
  <line class="a" x1="392" y1="66" x2="422" y2="66"/><polygon points="422,66 414,62 414,70" fill="#93a3b8"/>
  <text class="pipe" x="407" y="52">|</text>
  <rect class="box" x="424" y="42" width="104" height="48" rx="4"/><text class="t" x="476" y="71">sort -rn</text>
  <text class="s" x="270" y="124">each program does one thing; pipes compose them into a query no single tool implements</text>
</svg>
