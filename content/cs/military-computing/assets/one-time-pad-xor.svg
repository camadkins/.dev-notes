<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.9 0 746 200" fill="none" role="img" aria-label="A one-time pad combines each message bit with a random key bit using exclusive-or to produce the ciphertext">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .lab { fill: #8b949e; font-size: 13px; }
    .bits { fill: #e8e8e8; font-size: 18px; letter-spacing: 6px; }
    .key { fill: #58a6ff; font-size: 18px; letter-spacing: 6px; }
    .op { fill: #d29922; font-size: 16px; }
    .rule { stroke: #93a3b8; stroke-width: 1.2; opacity: 0.6; }
    .cap { fill: #8b949e; font-size: 12px; }
  </style>
  <text class="lab" x="30" y="44">message</text><text class="bits" x="180" y="48">1 0 1 1 0 0 1</text>
  <text class="op"  x="150" y="80">xor</text>
  <text class="lab" x="30" y="84">key (random)</text><text class="key"  x="180" y="88">0 1 1 0 1 0 1</text>
  <line class="rule" x1="180" y1="100" x2="420" y2="100"/>
  <text class="lab" x="30" y="128">ciphertext</text><text class="bits" x="180" y="132">1 1 0 1 1 0 0</text>
  <text class="cap" x="30" y="176">xor the ciphertext with the same key to recover the message; reuse the key and the secrecy is gone</text>
</svg>
