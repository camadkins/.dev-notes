<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7.9 0 320 270" fill="none" role="img" aria-label="A magnetic-core memory plane: ferrite rings on a grid of X and Y wires, with one core selected where a driven X wire and a driven Y wire cross">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .wire { stroke: #93a3b8; stroke-width: 1.3; opacity: 0.5; }
    .wire-on { stroke: #58a6ff; stroke-width: 2.6; }
    .core { fill: none; stroke: #93a3b8; stroke-width: 2; }
    .core-on { fill: rgba(88,166,255,0.25); stroke: #58a6ff; stroke-width: 2; }
    .lbl { fill: #d29922; font-size: 12px; font-weight: 600; }
    .cap { fill: #8b949e; font-size: 11px; text-anchor: middle; }
  </style>
  <line class="wire" x1="50" y1="70" x2="290" y2="70"/>
  <line class="wire-on" x1="50" y1="120" x2="290" y2="120"/>
  <line class="wire" x1="50" y1="170" x2="290" y2="170"/>
  <line class="wire" x1="50" y1="220" x2="290" y2="220"/>
  <line class="wire" x1="80" y1="50" x2="80" y2="240"/>
  <line class="wire-on" x1="140" y1="50" x2="140" y2="240"/>
  <line class="wire" x1="200" y1="50" x2="200" y2="240"/>
  <line class="wire" x1="260" y1="50" x2="260" y2="240"/>
  <circle class="core" cx="80" cy="70" r="9"/><circle class="core" cx="140" cy="70" r="9"/><circle class="core" cx="200" cy="70" r="9"/><circle class="core" cx="260" cy="70" r="9"/>
  <circle class="core" cx="80" cy="120" r="9"/><circle class="core-on" cx="140" cy="120" r="9"/><circle class="core" cx="200" cy="120" r="9"/><circle class="core" cx="260" cy="120" r="9"/>
  <circle class="core" cx="80" cy="170" r="9"/><circle class="core" cx="140" cy="170" r="9"/><circle class="core" cx="200" cy="170" r="9"/><circle class="core" cx="260" cy="170" r="9"/>
  <circle class="core" cx="80" cy="220" r="9"/><circle class="core" cx="140" cy="220" r="9"/><circle class="core" cx="200" cy="220" r="9"/><circle class="core" cx="260" cy="220" r="9"/>
  <text class="lbl" x="50" y="112">X</text>
  <text class="lbl" x="146" y="46">Y</text>
  <text class="cap" x="140" y="256">selected core (full current only here)</text>
</svg>
