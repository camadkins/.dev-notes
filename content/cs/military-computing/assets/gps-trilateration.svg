<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" fill="none" role="img" aria-label="GPS trilateration: distance circles from three satellites intersect at the receiver's position">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .range { fill: none; stroke: #58a6ff; stroke-width: 1.4; opacity: 0.8; }
    .sat { fill: #d29922; }
    .pos { fill: #84a59d; }
    .lbl { fill: #8b949e; font-size: 12px; }
    .poslbl { fill: #e8e8e8; font-size: 12px; }
    .cap { fill: #8b949e; font-size: 12px; text-anchor: middle; }
  </style>
  <circle class="range" cx="80"  cy="70"  r="92"/>
  <circle class="range" cx="220" cy="80"  r="86"/>
  <circle class="range" cx="150" cy="210" r="80"/>
  <circle class="sat" cx="80"  cy="70"  r="5"/><text class="lbl" x="50" y="58">sat 1</text>
  <circle class="sat" cx="220" cy="80"  r="5"/><text class="lbl" x="228" y="70">sat 2</text>
  <circle class="sat" cx="150" cy="210" r="5"/><text class="lbl" x="160" y="226">sat 3</text>
  <circle class="pos" cx="150" cy="130" r="5"/><text class="poslbl" x="160" y="128">your position</text>
  <text class="cap" x="150" y="276">each distance is a circle of possibilities; the circles meet at one point</text>
</svg>
