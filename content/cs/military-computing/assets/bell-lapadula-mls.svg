<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" fill="none" role="img" aria-label="Bell-LaPadula: a subject cleared at Secret may not read a higher level (no read up) and may not write to a lower level (no write down)">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .lvl { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .subj { fill: rgba(30,55,40,0.6); stroke: #84a59d; stroke-width: 1.5; }
    .t { fill: #e8e8e8; font-size: 14px; }
    .tc { fill: #e8e8e8; font-size: 13px; text-anchor: middle; }
    .no { stroke: #d29922; stroke-width: 1.8; }
    .nol { fill: #d29922; font-size: 12px; }
  </style>
  <rect class="lvl" x="30" y="20"  width="190" height="50" rx="4"/><text class="t" x="46" y="50">Top Secret</text>
  <rect class="lvl" x="30" y="95"  width="190" height="50" rx="4"/><text class="t" x="46" y="125">Secret</text>
  <rect class="lvl" x="30" y="170" width="190" height="50" rx="4"/><text class="t" x="46" y="200">Unclassified</text>
  <rect class="subj" x="300" y="98" width="160" height="44" rx="4"/><text class="tc" x="380" y="125">subject @ Secret</text>
  <line class="no" x1="300" y1="108" x2="222" y2="58"/>
  <line class="no" x1="258" y1="78" x2="270" y2="90"/><line class="no" x1="270" y1="78" x2="258" y2="90"/>
  <text class="nol" x="246" y="104">no read up</text>
  <line class="no" x1="300" y1="132" x2="222" y2="188"/>
  <line class="no" x1="258" y1="154" x2="270" y2="166"/><line class="no" x1="270" y1="154" x2="258" y2="166"/>
  <text class="nol" x="244" y="150">no write down</text>
</svg>
