<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 560 300" fill="none" role="img" aria-label="The four components of COMSEC: cryptographic security, transmission security, emission security, and physical security, with cryptographic security marked as only one of the four.">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .box   { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .hl    { fill: rgba(88,166,255,0.12); stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .t     { fill: #e8e8e8; }
    .anno  { fill: #d29922; }
    .desc  { fill: #8b949e; }
  </style>

  <text x="280" y="28" text-anchor="middle" class="t" font-size="16">COMSEC</text>
  <text x="280" y="46" text-anchor="middle" class="desc" font-size="11">protecting keying material end to end</text>

  <rect class="hl"  x="40"  y="70" width="120" height="170" rx="4"/>
  <rect class="box" x="180" y="70" width="120" height="170" rx="4"/>
  <rect class="box" x="320" y="70" width="120" height="170" rx="4"/>
  <rect class="box" x="460" y="70" width="80"  height="170" rx="4"/>

  <text x="100" y="150" text-anchor="middle" class="t" font-size="12">CRYPTO</text>
  <text x="100" y="168" text-anchor="middle" class="desc" font-size="10">sound</text>
  <text x="100" y="182" text-anchor="middle" class="desc" font-size="10">cryptosystems</text>

  <text x="240" y="150" text-anchor="middle" class="t" font-size="12">TRANSEC</text>
  <text x="240" y="168" text-anchor="middle" class="desc" font-size="10">freq hopping,</text>
  <text x="240" y="182" text-anchor="middle" class="desc" font-size="10">spread spectrum</text>

  <text x="380" y="150" text-anchor="middle" class="t" font-size="12">EMSEC</text>
  <text x="380" y="168" text-anchor="middle" class="desc" font-size="10">compromising</text>
  <text x="380" y="182" text-anchor="middle" class="desc" font-size="10">emanations</text>

  <text x="500" y="150" text-anchor="middle" class="t" font-size="12">PHYS</text>
  <text x="500" y="168" text-anchor="middle" class="desc" font-size="10">safeguard</text>
  <text x="500" y="182" text-anchor="middle" class="desc" font-size="10">key material</text>

  <text x="100" y="262" text-anchor="middle" class="anno" font-size="11">one of four</text>
  <text x="380" y="262" text-anchor="middle" class="desc" font-size="11">encryption alone protects only the content</text>
</svg>
