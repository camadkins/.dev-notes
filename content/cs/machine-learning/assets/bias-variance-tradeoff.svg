<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="Bias falls and variance rises as model complexity grows; total error forms a U shape with a sweet spot in the middle">
  <style>
    .box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .node { fill: #58a6ff; }
    .t { fill: #e8e8e8; font-family: monospace; font-size: 13px; }
    .anno { fill: #d29922; font-family: monospace; font-size: 12px; }
    .desc { fill: #8b949e; font-family: monospace; font-size: 12px; }
    .final { fill: #84a59d; }
  </style>
  <!-- axes -->
  <line class="edge" x1="80" y1="40" x2="80" y2="310"/>
  <line class="edge" x1="80" y1="310" x2="640" y2="310"/>
  <text class="t" x="30" y="50">error</text>
  <text class="t" x="440" y="345">model complexity</text>
