  <text class="t" x="300" y="330" fill="#84a59d">sweet spot</text>
  <text class="anno" x="100" y="80">underfitting</text>
  <text class="anno" x="480" y="80">overfitting</text>
  <text class="desc" x="120" y="378">total error = bias^2 + variance + irreducible noise</text>
</svg>
