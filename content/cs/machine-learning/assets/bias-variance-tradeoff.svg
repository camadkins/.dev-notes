  <text class="desc" x="540" y="163">variance</text>
  <text class="t" x="300" y="225" fill="#58a6ff">total error</text>
  <!-- sweet spot -->
  <line class="edge" stroke="#84a59d" stroke-dasharray="4 4" x1="340" y1="199" x2="340" y2="310"/>
