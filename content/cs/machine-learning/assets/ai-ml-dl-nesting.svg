<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" fill="none" role="img" aria-label="Three nested sets: artificial intelligence contains machine learning, which contains deep learning, each answering a different question.">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .box   { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .inner { fill: rgba(30,55,40,0.6);  stroke: #84a59d; stroke-width: 1.5; }
    .t     { fill: #e8e8e8; }
    .anno  { fill: #d29922; }
    .desc  { fill: #8b949e; }
    .edge  { stroke: #93a3b8; stroke-width: 1.2; }
  </style>

  <!-- AI outer -->
  <rect class="box" x="20" y="24" width="380" height="292" rx="10"/>
  <text class="t" x="38" y="48" font-size="16" font-weight="bold">Artificial Intelligence</text>
  <text class="desc" x="38" y="66" font-size="11">acts intelligently (rules, search, logic)</text>

  <!-- ML middle -->
  <rect class="box" x="52" y="88" width="316" height="204" rx="9"/>
  <text class="t" x="70" y="112" font-size="15" font-weight="bold">Machine Learning</text>
  <text class="desc" x="70" y="130" font-size="11">learns behavior from data</text>

  <!-- DL inner -->
  <rect class="inner" x="86" y="150" width="248" height="120" rx="8"/>
  <text class="t" x="104" y="176" font-size="15" font-weight="bold">Deep Learning</text>
  <text class="desc" x="104" y="194" font-size="11">learns its own features</text>
  <text class="desc" x="104" y="210" font-size="11">via many layers</text>

  <!-- right-side claim annotations -->
  <line class="edge" x1="400" y1="52" x2="440" y2="52"/>
  <text class="anno" x="448" y="49" font-size="12" font-weight="bold">WHAT it does</text>
  <text class="desc" x="448" y="65" font-size="10.5">a chess engine: AI, no learning</text>

  <line class="edge" x1="368" y1="116" x2="440" y2="116"/>
  <text class="anno" x="448" y="113" font-size="12" font-weight="bold">HOW it is built</text>
  <text class="desc" x="448" y="129" font-size="10.5">a decision tree: ML, no net</text>

  <line class="edge" x1="334" y1="180" x2="440" y2="180"/>
  <text class="anno" x="448" y="177" font-size="12" font-weight="bold">HOW it represents</text>
  <text class="desc" x="448" y="193" font-size="10.5">depth learns features humans</text>
  <text class="desc" x="448" y="207" font-size="10.5">used to hand-engineer</text>

  <text class="desc" x="448" y="250" font-size="10.5">Nested, but each box is a</text>
  <text class="desc" x="448" y="264" font-size="10.5">different KIND of claim, not</text>
  <text class="desc" x="448" y="278" font-size="10.5">a harder version of the last.</text>
</svg>
