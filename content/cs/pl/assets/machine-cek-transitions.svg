<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .state-box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 6; }
    .state-label { font-size: 10px; fill: #d29922; font-weight: 600; }
    .component { font-size: 10px; fill: #e8e8e8; }
    .comp-key { font-size: 10px; fill: #58a6ff; font-weight: 600; }
    .arrow { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .rule-text { font-size: 9px; fill: #8b949e; font-style: italic; }
    .title { font-size: 12px; fill: #d29922; font-weight: 600; }
    .highlight { fill: #3fb95020; stroke: #3fb950; stroke-width: 1; rx: 3; }
    .result { font-size: 11px; fill: #3fb950; font-weight: 600; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; }
    @media (prefers-color-scheme: light) {
      .state-box { fill: #1a1a2e; stroke: #284b63; }
      .arrow { stroke: #b8b8b8; }
      .state-label { fill: #9e6000; }
      .title { fill: #9e6000; }
      .comp-key { fill: #284b63; }
      .rule-text { fill: #6e7781; }
      .desc { fill: #6e7781; }
      .highlight { fill: #2da44e20; stroke: #2da44e; }
      .result { fill: #1a7f37; }
    }
  </style>
  <defs>
    <marker id="tri" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#93a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="20" y="30">CEK transitions: (&#955;x. x + 1) 4</text>

  <!-- State 1: Decompose application -->
  <rect class="state-box" x="20" y="50" width="160" height="110"/>
  <text class="state-label" x="30" y="72">State 1 &#8212; decompose</text>
  <text class="comp-key" x="30" y="95">C</text>
  <text class="component" x="50" y="95">(&#955;x. x+1) 4</text>
  <text class="comp-key" x="30" y="115">E</text>
  <text class="component" x="50" y="115">{}</text>
  <text class="comp-key" x="30" y="135">K</text>
  <text class="component" x="50" y="135">K&#8320; (halt)</text>

  <!-- Arrow 1->2 -->
  <path class="arrow" d="M 180,105 L 210,105" marker-end="url(#tri)"/>
  <text class="rule-text" x="183" y="98">eval</text>

  <!-- State 2: Closure obtained, apply -->
  <rect class="state-box" x="215" y="50" width="160" height="110"/>
  <text class="state-label" x="225" y="72">State 2 &#8212; apply</text>
  <text class="comp-key" x="225" y="95">C</text>
  <text class="component" x="245" y="95">x + 1</text>
  <text class="comp-key" x="225" y="115">E</text>
  <text class="component" x="245" y="115">{x &#8614; 4}</text>
  <text class="comp-key" x="225" y="135">K</text>
  <text class="component" x="245" y="135">K&#8320;</text>

  <!-- Arrow 2->3 -->
  <path class="arrow" d="M 375,105 L 405,105" marker-end="url(#tri)"/>
  <text class="rule-text" x="378" y="98">lookup</text>

  <!-- State 3: Evaluate operands -->
  <rect class="state-box" x="410" y="50" width="160" height="110"/>
  <text class="state-label" x="420" y="72">State 3 &#8212; add</text>
  <text class="comp-key" x="420" y="95">C</text>
  <text class="component" x="440" y="95">4 + 1</text>
  <text class="comp-key" x="420" y="115">E</text>
  <text class="component" x="440" y="115">{x &#8614; 4}</text>
  <text class="comp-key" x="420" y="135">K</text>
  <text class="component" x="440" y="135">K&#8320;</text>

  <!-- Arrow 3->4 -->
  <path class="arrow" d="M 570,105 L 600,105" marker-end="url(#tri)"/>
  <text class="rule-text" x="573" y="98">&#948;</text>

  <!-- State 4: Result -->
  <rect class="state-box" x="605" y="50" width="155" height="110"/>
  <rect class="highlight" x="609" y="54" width="147" height="102"/>
  <text class="state-label" x="615" y="72">State 4 &#8212; done</text>
  <text class="comp-key" x="615" y="95">C</text>
  <text class="result" x="635" y="95">5</text>
  <text class="comp-key" x="615" y="115">E</text>
  <text class="component" x="635" y="115">{x &#8614; 4}</text>
  <text class="comp-key" x="615" y="135">K</text>
  <text class="component" x="635" y="135">K&#8320; (halt)</text>

  <!-- Rule annotation -->
  <rect class="state-box" x="20" y="190" width="740" height="55" stroke-dasharray="6 3"/>
  <text class="desc" x="30" y="210">Key rule (&#946;v application):</text>
  <text class="component" x="30" y="230">&#10216;(&#955;x. e) v, E, K&#10217;  &#10230;  &#10216;e, E[x &#8614; v], K&#10217;</text>
  <text class="desc" x="450" y="230">bind x to v in environment, evaluate body e</text>

  <!-- Step annotations -->
  <text class="desc" x="20" y="275">1. Decompose application into operator and operand</text>
  <text class="desc" x="20" y="290">2. Apply &#946;v: extend environment with x &#8614; 4, switch control to body</text>
  <text class="desc" x="20" y="305">3. Look up x in environment, reduce x + 1 to 4 + 1</text>
  <text class="desc" x="20" y="320">4. Perform &#948;-reduction (arithmetic): 4 + 1 = 5, halt via K&#8320;</text>
</svg>