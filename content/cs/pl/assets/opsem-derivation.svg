<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .title { font-size: 14px; font-weight: 700; fill: #e8e8e8; text-anchor: middle; }
    .section-title { font-size: 11px; fill: #58a6ff; font-weight: 700; text-anchor: start; }
    .expr { font-size: 12px; fill: #e8e8e8; text-anchor: middle; font-weight: 600; }
    .expr-sm { font-size: 11px; fill: #e8e8e8; text-anchor: middle; font-weight: 600; }
    .rule-name { font-size: 10px; fill: #84a59d; font-weight: 700; text-anchor: start; }
    .premise { font-size: 11px; fill: #c9d1d9; text-anchor: middle; font-weight: 600; }
    .premise-sm { font-size: 10px; fill: #c9d1d9; text-anchor: middle; font-weight: 600; }
    .conclusion { font-size: 12px; fill: #e8e8e8; text-anchor: middle; font-weight: 700; }
    .condition { font-size: 10px; fill: #d29922; text-anchor: start; font-weight: 600; }
    .anno { font-size: 10px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    .sub { font-size: 9px; fill: #8b949e; text-anchor: middle; font-style: italic; }
    .deriv-line { stroke: #58a6ff; stroke-width: 1.5; }
    .deriv-line-hl { stroke: #84a59d; stroke-width: 2; }
    .rule-box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 6; }
    .rule-box-hl { fill: rgba(30,40,55,0.95); stroke: #84a59d; stroke-width: 1.5; rx: 6; }
    .node-result { fill: rgba(30,40,55,0.95); stroke: #3fb950; stroke-width: 2; rx: 6; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .arrow { fill: #93a3b8; }

    @media (prefers-color-scheme: light) {
      .title { fill: #1a1a2e; }
      .section-title { fill: #284b63; }
      .expr, .expr-sm { fill: #1a1a2e; }
      .rule-name { fill: #4a7c6f; }
      .premise, .premise-sm { fill: #24292f; }
      .conclusion { fill: #1a1a2e; }
      .condition { fill: #9e6000; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
      .sub { fill: #6e7781; }
      .deriv-line { stroke: #284b63; }
      .deriv-line-hl { stroke: #4a7c6f; }
      .rule-box { fill: #f6f8fa; stroke: #284b63; }
      .rule-box-hl { fill: #f6f8fa; stroke: #4a7c6f; }
      .node-result { fill: #f6f8fa; stroke: #1a7f37; }
      .sep { stroke: #e5e5e5; }
      .edge { stroke: #b8b8b8; }
      .arrow { fill: #b8b8b8; }
    }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow" />
    </marker>
  </defs>

  <!-- Main Title -->
  <text x="390" y="24" class="title">Inference Rules for Arithmetic Small-Step Semantics</text>

  <!-- ============================================================ -->
  <!-- THREE RULES SIDE BY SIDE                                     -->
  <!-- ============================================================ -->
  <text x="30" y="52" class="section-title">The Three Rules</text>

  <!-- Rule 1: E-Plus1 -->
  <rect x="20" y="62" width="230" height="100" class="rule-box" />
  <text x="135" y="82" class="rule-name" style="text-anchor:middle">E-Plus1</text>
  <text x="135" y="104" class="premise">t&#x2081; &#x2192; t&#x2081;&#x2032;</text>
  <line x1="50" y1="112" x2="220" y2="112" class="deriv-line" />
  <text x="135" y="132" class="conclusion">t&#x2081; + t&#x2082; &#x2192; t&#x2081;&#x2032; + t&#x2082;</text>
  <text x="135" y="152" class="sub">reduce left operand first</text>

  <!-- Rule 2: E-Plus2 -->
  <rect x="275" y="62" width="230" height="100" class="rule-box" />
  <text x="390" y="82" class="rule-name" style="text-anchor:middle">E-Plus2</text>
  <text x="390" y="104" class="premise">t&#x2082; &#x2192; t&#x2082;&#x2032;</text>
  <line x1="305" y1="112" x2="475" y2="112" class="deriv-line" />
  <text x="390" y="132" class="conclusion">v&#x2081; + t&#x2082; &#x2192; v&#x2081; + t&#x2082;&#x2032;</text>
  <text x="390" y="152" class="sub">left is value; reduce right</text>

  <!-- Rule 3: E-PlusV (axiom) -->
  <rect x="530" y="62" width="230" height="100" class="rule-box-hl" />
  <text x="645" y="82" class="rule-name" style="text-anchor:middle">E-PlusV</text>
  <text x="645" y="104" class="desc">(no premises &#x2014; axiom)</text>
  <line x1="560" y1="112" x2="730" y2="112" class="deriv-line-hl" />
  <text x="645" y="132" class="conclusion">n&#x2081; + n&#x2082; &#x2192; n&#x2083;</text>
  <text x="645" y="152" class="condition" style="text-anchor:middle">where n&#x2083; = n&#x2081; + n&#x2082;</text>

  <!-- ============================================================ -->
  <!-- SEPARATOR                                                    -->
  <!-- ============================================================ -->
  <line x1="20" y1="180" x2="760" y2="180" class="sep" />

  <!-- ============================================================ -->
  <!-- CONCRETE DERIVATION TREE: (1+2) + (3+4)                     -->
  <!-- ============================================================ -->
  <text x="30" y="204" class="section-title">Derivation Tree for (1+2) + (3+4)</text>
  <text x="390" y="204" class="sub">reading top-down: premises justify each conclusion</text>

  <!-- ======== STEP 1: (1+2)+(3+4) → 3+(3+4) via E-Plus1 ======== -->

  <!-- Inner derivation: 1+2 → 3 (E-PlusV) -->
  <text x="200" y="244" class="premise-sm">(1+2=3)</text>
  <line x1="145" y1="250" x2="256" y2="250" class="deriv-line-hl" />
  <text x="270" y="248" class="rule-name" style="font-size:9px">E-PlusV</text>
  <text x="200" y="268" class="premise">1 + 2 &#x2192; 3</text>

  <!-- Outer: use E-Plus1 to lift into (1+2)+(3+4) → 3+(3+4) -->
  <line x1="80" y1="276" x2="540" y2="276" class="deriv-line" />
  <text x="560" y="274" class="rule-name" style="font-size:9px">E-Plus1</text>
  <text x="310" y="296" class="conclusion">(1 + 2) + (3 + 4) &#x2192; 3 + (3 + 4)</text>

  <!-- ======== STEP 2: 3+(3+4) → 3+7 via E-Plus2 ======== -->

  <!-- Arrow between steps -->
  <text x="390" y="320" class="anno">&#x2193; then apply next rule to the result</text>

  <!-- Inner derivation: 3+4 → 7 (E-PlusV) -->
  <text x="200" y="352" class="premise-sm">(3+4=7)</text>
  <line x1="145" y1="358" x2="256" y2="358" class="deriv-line-hl" />
  <text x="270" y="356" class="rule-name" style="font-size:9px">E-PlusV</text>
  <text x="200" y="376" class="premise">3 + 4 &#x2192; 7</text>

  <!-- Outer: E-Plus2 lifts into 3+(3+4) → 3+7 -->
  <line x1="80" y1="384" x2="480" y2="384" class="deriv-line" />
  <text x="500" y="382" class="rule-name" style="font-size:9px">E-Plus2</text>
  <text x="280" y="404" class="conclusion">3 + (3 + 4) &#x2192; 3 + 7</text>

  <!-- ======== STEP 3: 3+7 → 10 via E-PlusV ======== -->

  <text x="390" y="428" class="anno">&#x2193; both sides are values</text>

  <text x="280" y="458" class="premise-sm">(3+7=10)</text>
  <line x1="215" y1="464" x2="346" y2="464" class="deriv-line-hl" />
  <text x="362" y="462" class="rule-name" style="font-size:9px">E-PlusV</text>
  <text x="280" y="484" class="conclusion">3 + 7 &#x2192; 10</text>

  <!-- Final result box -->
  <rect x="460" y="470" width="280" height="48" class="node-result" />
  <text x="600" y="490" class="expr">Full trace:</text>
  <text x="600" y="508" class="expr-sm">(1+2)+(3+4) &#x2192; 3+(3+4) &#x2192; 3+7 &#x2192; 10</text>

  <!-- Connecting arrow to result -->
  <line x1="346" y1="484" x2="456" y2="490" class="edge" marker-end="url(#arr)" />

  <!-- ============================================================ -->
  <!-- BOTTOM: Summary of evaluation order                          -->
  <!-- ============================================================ -->
  <line x1="20" y1="536" x2="760" y2="536" class="sep" />
  <text x="390" y="554" class="sub">Left-to-right evaluation: E-Plus1 forces left operand to a value before E-Plus2 can fire on the right</text>
</svg>