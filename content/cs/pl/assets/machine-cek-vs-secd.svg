<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .machine-box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 6; }
    .comp-box { fill: rgba(40,55,75,0.9); stroke: #58a6ff; stroke-width: 1; rx: 4; }
    .highlight-box { fill: rgba(63,185,80,0.12); stroke: #3fb950; stroke-width: 1.5; rx: 4; }
    .title { font-size: 13px; fill: #d29922; font-weight: 600; }
    .machine-title { font-size: 11px; fill: #58a6ff; font-weight: 600; }
    .comp-label { font-size: 11px; fill: #d29922; font-weight: 600; }
    .comp-desc { font-size: 9px; fill: #e8e8e8; }
    .arrow { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .flow-arrow { stroke: #58a6ff; stroke-width: 1.2; fill: none; }
    .highlight-arrow { stroke: #3fb950; stroke-width: 1.8; fill: none; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; }
    .diff-text { font-size: 9px; fill: #3fb950; font-weight: 600; }
    .vs-text { font-size: 14px; fill: #8b949e; font-weight: 600; }
    @media (prefers-color-scheme: light) {
      .machine-box { fill: #1a1a2e; stroke: #284b63; }
      .comp-box { fill: #222244; stroke: #284b63; }
      .highlight-box { fill: #2da44e15; stroke: #2da44e; }
      .title { fill: #9e6000; }
      .machine-title { fill: #284b63; }
      .comp-label { fill: #9e6000; }
      .arrow { stroke: #b8b8b8; }
      .flow-arrow { stroke: #284b63; }
      .highlight-arrow { stroke: #2da44e; }
      .desc { fill: #6e7781; }
      .diff-text { fill: #1a7f37; }
      .vs-text { fill: #6e7781; }
    }
  </style>
  <defs>
    <marker id="tri" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#93a3b8"/>
    </marker>
    <marker id="triBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="triGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="20" y="28">CEK vs SECD &#8212; component and data-flow comparison</text>

  <!-- ===== CEK SIDE (LEFT) ===== -->
  <rect class="machine-box" x="20" y="44" width="360" height="310"/>
  <text class="machine-title" x="163" y="66">CEK Machine</text>

  <!-- C box -->
  <rect class="comp-box" x="40" y="80" width="120" height="50"/>
  <text class="comp-label" x="70" y="102">Control</text>
  <text class="comp-desc" x="52" y="120">expression</text>

  <!-- E box -->
  <rect class="comp-box" x="40" y="150" width="120" height="50"/>
  <text class="comp-label" x="52" y="172">Environment</text>
  <text class="comp-desc" x="52" y="190">var &#8614; value</text>

  <!-- K box (highlighted) -->
  <rect class="highlight-box" x="40" y="220" width="120" height="65"/>
  <text class="comp-label" x="42" y="242">Kontinuation</text>
  <text class="comp-desc" x="52" y="258">explicit frames</text>
  <text class="diff-text" x="52" y="274">&#9733; explicit K</text>

  <!-- CEK data flow arrows (inner gutter) -->
  <path class="flow-arrow" d="M 160,105 L 200,105 L 200,145 L 160,155" marker-end="url(#triBlue)"/>
  <text class="desc" x="205" y="130">eval in E</text>

  <path class="flow-arrow" d="M 160,175 L 210,175 L 210,225 L 160,230" marker-end="url(#triBlue)"/>
  <text class="desc" x="215" y="205">resume via K</text>

  <!-- Difference arrow rides its own outer gutter so its caption never shares a band -->
  <path class="highlight-arrow" d="M 100,220 L 100,216 Q 100,212 104,212 L 300,212 L 300,115 L 160,115" marker-end="url(#triGreen)" stroke-dasharray="5 3"/>
  <text class="diff-text" x="308" y="145">K drives</text>
  <text class="diff-text" x="308" y="157">next step</text>

  <!-- CEK description -->
  <text class="desc" x="40" y="310">Continuation is a first-class</text>
  <text class="desc" x="40" y="323">data structure &#8212; enables CPS</text>
  <text class="desc" x="40" y="336">reasoning and tail-call proofs.</text>

  <!-- VS divider -->
  <text class="vs-text" x="390" y="200">vs</text>

  <!-- ===== SECD SIDE (RIGHT) ===== -->
  <rect class="machine-box" x="420" y="44" width="360" height="310"/>
  <text class="machine-title" x="563" y="66">SECD Machine</text>

  <!-- S box -->
  <rect class="comp-box" x="440" y="80" width="120" height="44"/>
  <text class="comp-label" x="475" y="100">Stack</text>
  <text class="comp-desc" x="450" y="116">operands</text>

  <!-- E box -->
  <rect class="comp-box" x="440" y="136" width="120" height="44"/>
  <text class="comp-label" x="452" y="156">Environment</text>
  <text class="comp-desc" x="450" y="172">var &#8614; value</text>

  <!-- C box -->
  <rect class="comp-box" x="440" y="192" width="120" height="44"/>
  <text class="comp-label" x="465" y="212">Control</text>
  <text class="comp-desc" x="450" y="228">instructions</text>

  <!-- D box (highlighted) -->
  <rect class="highlight-box" x="440" y="248" width="120" height="60"/>
  <text class="comp-label" x="475" y="268">Dump</text>
  <text class="comp-desc" x="450" y="284">saved states</text>
  <text class="diff-text" x="450" y="300">&#9733; implicit D</text>

  <!-- SECD data flow arrows (inner gutter) -->
  <path class="flow-arrow" d="M 560,102 L 600,102 L 600,142 L 560,148" marker-end="url(#triBlue)"/>
  <text class="desc" x="605" y="128">push/pop</text>

  <path class="flow-arrow" d="M 560,158 L 610,158 L 610,200 L 560,204" marker-end="url(#triBlue)"/>
  <text class="desc" x="615" y="182">fetch next</text>

  <!-- Difference arrow rides its own outer gutter so its caption never shares a band -->
  <path class="highlight-arrow" d="M 500,248 L 500,244 Q 500,240 504,240 L 710,240 L 710,102 L 560,102" marker-end="url(#triGreen)" stroke-dasharray="5 3"/>
  <text class="diff-text" x="718" y="145">D saves/</text>
  <text class="diff-text" x="718" y="157">restores</text>
  <text class="diff-text" x="718" y="169">full state</text>

  <!-- SECD description -->
  <text class="desc" x="440" y="330">Dump acts as an implicit call</text>
  <text class="desc" x="440" y="343">stack &#8212; save on call, restore on return.</text>

  <!-- Key difference callout -->
  <rect class="machine-box" x="20" y="370" width="760" height="38" stroke-dasharray="6 3"/>
  <text class="desc" x="30" y="392">Key difference: CEK continuations are explicit (K = inspectable data);  SECD keeps them implicit (D = opaque saved state).</text>
</svg>
