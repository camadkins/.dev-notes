<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .layer { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 6; }
    .layer-label { font-size: 12px; fill: #e8e8e8; font-weight: 600; text-anchor: start; }
    .layer-example { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: start; }
    .anno-left { font-size: 10px; fill: #d29922; font-weight: 600; text-anchor: end; }
    .anno-right { font-size: 10px; fill: #84a59d; font-weight: 600; text-anchor: start; }
    .arrow-anno { stroke: #d29922; stroke-width: 1.5; fill: none; }
    .arrow-anno-r { stroke: #84a59d; stroke-width: 1.5; fill: none; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    @media (prefers-color-scheme: light) {
      .layer { fill: #1a1a2e; stroke: #284b63; }
      .layer-label { fill: #e8e8e8; }
      .layer-example { fill: #6e7781; }
      .anno-left { fill: #9e6000; }
      .anno-right { fill: #4a7c6f; }
      .arrow-anno { stroke: #9e6000; }
      .arrow-anno-r { stroke: #4a7c6f; }
      .desc { fill: #6e7781; }
    }
  </style>

  <defs>
  </defs>

  <!-- Layer 5 (top): Meta-Languages -->
  <rect class="layer" x="120" y="30" width="380" height="55" rx="6"/>
  <text class="layer-label" x="140" y="55">Meta-Languages</text>
  <text class="layer-example" x="140" y="72">BNF, EBNF, LLVM IR, Template Haskell</text>

  <!-- Layer 4: Domain-Specific Languages -->
  <rect class="layer" x="120" y="105" width="380" height="55" rx="6"/>
  <text class="layer-label" x="140" y="130">Domain-Specific Languages</text>
  <text class="layer-example" x="140" y="147">SQL, HTML, Verilog, MATLAB</text>

  <!-- Layer 3: High-Level Languages -->
  <rect class="layer" x="120" y="180" width="380" height="55" rx="6"/>
  <text class="layer-label" x="140" y="205">High-Level Languages</text>
  <text class="layer-example" x="140" y="222">C, Java, Python, Haskell, Rust</text>

  <!-- Layer 2: Assembly Language -->
  <rect class="layer" x="120" y="255" width="380" height="55" rx="6"/>
  <text class="layer-label" x="140" y="280">Assembly Language</text>
  <text class="layer-example" x="140" y="297">x86, ARM, MIPS, RISC-V</text>

  <!-- Layer 1 (bottom): Machine Code -->
  <rect class="layer" x="120" y="330" width="380" height="55" rx="6"/>
  <text class="layer-label" x="140" y="355">Machine Code</text>
  <text class="layer-example" x="140" y="372">Binary opcodes (10110000 01100001)</text>

  <!-- Left annotation: abstraction arrow going up -->
  <text class="anno-left" x="55" y="210" text-anchor="middle" transform="rotate(-90,55,210)">abstraction</text>
  <line class="arrow-anno" x1="75" y1="370" x2="75" y2="50"/>
  <polygon points="75,38 69,52 81,52" fill="#d29922"/>

  <!-- Right annotation: hardware control arrow going down -->
  <text class="anno-right" x="565" y="210" text-anchor="middle" transform="rotate(90,565,210)">hardware control</text>
  <line class="arrow-anno-r" x1="545" y1="45" x2="545" y2="365"/>
  <polygon points="545,378 539,364 551,364" fill="#84a59d"/>

  <!-- Bottom description -->
  <text class="desc" x="310" y="408">Each level trades control for convenience, efficiency for portability</text>
</svg>