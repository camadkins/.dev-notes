<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" fill="none">
  <style>
    /* Grid constants */
    /* colW=220, colGap=30, padX=30, padY=30 */
    /* rowH=56, headerH=64, titleH=48 */

    .title       { font: bold 16px 'SF Mono','Fira Code','Consolas',monospace; fill: #e8e8e8; }
    .col-header  { font: bold 13px 'SF Mono','Fira Code','Consolas',monospace; fill: #e8e8e8; }
    .row-label   { font: bold 11px 'SF Mono','Fira Code','Consolas',monospace; fill: #d29922; }
    .cell-text   { font: 11px 'SF Mono','Fira Code','Consolas',monospace; fill: #8b949e; }
    .node-fill   { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 6; }
    .header-fill { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 2; rx: 8; }
    .sep         { stroke: #30363d; stroke-dasharray: 6,4; stroke-width: 1; }

    @media (prefers-color-scheme: light) {
      .title       { fill: #1a1a2e; }
      .col-header  { fill: #1a1a2e; }
      .row-label   { fill: #9a6700; }
      .cell-text   { fill: #4a5060; }
      .node-fill   { fill: rgba(240,244,250,0.95); stroke: #2563eb; }
      .header-fill { fill: rgba(235,240,250,0.95); stroke: #2563eb; }
      .sep         { stroke: #c8cdd5; }
    }
  </style>

  <!-- Title -->
  <text x="390" y="32" text-anchor="middle" class="title">Concurrency Models Compared</text>

  <!-- Separator below title -->
  <line x1="30" y1="48" x2="750" y2="48" class="sep"/>

  <!-- Column headers -->
  <!-- Col 1: x=30, Col 2: x=280, Col 3: x=530, each w=220 -->
  <rect x="30"  y="60" width="220" height="52" class="header-fill"/>
  <rect x="280" y="60" width="220" height="52" class="header-fill"/>
  <rect x="530" y="60" width="220" height="52" class="header-fill"/>

  <text x="140" y="82"  text-anchor="middle" class="col-header">Threads + Locks</text>
  <text x="140" y="98"  text-anchor="middle" class="cell-text">C, C++, Java</text>
  <text x="390" y="82"  text-anchor="middle" class="col-header">Actors</text>
  <text x="390" y="98"  text-anchor="middle" class="cell-text">Erlang, Akka, Orleans</text>
  <text x="640" y="82"  text-anchor="middle" class="col-header">CSP</text>
  <text x="640" y="98"  text-anchor="middle" class="cell-text">Go, Rust crossbeam</text>

  <!-- Row 1: Memory Sharing — y=132 -->
  <text x="30" y="146" class="row-label">Memory</text>
  <rect x="30"  y="152" width="220" height="44" class="node-fill"/>
  <rect x="280" y="152" width="220" height="44" class="node-fill"/>
  <rect x="530" y="152" width="220" height="44" class="node-fill"/>
  <text x="140" y="178" text-anchor="middle" class="cell-text">Shared heap</text>
  <text x="390" y="178" text-anchor="middle" class="cell-text">Isolated mailboxes</text>
  <text x="640" y="178" text-anchor="middle" class="cell-text">Explicit channels</text>

  <!-- Separator -->
  <line x1="30" y1="208" x2="750" y2="208" class="sep"/>

  <!-- Row 2: Synchronization — y=220 -->
  <text x="30" y="228" class="row-label">Synchronization</text>
  <rect x="30"  y="234" width="220" height="44" class="node-fill"/>
  <rect x="280" y="234" width="220" height="44" class="node-fill"/>
  <rect x="530" y="234" width="220" height="44" class="node-fill"/>
  <text x="140" y="260" text-anchor="middle" class="cell-text">Locks, monitors</text>
  <text x="390" y="260" text-anchor="middle" class="cell-text">Message order</text>
  <text x="640" y="260" text-anchor="middle" class="cell-text">Channel operations</text>

  <!-- Separator -->
  <line x1="30" y1="290" x2="750" y2="290" class="sep"/>

  <!-- Row 3: Safety — y=302 -->
  <text x="30" y="310" class="row-label">Safety</text>
  <rect x="30"  y="316" width="220" height="44" class="node-fill"/>
  <rect x="280" y="316" width="220" height="44" class="node-fill"/>
  <rect x="530" y="316" width="220" height="44" class="node-fill"/>
  <text x="140" y="342" text-anchor="middle" class="cell-text">Manual discipline</text>
  <text x="390" y="342" text-anchor="middle" class="cell-text">Data-race free</text>
  <text x="640" y="342" text-anchor="middle" class="cell-text">Structured communication</text>

  <!-- Separator -->
  <line x1="30" y1="372" x2="750" y2="372" class="sep"/>

  <!-- Row 4: Performance — y=384 -->
  <text x="30" y="392" class="row-label">Performance</text>
  <rect x="30"  y="398" width="220" height="44" class="node-fill"/>
  <rect x="280" y="398" width="220" height="44" class="node-fill"/>
  <rect x="530" y="398" width="220" height="44" class="node-fill"/>
  <text x="140" y="424" text-anchor="middle" class="cell-text">Very fast</text>
  <text x="390" y="424" text-anchor="middle" class="cell-text">Moderate</text>
  <text x="640" y="424" text-anchor="middle" class="cell-text">Moderate</text>

  <!-- Separator -->
  <line x1="30" y1="454" x2="750" y2="454" class="sep"/>

  <!-- Row 5: Reasoning — y=466 -->
  <text x="30" y="474" class="row-label">Reasoning</text>
  <rect x="30"  y="480" width="220" height="32" class="node-fill"/>
  <rect x="280" y="480" width="220" height="32" class="node-fill"/>
  <rect x="530" y="480" width="220" height="32" class="node-fill"/>
  <text x="140" y="500" text-anchor="middle" class="cell-text">Difficult</text>
  <text x="390" y="500" text-anchor="middle" class="cell-text">Localized</text>
  <text x="640" y="500" text-anchor="middle" class="cell-text">Composable</text>
</svg>