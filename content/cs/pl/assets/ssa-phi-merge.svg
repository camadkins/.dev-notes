<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" fill="none" role="img" aria-label="A diamond control-flow graph in which two branches define y1 and y2, and the merge block introduces a phi function selecting between them">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .box      { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .box-final{ fill: rgba(30,55,40,0.6);  stroke: #84a59d; stroke-width: 1.5; }
    .edge     { stroke: #93a3b8; stroke-width: 1.4; }
    .node     { fill: #58a6ff; }
    .t        { fill: #e8e8e8; font-size: 14px; }
    .anno     { fill: #d29922; font-size: 12px; }
    .desc     { fill: #8b949e; font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93a3b8"/>
    </marker>
  </defs>

  <rect class="box" x="215" y="20" width="190" height="46" rx="4"/>
  <text class="t" x="310" y="49" text-anchor="middle">if x &lt; 0.5</text>

  <rect class="box" x="60" y="140" width="180" height="46" rx="4"/>
  <text class="t" x="150" y="169" text-anchor="middle">y1 := 1</text>

  <rect class="box" x="380" y="140" width="180" height="46" rx="4"/>
  <text class="t" x="470" y="169" text-anchor="middle">y2 := 2</text>

  <rect class="box-final" x="185" y="262" width="250" height="70" rx="4"/>
  <text class="t" x="310" y="290" text-anchor="middle">y3 := &#934;(y1, y2)</text>
  <text class="t" x="310" y="314" text-anchor="middle">print y3</text>

  <path class="edge" d="M 265 66 L 150 132" marker-end="url(#a)"/>
  <path class="edge" d="M 355 66 L 470 132" marker-end="url(#a)"/>
  <path class="edge" d="M 150 186 L 250 254" marker-end="url(#a)"/>
  <path class="edge" d="M 470 186 L 370 254" marker-end="url(#a)"/>

  <circle class="node" cx="310" cy="66" r="3.5"/>

  <text class="anno" x="310" y="234" text-anchor="middle">merge point: two definitions of y reach here</text>
  <text class="desc" x="310" y="352" text-anchor="middle">&#934; picks the value from whichever predecessor block executed</text>
</svg>
