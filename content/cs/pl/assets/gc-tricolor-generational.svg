<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" fill="none">
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .title { font-size: 14px; font-weight: 700; fill: #e8e8e8; text-anchor: middle; }
    .label { font-size: 12px; font-weight: 600; fill: #e8e8e8; text-anchor: middle; }
    .label-left { font-size: 12px; font-weight: 600; fill: #e8e8e8; }
    .sm { font-size: 10px; fill: #c9d1d9; text-anchor: middle; }
    .sm-left { font-size: 10px; fill: #c9d1d9; }
    .anno { font-size: 10px; fill: #d29922; text-anchor: middle; font-weight: 600; }
    .anno-left { font-size: 10px; fill: #d29922; font-weight: 600; }
    .desc { font-size: 10px; fill: #8b949e; text-anchor: middle; font-style: italic; }
    .desc-left { font-size: 10px; fill: #8b949e; font-style: italic; }
    .tag { font-size: 9px; fill: #58a6ff; text-anchor: middle; font-weight: 600; }
    .inv { font-size: 11px; fill: #f85149; text-anchor: middle; font-weight: 700; }
    .inv-ok { font-size: 11px; fill: #3fb950; text-anchor: middle; font-weight: 600; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .edge-barrier { stroke: #d29922; stroke-width: 1.5; fill: none; marker-end: url(#arr-w); stroke-dasharray: 5 3; }
    .edge-viol { stroke: #f85149; stroke-width: 2; fill: none; marker-end: url(#arr-r); stroke-dasharray: 4 2; }
    .edge-ref { stroke: #93a3b8; stroke-width: 1.2; fill: none; marker-end: url(#arr); }
    .edge-rs { stroke: #d29922; stroke-width: 1.5; fill: none; marker-end: url(#arr-w); }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .region { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 6; }
    .region-young { fill: rgba(30,40,55,0.95); stroke: #3fb950; stroke-width: 1.5; rx: 6; }
    .region-old { fill: rgba(30,40,55,0.95); stroke: #d29922; stroke-width: 1.5; rx: 6; }
    .inv-box { fill: rgba(248,81,73,0.08); stroke: #f85149; stroke-width: 1.5; rx: 6; }

    /* Tri-color node fills (dark theme) */
    .node-white { fill: rgba(200,200,200,0.12); stroke: #8b949e; stroke-width: 1.5; }
    .node-grey { fill: rgba(147,163,184,0.35); stroke: #93a3b8; stroke-width: 2; }
    .node-black { fill: rgba(88,166,255,0.25); stroke: #58a6ff; stroke-width: 2; }

    @media (prefers-color-scheme: light) {
      .title { fill: #1a1a2e; }
      .label, .label-left { fill: #1a1a2e; }
      .sm, .sm-left { fill: #24292f; }
      .anno, .anno-left { fill: #9a6700; }
      .desc, .desc-left { fill: #6e7781; }
      .tag { fill: #284b63; }
      .inv { fill: #cf222e; }
      .inv-ok { fill: #1a7f37; }
      .edge { stroke: #8b8b8b; }
      .edge-barrier { stroke: #9a6700; }
      .edge-viol { stroke: #cf222e; }
      .edge-ref { stroke: #8b8b8b; }
      .edge-rs { stroke: #9a6700; }
      .sep { stroke: #e5e5e5; }
      .region { fill: #f6f8fa; stroke: #284b63; }
      .region-young { fill: #f6f8fa; stroke: #1a7f37; }
      .region-old { fill: #f6f8fa; stroke: #9a6700; }
      .inv-box { fill: rgba(207,34,46,0.06); stroke: #cf222e; }
      .node-white { fill: #ffffff; stroke: #8b8b8b; }
      .node-grey { fill: #d0d7de; stroke: #6e7781; }
      .node-black { fill: #24292f; stroke: #1a1a2e; }
      .node-black text { fill: #ffffff; }
    }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#93a3b8"/>
    </marker>
    <marker id="arr-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d29922"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- ==================== TOP PANEL: TRI-COLOR MARKING ==================== -->
  <text x="390" y="30" class="title">Tri-Color Marking Invariant</text>

  <!-- Legend -->
  <circle cx="140" cy="52" r="8" class="node-black"/>
  <text x="140" y="55" class="sm" style="font-size:8px;fill:#e8e8e8">A</text>
  <text x="165" y="56" class="sm-left">Black (scanned)</text>

  <circle cx="320" cy="52" r="8" class="node-grey"/>
  <text x="320" y="55" class="sm" style="font-size:8px">G</text>
  <text x="345" y="56" class="sm-left">Grey (discovered)</text>

  <circle cx="510" cy="52" r="8" class="node-white"/>
  <text x="510" y="55" class="sm" style="font-size:8px">W</text>
  <text x="535" y="56" class="sm-left">White (unreached)</text>

  <!-- === Left sub-panel: Valid marking state === -->
  <rect x="30" y="72" width="340" height="190" rx="8" fill="none" stroke="#3fb950" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="200" y="90" class="inv-ok">Valid State</text>

  <!-- Root -->
  <text x="60" y="112" class="tag">root</text>
  <path d="M60,116 L60,128" class="edge"/>

  <!-- Black node A (root, fully scanned) -->
  <circle cx="60" cy="142" r="16" class="node-black"/>
  <text x="60" y="147" class="label">A</text>

  <!-- Grey node B (discovered, children not all scanned) -->
  <circle cx="160" cy="142" r="16" class="node-grey"/>
  <text x="160" y="147" class="label">B</text>

  <!-- White node C (not yet reached) -->
  <circle cx="280" cy="142" r="16" class="node-white"/>
  <text x="280" y="147" class="label">C</text>

  <!-- Grey node D -->
  <circle cx="110" cy="210" r="16" class="node-grey"/>
  <text x="110" y="215" class="label">D</text>

  <!-- White node E -->
  <circle cx="220" cy="210" r="16" class="node-white"/>
  <text x="220" y="215" class="label">E</text>

  <!-- Edges: A->B (black->grey OK) -->
  <path d="M76,142 L140,142" class="edge"/>
  <text x="108" y="135" class="desc" style="font-size:9px">ok</text>

  <!-- B->C (grey->white OK) -->
  <path d="M176,142 L260,142" class="edge"/>
  <text x="218" y="135" class="desc" style="font-size:9px">ok</text>

  <!-- B->D (grey->grey OK) -->
  <path d="M150,155 L120,198" class="edge"/>

  <!-- D->E (grey->white OK) -->
  <path d="M126,210 L200,210" class="edge"/>

  <text x="200" y="250" class="desc">Black only points to grey</text>

  <!-- === Right sub-panel: Violation === -->
  <rect x="400" y="72" width="350" height="190" rx="8" fill="none" stroke="#f85149" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="575" y="90" class="inv">Violation (needs write barrier)</text>

  <!-- Black node X -->
  <circle cx="460" cy="142" r="16" class="node-black"/>
  <text x="460" y="147" class="label">X</text>

  <!-- White node Y - black->white is the violation -->
  <circle cx="610" cy="142" r="16" class="node-white"/>
  <text x="610" y="147" class="label">Y</text>

  <!-- Grey node Z -->
  <circle cx="535" cy="210" r="16" class="node-grey"/>
  <text x="535" y="215" class="label">Z</text>

  <!-- X->Y VIOLATION edge -->
  <path d="M476,142 L590,142" class="edge-viol"/>
  <text x="533" y="133" class="inv" style="font-size:9px">black-&gt;white!</text>

  <!-- X->Z ok -->
  <path d="M470,155 L525,198" class="edge"/>

  <!-- Write barrier fix annotation -->
  <path d="M610,158 Q610,210 551,210" class="edge-barrier"/>
  <text x="640" y="188" class="anno-left" style="font-size:9px">barrier</text>
  <text x="640" y="200" class="anno-left" style="font-size:9px">shades Y</text>
  <text x="640" y="212" class="anno-left" style="font-size:9px">grey</text>

  <!-- Invariant box -->
  <rect x="130" y="270" width="520" height="28" rx="6" fill="none" stroke="#f85149" stroke-width="0.75" stroke-dasharray="6 3"/>
  <text x="390" y="289" class="inv">Invariant: no black object may point directly to a white object</text>

  <!-- ==================== SEPARATOR ==================== -->
  <line x1="30" y1="310" x2="750" y2="310" class="sep"/>

  <!-- ==================== BOTTOM PANEL: GENERATIONAL HEAP ==================== -->
  <text x="390" y="335" class="title">Generational Heap Layout</text>

  <!-- Young Generation region -->
  <rect x="30" y="370" width="440" height="160" class="region-young"/>
  <text x="250" y="390" class="label" style="fill:#3fb950">Young Generation (minor GC)</text>

  <!-- Eden -->
  <rect x="50" y="402" width="120" height="110" class="region"/>
  <text x="110" y="420" class="tag">Eden</text>
  <text x="110" y="436" class="sm">new allocs</text>

  <!-- Small objects in eden -->
  <rect x="65" y="445" width="30" height="14" rx="3" class="node-white"/>
  <text x="80" y="455" class="sm" style="font-size:8px">obj</text>
  <rect x="100" y="445" width="30" height="14" rx="3" class="node-white"/>
  <text x="115" y="455" class="sm" style="font-size:8px">obj</text>
  <rect x="65" y="465" width="30" height="14" rx="3" class="node-white"/>
  <text x="80" y="475" class="sm" style="font-size:8px">obj</text>
  <rect x="100" y="465" width="30" height="14" rx="3" class="node-grey"/>
  <text x="115" y="475" class="sm" style="font-size:8px">obj</text>
  <rect x="65" y="485" width="30" height="14" rx="3" class="node-white"/>
  <text x="80" y="495" class="sm" style="font-size:8px">obj</text>

  <!-- From-space -->
  <rect x="190" y="402" width="120" height="110" class="region"/>
  <text x="250" y="420" class="tag">From-space</text>
  <text x="250" y="436" class="sm">survivors</text>

  <rect x="205" y="450" width="36" height="14" rx="3" class="node-grey"/>
  <text x="223" y="460" class="sm" style="font-size:8px">surv</text>
  <rect x="250" y="450" width="36" height="14" rx="3" class="node-grey"/>
  <text x="268" y="460" class="sm" style="font-size:8px">surv</text>

  <!-- To-space -->
  <rect x="340" y="402" width="110" height="110" class="region"/>
  <text x="395" y="420" class="tag">To-space</text>
  <text x="395" y="436" class="sm">copy target</text>

  <text x="395" y="475" class="desc">(empty at</text>
  <text x="395" y="488" class="desc">start)</text>

  <!-- Copy arrow from-space -> to-space -->
  <path d="M312,470 L340,470" class="edge"/>
  <text x="326" y="463" class="desc" style="font-size:8px">copy</text>

  <!-- Promotion arrow from survivor to old gen -->
  <path d="M268,466 L268,517 Q268,525 276,525 L502,525 Q510,525 510,517 L510,460" class="edge-barrier"/>
  <text x="400" y="540" class="anno" style="font-size:9px">promote (survived N cycles)</text>

  <!-- Old Generation region -->
  <rect x="490" y="370" width="260" height="160" class="region-old"/>
  <text x="620" y="390" class="label" style="fill:#d29922">Old Generation (major GC)</text>

  <!-- Objects in old gen -->
  <rect x="510" y="410" width="44" height="18" rx="3" class="node-black"/>
  <text x="532" y="423" class="sm" style="font-size:8px">long</text>
  <rect x="564" y="410" width="44" height="18" rx="3" class="node-black"/>
  <text x="586" y="423" class="sm" style="font-size:8px">lived</text>
  <rect x="618" y="410" width="44" height="18" rx="3" class="node-black"/>
  <text x="640" y="423" class="sm" style="font-size:8px">obj</text>
  <rect x="672" y="410" width="44" height="18" rx="3" class="node-black"/>
  <text x="694" y="423" class="sm" style="font-size:8px">obj</text>

  <rect x="510" y="438" width="44" height="18" rx="3" class="node-black"/>
  <text x="532" y="451" class="sm" style="font-size:8px">obj</text>
  <rect x="564" y="438" width="44" height="18" rx="3" class="node-black"/>
  <text x="586" y="451" class="sm" style="font-size:8px">obj</text>

  <!-- Remembered set: old->young pointer (own band between the panel title and the heap) -->
  <path d="M532,410 L532,373 Q532,365 524,365 L118,365 Q110,365 110,373 L110,402" class="edge-rs"/>
  <text x="320" y="360" class="anno" style="font-size:8px">old-&gt;young ref (remembered set)</text>

  <!-- Write barrier annotation -->
  <rect x="510" y="470" width="220" height="44" rx="4" fill="rgba(210,153,34,0.08)" stroke="#d29922" stroke-width="1"/>
  <text x="620" y="486" class="anno">Write barrier records</text>
  <text x="620" y="500" class="anno">old-&gt;young pointers in card table</text>

  <!-- Collection timeline -->
  <text x="390" y="565" class="title">Collection Timeline</text>

  <!-- Timeline bar -->
  <rect x="60" y="575" width="660" height="6" rx="3" fill="rgba(147,163,184,0.2)" stroke="#30363d" stroke-width="1"/>

  <!-- Minor GC ticks (frequent) -->
  <line x1="120" y1="572" x2="120" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="180" y1="572" x2="180" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="240" y1="572" x2="240" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="300" y1="572" x2="300" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="360" y1="572" x2="360" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="420" y1="572" x2="420" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="480" y1="572" x2="480" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="540" y1="572" x2="540" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="600" y1="572" x2="600" y2="588" stroke="#3fb950" stroke-width="2"/>
  <line x1="660" y1="572" x2="660" y2="588" stroke="#3fb950" stroke-width="2"/>

  <!-- Major GC ticks (rare) -->
  <line x1="360" y1="568" x2="360" y2="592" stroke="#d29922" stroke-width="3"/>
  <line x1="660" y1="568" x2="660" y2="592" stroke="#d29922" stroke-width="3"/>

  <!-- Timeline labels -->
  <text x="120" y="605" class="sm" style="fill:#3fb950;font-size:9px">minor</text>
  <text x="360" y="620" class="anno" style="font-size:9px">major</text>
  <text x="660" y="620" class="anno" style="font-size:9px">major</text>

  <!-- Footer -->
  <text x="390" y="636" class="desc">Weak generational hypothesis: most objects die young, so minor GC is frequent and fast</text>
</svg>