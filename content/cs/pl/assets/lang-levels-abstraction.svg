<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .axis { stroke: #58a6ff; stroke-width: 1.5; fill: none; }
    .grid { stroke: #30363d; stroke-width: 0.5; stroke-dasharray: 3 4; }
    .dot { fill: #58a6ff; stroke: #e8e8e8; stroke-width: 1.5; }
    .dot-label { font-size: 11px; fill: #e8e8e8; font-weight: 600; text-anchor: middle; }
    .dot-sub { font-size: 8px; fill: #8b949e; text-anchor: middle; font-style: italic; }
    .axis-label { font-size: 11px; fill: #d29922; font-weight: 600; }
    .tick { font-size: 8px; fill: #8b949e; text-anchor: middle; }
    .tick-y { font-size: 8px; fill: #8b949e; text-anchor: end; }
    .trend { stroke: #84a59d; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .trend-label { font-size: 8px; fill: #84a59d; font-style: italic; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    @media (prefers-color-scheme: light) {
      .axis { stroke: #284b63; }
      .grid { stroke: #e5e5e5; }
      .dot { fill: #284b63; stroke: #1a1a2e; }
      .dot-label { fill: #1a1a2e; }
      .dot-sub { fill: #6e7781; }
      .axis-label { fill: #9e6000; }
      .tick { fill: #6e7781; }
      .tick-y { fill: #6e7781; }
      .trend { stroke: #4a7c6f; }
      .trend-label { fill: #4a7c6f; }
      .desc { fill: #6e7781; }
    }
  </style>

  <defs>
    <marker id="ax-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Plot area: x=80..500, y=40..320 -->
  <!-- Origin at bottom-left: (80, 320) -->

  <!-- Grid lines (horizontal) -->
  <line class="grid" x1="80" y1="250" x2="540" y2="250"/>
  <line class="grid" x1="80" y1="180" x2="540" y2="180"/>
  <line class="grid" x1="80" y1="110" x2="540" y2="110"/>

  <!-- Grid lines (vertical) -->
  <line class="grid" x1="185" y1="40" x2="185" y2="320"/>
  <line class="grid" x1="290" y1="40" x2="290" y2="320"/>
  <line class="grid" x1="395" y1="40" x2="395" y2="320"/>
  <line class="grid" x1="500" y1="40" x2="500" y2="320"/>

  <!-- X-axis -->
  <line class="axis" x1="80" y1="320" x2="550" y2="320" marker-end="url(#ax-arrow)"/>
  <text class="axis-label" x="310" y="365" text-anchor="middle">Abstraction</text>

  <!-- Y-axis -->
  <line class="axis" x1="80" y1="330" x2="80" y2="32" marker-end="url(#ax-arrow)"/>
  <text class="axis-label" x="30" y="180" text-anchor="middle" transform="rotate(-90 30 180)">Control</text>

  <!-- X-axis ticks -->
  <text class="tick" x="80" y="340">Low</text>
  <text class="tick" x="290" y="340">Medium</text>
  <text class="tick" x="540" y="340">High</text>

  <!-- Y-axis ticks -->
  <text class="tick-y" x="72" y="323">Low</text>
  <text class="tick-y" x="72" y="183">Medium</text>
  <text class="tick-y" x="72" y="43">High</text>

  <!-- Data points -->
  <!-- Machine Code: low abstraction, high control -->
  <circle class="dot" cx="110" cy="65" r="8"/>
  <text class="dot-label" x="110" y="50">Machine</text>
  <text class="dot-sub" x="110" y="90">binary opcodes</text>

  <!-- Assembly: slightly more abstraction, still high control -->
  <circle class="dot" cx="170" cy="95" r="8"/>
  <text class="dot-label" x="170" y="80">Assembly</text>
  <text class="dot-sub" x="170" y="120">mnemonics</text>

  <!-- C: medium/medium -->
  <circle class="dot" cx="260" cy="170" r="8"/>
  <text class="dot-label" x="260" y="155">C</text>
  <text class="dot-sub" x="260" y="195">portable systems</text>

  <!-- C++: medium-high abstraction, medium-high control -->
  <circle class="dot" cx="305" cy="130" r="6"/>
  <text class="dot-label" x="305" y="117">C++</text>
  <text class="dot-sub" x="305" y="148">systems + OOP</text>

  <!-- Rust: medium-high abstraction, medium-high control -->
  <circle class="dot" cx="345" cy="145" r="6"/>
  <text class="dot-label" x="345" y="132">Rust</text>
  <text class="dot-sub" x="345" y="163">safe systems</text>

  <!-- Java/Python: high abstraction, low control -->
  <circle class="dot" cx="380" cy="245" r="7"/>
  <text class="dot-label" x="380" y="232">Java</text>
  <text class="dot-sub" x="380" y="265">managed runtime</text>

  <!-- Python: high abstraction, lower control -->
  <circle class="dot" cx="420" cy="265" r="7"/>
  <text class="dot-label" x="420" y="252">Python</text>
  <text class="dot-sub" x="420" y="285">interpreted</text>

  <!-- Haskell: high abstraction, medium-low control -->
  <circle class="dot" cx="445" cy="210" r="6"/>
  <text class="dot-label" x="445" y="197">Haskell</text>
  <text class="dot-sub" x="445" y="228">pure functional</text>

  <!-- SQL: very high abstraction, very low control -->
  <circle class="dot" cx="480" cy="300" r="7"/>
  <text class="dot-label" x="480" y="285">SQL</text>
  <text class="dot-sub" x="480" y="318">declarative</text>

  <!-- Prolog: very high abstraction, low control -->
  <circle class="dot" cx="510" cy="290" r="6"/>
  <text class="dot-label" x="530" y="284">Prolog</text>
  <text class="dot-sub" x="530" y="296">logic</text>

  <!-- Trend line removed per review -->

  <!-- Bottom description -->
  <text class="desc" x="290" y="390">Higher abstraction generally means less hardware control</text>
</svg>