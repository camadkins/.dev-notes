<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .node-ok { fill: rgba(30,55,40,0.95); stroke: #84a59d; stroke-width: 1.5; }
    .node-wild { fill: rgba(55,45,20,0.95); stroke: #d29922; stroke-width: 1.5; }
    .node-warn { fill: rgba(55,30,30,0.95); stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .node-text { font-size: 11px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .edge-ok { stroke: #84a59d; stroke-width: 1.5; fill: none; }
    .edge-wild { stroke: #d29922; stroke-width: 1.5; fill: none; }
    .edge-warn { stroke: #f85149; stroke-width: 1.5; fill: none; stroke-dasharray: 4 2; }
    .anno { font-size: 11px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .title { font-size: 12px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .check { font-size: 14px; fill: #84a59d; font-weight: 700; text-anchor: middle; }
    .warn-txt { font-size: 14px; fill: #f85149; font-weight: 700; text-anchor: middle; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    .badge { font-size: 9px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: light) {
      .node { fill: #1a1a2e; stroke: #284b63; }
      .node-ok { fill: #1a2e1a; stroke: #3a6b4a; }
      .node-wild { fill: #2e2a1a; stroke: #9e6000; }
      .node-warn { fill: #2e1a1a; stroke: #da3633; stroke-dasharray: 4 2; }
      .edge { stroke: #b8b8b8; }
      .edge-ok { stroke: #3a6b4a; }
      .edge-wild { stroke: #9e6000; }
      .edge-warn { stroke: #da3633; }
      .anno { fill: #9e6000; }
      .title { fill: #9e6000; }
      .check { fill: #3a6b4a; }
      .warn-txt { fill: #da3633; }
      .desc { fill: #6e7781; }
      .sep { stroke: #e5e5e5; }
    }
  </style>

  <!-- ========== PANEL 1: Exhaustive (all 3 explicit) ========== -->
  <text class="title" x="200" y="28">Exhaustive: all cases handled</text>

  <!-- Root: shape -->
  <rect class="node" x="150" y="50" width="100" height="30" rx="4"/>
  <text class="node-text" x="200" y="65">shape</text>

  <!-- Branch: Circle -->
  <line class="edge-ok" x1="175" y1="80" x2="80" y2="130"/>
  <rect class="node-ok" x="30" y="130" width="100" height="30" rx="4"/>
  <text class="node-text" x="80" y="145">Circle r</text>

  <!-- Branch: Square -->
  <line class="edge-ok" x1="200" y1="80" x2="200" y2="130"/>
  <rect class="node-ok" x="150" y="130" width="100" height="30" rx="4"/>
  <text class="node-text" x="200" y="145">Square a</text>

  <!-- Branch: Rectangle -->
  <line class="edge-ok" x1="225" y1="80" x2="320" y2="130"/>
  <rect class="node-ok" x="270" y="130" width="120" height="30" rx="4"/>
  <text class="node-text" x="330" y="145">Rect (w,h)</text>

  <!-- Checkmarks under each -->
  <text class="check" x="80" y="180">&#x2713; matched</text>
  <text class="check" x="200" y="180">&#x2713; matched</text>
  <text class="check" x="330" y="180">&#x2713; matched</text>

  <!-- Result badge -->
  <rect class="node-ok" x="140" y="200" width="120" height="28" rx="14"/>
  <text class="badge" x="200" y="214">exhaustive &#x2713;</text>

  <!-- Separator -->
  <line class="sep" x1="410" y1="20" x2="410" y2="240"/>

  <!-- ========== PANEL 2: Wildcard coverage ========== -->
  <text class="title" x="615" y="28">Wildcard: Circle + _</text>

  <!-- Root: shape -->
  <rect class="node" x="565" y="50" width="100" height="30" rx="4"/>
  <text class="node-text" x="615" y="65">shape</text>

  <!-- Branch: Circle (explicit match) -->
  <line class="edge-ok" x1="590" y1="80" x2="495" y2="130"/>
  <rect class="node-ok" x="445" y="130" width="100" height="30" rx="4"/>
  <text class="node-text" x="495" y="145">Circle r</text>

  <!-- Branch: Square (covered by _) -->
  <line class="edge-wild" x1="615" y1="80" x2="615" y2="130"/>
  <rect class="node-wild" x="565" y="130" width="100" height="30" rx="4"/>
  <text class="node-text" x="615" y="145">Square a</text>

  <!-- Branch: Rectangle (covered by _) -->
  <line class="edge-wild" x1="640" y1="80" x2="735" y2="130"/>
  <rect class="node-wild" x="675" y="130" width="120" height="30" rx="4"/>
  <text class="node-text" x="735" y="145">Rect (w,h)</text>

  <!-- Annotations -->
  <text class="check" x="495" y="180">&#x2713; explicit</text>
  <text class="anno" x="615" y="180">_ wildcard</text>
  <text class="anno" x="735" y="180">_ wildcard</text>

  <!-- Result badge -->
  <rect class="node-ok" x="555" y="200" width="120" height="28" rx="14"/>
  <text class="badge" x="615" y="214">exhaustive &#x2713;</text>

  <!-- ========== PANEL 3: Missing case (bottom, full width) ========== -->
  <line class="sep" x1="20" y1="255" x2="800" y2="255"/>
  <text class="title" x="410" y="280">Non-exhaustive: missing case</text>

  <!-- Root: shape -->
  <rect class="node" x="360" y="295" width="100" height="30" rx="4"/>
  <text class="node-text" x="410" y="310">shape</text>

  <!-- Branch: Circle (matched) -->
  <line class="edge-ok" x1="385" y1="325" x2="250" y2="370"/>
  <rect class="node-ok" x="200" y="370" width="100" height="30" rx="4"/>
  <text class="node-text" x="250" y="385">Circle r</text>

  <!-- Branch: Square (matched) -->
  <line class="edge-ok" x1="410" y1="325" x2="410" y2="370"/>
  <rect class="node-ok" x="360" y="370" width="100" height="30" rx="4"/>
  <text class="node-text" x="410" y="385">Square a</text>

  <!-- Branch: Rectangle (MISSING!) -->
  <line class="edge-warn" x1="435" y1="325" x2="570" y2="370"/>
  <rect class="node-warn" x="510" y="370" width="120" height="30" rx="4"/>
  <text class="node-text" x="570" y="385">Rect (w,h)</text>

  <!-- Annotations -->
  <text class="check" x="250" y="418">&#x2713;</text>
  <text class="check" x="410" y="418">&#x2713;</text>
  <text class="warn-txt" x="570" y="418">&#x2717; missing!</text>

  <!-- Warning badge -->
  <rect class="node-warn" x="345" y="425" width="130" height="24" rx="12"/>
  <text class="badge" x="410" y="437" fill="#f85149">warning: inexhaustive</text>

  <!-- Bottom caption -->
  <!-- <text class="desc" x="410" y="430">compiler warns about unhandled Rectangle case</text> -->
</svg>
