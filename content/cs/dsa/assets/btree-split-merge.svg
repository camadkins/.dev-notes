<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 320" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node-box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 4; }
    .node-text { font-size: 12px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .anno { font-size: 10px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .sep-line { stroke: #58a6ff; stroke-width: 1; opacity: 0.4; }
    .overflow-box { fill: rgba(30,40,55,0.95); stroke: #f85149; stroke-width: 2; rx: 4; }
    .promote-arrow { stroke: #d29922; stroke-width: 1.5; fill: none; marker-end: url(#arrowGold); }
    .highlight-box { fill: rgba(30,40,55,0.95); stroke: #84a59d; stroke-width: 2; rx: 4; }
    @media (prefers-color-scheme: light) {
      .node-box { fill: #1a1a2e; stroke: #284b63; }
      .edge { stroke: #b8b8b8; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
      .sep { stroke: #e5e5e5; }
      .sep-line { stroke: #284b63; opacity: 0.4; }
      .overflow-box { fill: #1a1a2e; stroke: #d1242f; }
      .highlight-box { fill: #1a1a2e; stroke: #3a7a6a; }
    }
  </style>

  <defs>
    <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d29922" />
    </marker>
  </defs>

  <!-- Grid: 3 panels, each ~265px wide
       Panel 1: x=20..275  center=148
       Panel 2: x=285..545 center=415
       Panel 3: x=555..810 center=683
       Separators at x=280, x=550
       Depth 0 (root): y=86 (rect y=70, h=32)
       Depth 1 (children): y=180 (rect y=164, h=32)
  -->

  <!-- ============ PANEL 1: Before ============ -->
  <text x="148" y="28" class="anno">1. Before Insert</text>
  <text x="148" y="44" class="desc">order-3 B-tree (max 2 keys/node)</text>

  <!-- Root: [10] centered at (148, 86) -->
  <rect x="118" y="70" width="60" height="32" class="node-box"/>
  <text x="148" y="86" class="node-text">10</text>

  <!-- Left child: [3, 7] centered at (88, 180) -->
  <rect x="48" y="164" width="80" height="32" class="node-box"/>
  <line x1="88" y1="164" x2="88" y2="196" class="sep-line"/>
  <text x="68" y="180" class="node-text">3</text>
  <text x="108" y="180" class="node-text">7</text>

  <!-- Right child: [20, 30] centered at (208, 180) -->
  <rect x="168" y="164" width="80" height="32" class="node-box"/>
  <line x1="208" y1="164" x2="208" y2="196" class="sep-line"/>
  <text x="188" y="180" class="node-text">20</text>
  <text x="228" y="180" class="node-text">30</text>

  <!-- Edges from [10] to children -->
  <line x1="131" y1="102" x2="98" y2="164" class="edge"/>
  <line x1="165" y1="102" x2="198" y2="164" class="edge"/>

  <!-- Annotation: inserting 15 -->
  <text x="208" y="218" class="desc">insert 15 here</text>
  <line x1="208" y1="205" x2="208" y2="196" class="promote-arrow"/>

  <!-- ============ SEPARATOR 1 ============ -->
  <line x1="280" y1="20" x2="280" y2="295" class="sep"/>

  <!-- ============ PANEL 2: Overflow ============ -->
  <text x="415" y="28" class="anno">2. Overflow</text>
  <text x="415" y="44" class="desc">node exceeds max 2 keys</text>

  <!-- Root: [10] centered at (415, 86) -->
  <rect x="385" y="70" width="60" height="32" class="node-box"/>
  <text x="415" y="86" class="node-text">10</text>

  <!-- Left child: [3, 7] centered at (345, 180) -->
  <rect x="305" y="164" width="80" height="32" class="node-box"/>
  <line x1="345" y1="164" x2="345" y2="196" class="sep-line"/>
  <text x="325" y="180" class="node-text">3</text>
  <text x="365" y="180" class="node-text">7</text>

  <!-- Right child OVERFLOW: [15, 20, 30] centered at (475, 180) -->
  <rect x="420" y="164" width="110" height="32" class="overflow-box"/>
  <line x1="457" y1="164" x2="457" y2="196" class="sep-line"/>
  <line x1="494" y1="164" x2="494" y2="196" class="sep-line"/>
  <text x="438" y="180" class="node-text">15</text>
  <text x="475" y="180" class="node-text" fill="#f85149" font-weight="bold">20</text>
  <text x="512" y="180" class="node-text">30</text>

  <!-- Edges -->
  <line x1="398" y1="102" x2="355" y2="164" class="edge"/>
  <line x1="432" y1="102" x2="460" y2="164" class="edge"/>

  <!-- Overflow annotation -->
  <text x="475" y="218" class="desc" fill="#f85149">3 keys &gt; m-1 = 2</text>

  <!-- ============ SEPARATOR 2 ============ -->
  <line x1="550" y1="20" x2="550" y2="295" class="sep"/>

  <!-- ============ PANEL 3: After Split ============ -->
  <text x="690" y="28" class="anno">3. Split + Promote</text>
  <text x="690" y="44" class="desc">middle key promoted to parent</text>

  <!-- Root: [10, 20] centered at (690, 86) — 20 promoted -->
  <rect x="650" y="70" width="80" height="32" class="highlight-box"/>
  <line x1="690" y1="70" x2="690" y2="102" class="sep-line"/>
  <text x="670" y="86" class="node-text">10</text>
  <text x="710" y="86" class="node-text" fill="#84a59d" font-weight="bold">20</text>

  <!-- Left child: [3, 7] centered at (610, 185) -->
  <rect x="570" y="169" width="80" height="32" class="node-box"/>
  <line x1="610" y1="169" x2="610" y2="201" class="sep-line"/>
  <text x="590" y="185" class="node-text">3</text>
  <text x="630" y="185" class="node-text">7</text>

  <!-- Middle child: [15] centered at (710, 185) -->
  <rect x="685" y="169" width="50" height="32" class="node-box"/>
  <text x="710" y="185" class="node-text">15</text>

  <!-- Right child: [30] centered at (785, 185) -->
  <rect x="760" y="169" width="50" height="32" class="node-box"/>
  <text x="785" y="185" class="node-text">30</text>

  <!-- Edges from root [10,20] to three children -->
  <line x1="660" y1="102" x2="620" y2="169" class="edge"/>
  <line x1="690" y1="102" x2="710" y2="169" class="edge"/>
  <line x1="720" y1="102" x2="775" y2="169" class="edge"/>

  <!-- Promote arrow from panel 2 overflow to panel 3 root -->
  <path d="M 475,158 C 475,128 690,128 705,102" class="promote-arrow"/>
  <text x="585" y="122" class="anno" font-size="9">promote 20</text>

  <!-- Bottom labels -->
  <text x="148" y="290" class="desc">Valid order-3 B-tree</text>
  <text x="415" y="290" class="desc">Overflow after insertion</text>
  <text x="690" y="290" class="desc">Balanced after split</text>
</svg>