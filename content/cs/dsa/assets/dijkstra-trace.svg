<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 950" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .node-popped { fill: rgba(88,166,255,0.25); stroke: #58a6ff; stroke-width: 2.5; }
    .node-text { font-size: 11px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .edge { stroke: #93a3b8; stroke-width: 1; fill: none; }
    .edge-relaxed { stroke: #58a6ff; stroke-width: 2; fill: none; }
    .edge-weight { font-size: 8px; fill: #8b949e; text-anchor: middle; dominant-baseline: central; }
    .edge-weight-relaxed { font-size: 8px; fill: #58a6ff; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .anno { font-size: 10px; fill: #d29922; font-weight: 600; }
    .anno-left { font-size: 10px; fill: #d29922; font-weight: 600; text-anchor: start; }
    .anno-mid { font-size: 10px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: start; }
    .step-label { font-size: 11px; fill: #7b97aa; font-weight: 700; text-anchor: start; }
    .pq-text { font-size: 9px; fill: #e8e8e8; text-anchor: start; }
    .dist-text { font-size: 9px; fill: #84a59d; text-anchor: start; }
    .dist-update { font-size: 8px; fill: #84a59d; text-anchor: start; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .title { font-size: 12px; fill: #7b97aa; font-weight: 600; text-anchor: middle; }
    .header { font-size: 9px; fill: #8b949e; font-weight: 600; text-anchor: start; }
    .callout-box { fill: rgba(20,25,35,0.9); stroke: #30363d; stroke-width: 1; rx: 4; }
    .arrow { fill: #93a3b8; }
    .arrow-relaxed { fill: #58a6ff; }
    @media (prefers-color-scheme: light) {
      .node { fill: #1a1a2e; stroke: #284b63; }
      .node-popped { fill: rgba(40,75,99,0.25); stroke: #284b63; }
      .edge { stroke: #d1d5db; }
      .edge-relaxed { stroke: #284b63; }
      .edge-weight { fill: #9ca3af; }
      .edge-weight-relaxed { fill: #284b63; }
      .anno, .anno-left, .anno-mid { fill: #9e6000; }
      .desc { fill: #6e7781; }
      .step-label { fill: #284b63; }
      .pq-text { fill: #1a1a2e; }
      .dist-text { fill: #4a7c6f; }
      .dist-update { fill: #4a7c6f; }
      .sep { stroke: #e5e5e5; }
      .title { fill: #284b63; }
      .header { fill: #6e7781; }
      .callout-box { fill: rgba(240,240,245,0.95); stroke: #e5e5e5; }
      .arrow { fill: #d1d5db; }
      .arrow-relaxed { fill: #284b63; }
    }
  </style>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" class="arrow" />
    </marker>
    <marker id="arr-r" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" class="arrow-relaxed" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="26" class="title">Dijkstra's Trace: s->a:4, s->b:2, b->a:1, b->d:7, a->c:3, c->d:2, c->e:5, d->e:1</text>

  <!-- Column headers -->
  <text x="30" y="50" class="header">STEP</text>
  <text x="110" y="50" class="header">GRAPH (relaxed edges bold)</text>
  <text x="360" y="50" class="header">PQ BEFORE POP</text>
  <text x="560" y="50" class="header">DIST UPDATES</text>

  <!-- ============================================================ -->
  <!-- STEP 1: Init + Pop s                                          -->
  <!-- Row y-offset: 60                                              -->
  <!-- Graph mini: s=130,90  a=100,130  b=160,130                   -->
  <!--             c=80,170  d=130,170  e=180,170                   -->
  <!-- Node r=14                                                     -->
  <!-- ============================================================ -->
  <line x1="20" y1="58" x2="760" y2="58" class="sep" />

  <text x="30" y="78" class="step-label">1</text>
  <text x="30" y="92" class="desc">Pop s</text>

  <!-- Mini graph 1 -->
  <!-- edges (all dim except s->a and s->b which are relaxed) -->
  <line x1="124" y1="101" x2="107" y2="119" class="edge-relaxed" marker-end="url(#arr-r)" />
  <text x="108" y="106" class="edge-weight-relaxed">4</text>
  <line x1="136" y1="101" x2="153" y2="119" class="edge-relaxed" marker-end="url(#arr-r)" />
  <text x="153" y="106" class="edge-weight-relaxed">2</text>
  <line x1="114" y1="130" x2="146" y2="130" class="edge" marker-end="url(#arr)" />
  <text x="130" y="123" class="edge-weight">1</text>
  <line x1="157" y1="141" x2="137" y2="159" class="edge" marker-end="url(#arr)" />
  <text x="153" y="153" class="edge-weight">7</text>
  <line x1="94" y1="141" x2="84" y2="159" class="edge" marker-end="url(#arr)" />
  <text x="82" y="150" class="edge-weight">3</text>
  <line x1="94" y1="170" x2="116" y2="170" class="edge" marker-end="url(#arr)" />
  <text x="106" y="163" class="edge-weight">2</text>
  <path d="M 91,178 C 115,198 145,198 168,178" class="edge" marker-end="url(#arr)" />
  <text x="130" y="205" class="edge-weight">5</text>
  <line x1="144" y1="170" x2="166" y2="170" class="edge" marker-end="url(#arr)" />
  <text x="156" y="163" class="edge-weight">1</text>
  <!-- nodes -->
  <circle cx="130" cy="90" r="14" class="node-popped" />
  <text x="130" y="90" class="node-text">s</text>
  <circle cx="100" cy="130" r="14" class="node" />
  <text x="100" y="130" class="node-text">a</text>
  <circle cx="160" cy="130" r="14" class="node" />
  <text x="160" y="130" class="node-text">b</text>
  <circle cx="80" cy="170" r="14" class="node" />
  <text x="80" y="170" class="node-text">c</text>
  <circle cx="130" cy="170" r="14" class="node" />
  <text x="130" y="170" class="node-text">d</text>
  <circle cx="180" cy="170" r="14" class="node" />
  <text x="180" y="170" class="node-text">e</text>

  <!-- PQ and dist info -->
  <text x="360" y="80" class="pq-text">[(s, 0)]</text>
  <text x="360" y="98" class="anno-left">pop s (finalize dist=0)</text>
  <text x="560" y="80" class="dist-update">dist[a] = 0+4 = 4</text>
  <text x="560" y="96" class="dist-update">dist[b] = 0+2 = 2</text>
  <text x="560" y="116" class="pq-text">PQ after: [(b,2), (a,4)]</text>

  <!-- ============================================================ -->
  <!-- STEP 2: Pop b                                                 -->
  <!-- Row y-offset: 190                                             -->
  <!-- ============================================================ -->
  <line x1="20" y1="192" x2="760" y2="192" class="sep" />

  <text x="30" y="212" class="step-label">2</text>
  <text x="30" y="226" class="desc">Pop b</text>

  <!-- Mini graph 2 -->
  <line x1="124" y1="231" x2="107" y2="249" class="edge" marker-end="url(#arr)" />
  <text x="108" y="236" class="edge-weight">4</text>
  <line x1="136" y1="231" x2="153" y2="249" class="edge" marker-end="url(#arr)" />
  <text x="153" y="236" class="edge-weight">2</text>
  <line x1="146" y1="260" x2="114" y2="260" class="edge-relaxed" marker-end="url(#arr-r)" />
  <text x="130" y="253" class="edge-weight-relaxed">1</text>
  <line x1="157" y1="271" x2="137" y2="289" class="edge-relaxed" marker-end="url(#arr-r)" />
  <text x="153" y="283" class="edge-weight-relaxed">7</text>
  <line x1="94" y1="271" x2="84" y2="289" class="edge" marker-end="url(#arr)" />
  <text x="82" y="280" class="edge-weight">3</text>
  <line x1="94" y1="300" x2="116" y2="300" class="edge" marker-end="url(#arr)" />
  <text x="106" y="293" class="edge-weight">2</text>
  <path d="M 91,308 C 115,328 145,328 168,308" class="edge" marker-end="url(#arr)" />
  <text x="130" y="335" class="edge-weight">5</text>
  <line x1="144" y1="300" x2="166" y2="300" class="edge" marker-end="url(#arr)" />
  <text x="156" y="293" class="edge-weight">1</text>
  <!-- nodes -->
  <circle cx="130" cy="220" r="14" class="node" />
  <text x="130" y="220" class="node-text">s</text>
  <circle cx="100" cy="260" r="14" class="node" />
  <text x="100" y="260" class="node-text">a</text>
  <circle cx="160" cy="260" r="14" class="node-popped" />
  <text x="160" y="260" class="node-text">b</text>
  <circle cx="80" cy="300" r="14" class="node" />
  <text x="80" y="300" class="node-text">c</text>
  <circle cx="130" cy="300" r="14" class="node" />
  <text x="130" y="300" class="node-text">d</text>
  <circle cx="180" cy="300" r="14" class="node" />
  <text x="180" y="300" class="node-text">e</text>

  <text x="360" y="214" class="pq-text">[(b,2), (a,4)]</text>
  <text x="360" y="232" class="anno-left">pop b (finalize dist=2)</text>
  <text x="560" y="214" class="dist-update">dist[a] = 2+1 = 3 (was 4)</text>
  <text x="560" y="230" class="dist-update">dist[d] = 2+7 = 9 (was inf)</text>
  <text x="560" y="250" class="pq-text">PQ after: [(a,3), (d,9)]</text>

  <!-- ============================================================ -->
  <!-- STEP 3: Pop a                                                 -->
  <!-- Row y-offset: 320                                             -->
