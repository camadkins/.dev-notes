  <!-- nodes -->
  <circle cx="130" cy="740" r="14" class="node" />
  <text x="130" y="740" class="node-text">s</text>
  <circle cx="100" cy="780" r="14" class="node" />
  <text x="100" y="780" class="node-text">a</text>
  <circle cx="160" cy="780" r="14" class="node" />
  <text x="160" y="780" class="node-text">b</text>
  <circle cx="80" cy="820" r="14" class="node" />
  <text x="80" y="820" class="node-text">c</text>
