  <line x1="20" y1="322" x2="760" y2="322" class="sep" />

  <text x="30" y="342" class="step-label">3</text>
  <text x="30" y="356" class="desc">Pop a</text>

  <!-- Mini graph 3 -->
  <line x1="124" y1="361" x2="107" y2="379" class="edge" marker-end="url(#arr)" />
  <text x="108" y="366" class="edge-weight">4</text>
  <line x1="136" y1="361" x2="153" y2="379" class="edge" marker-end="url(#arr)" />
  <text x="153" y="366" class="edge-weight">2</text>
  <line x1="146" y1="390" x2="114" y2="390" class="edge" marker-end="url(#arr)" />
  <text x="130" y="383" class="edge-weight">1</text>
  <line x1="157" y1="401" x2="137" y2="419" class="edge" marker-end="url(#arr)" />
