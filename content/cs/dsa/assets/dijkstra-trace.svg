  <line x1="94" y1="430" x2="116" y2="430" class="edge" marker-end="url(#arr)" />
  <text x="106" y="423" class="edge-weight">2</text>
  <path d="M 91,438 C 115,458 145,458 168,438" class="edge" marker-end="url(#arr)" />
  <text x="130" y="465" class="edge-weight">5</text>
  <line x1="144" y1="430" x2="166" y2="430" class="edge" marker-end="url(#arr)" />
  <text x="156" y="423" class="edge-weight">1</text>
  <!-- nodes -->
  <circle cx="130" cy="350" r="14" class="node" />
  <text x="130" y="350" class="node-text">s</text>
  <circle cx="100" cy="390" r="14" class="node-popped" />
  <text x="100" y="390" class="node-text">a</text>
  <circle cx="160" cy="390" r="14" class="node" />
  <text x="160" y="390" class="node-text">b</text>
  <circle cx="80" cy="430" r="14" class="node" />
  <text x="80" y="430" class="node-text">c</text>
  <circle cx="130" cy="430" r="14" class="node" />
  <text x="130" y="430" class="node-text">d</text>
  <circle cx="180" cy="430" r="14" class="node" />
  <text x="180" y="430" class="node-text">e</text>

  <text x="360" y="344" class="pq-text">[(a,3), (d,9)]</text>
  <text x="360" y="362" class="anno-left">pop a (finalize dist=3)</text>
  <text x="560" y="344" class="dist-update">dist[c] = 3+3 = 6 (was inf)</text>
  <text x="560" y="364" class="pq-text">PQ after: [(c,6), (d,9)]</text>

  <!-- ============================================================ -->
  <!-- STEP 4: Pop c                                                 -->
  <!-- Row y-offset: 450                                             -->
  <!-- ============================================================ -->
  <line x1="20" y1="452" x2="760" y2="452" class="sep" />

  <text x="30" y="472" class="step-label">4</text>
  <text x="30" y="486" class="desc">Pop c</text>

  <!-- Mini graph 4 -->
  <line x1="124" y1="491" x2="107" y2="509" class="edge" marker-end="url(#arr)" />
