  <circle cx="180" cy="820" r="14" class="node-popped" />
  <text x="180" y="820" class="node-text">e</text>

  <text x="360" y="734" class="pq-text">[(e,9)]</text>
  <text x="360" y="752" class="anno-left">pop e (finalize dist=9)</text>
  <text x="560" y="734" class="dist-update">no improvements (e has no outgoing)</text>
  <text x="560" y="754" class="pq-text">PQ after: [] (empty, done)</text>

  <!-- ============================================================ -->
  <!-- FINAL DISTANCES                                               -->
  <!-- ============================================================ -->
  <!-- Dropped 21px: the final panel's curved-edge weight sits at y=855, which put it
       inside the summary box. -->
  <line x1="20" y1="866" x2="760" y2="866" class="sep" />

  <rect x="30" y="876" width="720" height="50" class="callout-box" rx="4" />
  <text x="390" y="895" class="anno-mid">Final shortest distances and parents</text>
  <text x="50" y="915" class="dist-text">s:0  b:2 (pi=s)  a:3 (pi=b)  c:6 (pi=a)  d:8 (pi=c)  e:9 (pi=d)</text>
