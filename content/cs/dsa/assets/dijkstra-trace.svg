  <line x1="136" y1="491" x2="153" y2="509" class="edge" marker-end="url(#arr)" />
  <text x="153" y="496" class="edge-weight">2</text>
  <line x1="146" y1="520" x2="114" y2="520" class="edge" marker-end="url(#arr)" />
  <text x="130" y="513" class="edge-weight">1</text>
  <line x1="157" y1="531" x2="137" y2="549" class="edge" marker-end="url(#arr)" />
  <text x="153" y="543" class="edge-weight">7</text>
  <line x1="94" y1="531" x2="84" y2="549" class="edge" marker-end="url(#arr)" />
  <text x="82" y="540" class="edge-weight">3</text>
  <line x1="94" y1="560" x2="116" y2="560" class="edge-relaxed" marker-end="url(#arr-r)" />
  <text x="106" y="553" class="edge-weight-relaxed">2</text>
  <path d="M 91,568 C 115,588 145,588 168,568" class="edge-relaxed" marker-end="url(#arr-r)" />
  <text x="130" y="595" class="edge-weight-relaxed">5</text>
  <line x1="144" y1="560" x2="166" y2="560" class="edge" marker-end="url(#arr)" />
  <text x="156" y="553" class="edge-weight">1</text>
  <!-- nodes -->
  <circle cx="130" cy="480" r="14" class="node" />
  <text x="130" y="480" class="node-text">s</text>
  <circle cx="100" cy="520" r="14" class="node" />
  <text x="100" y="520" class="node-text">a</text>
  <circle cx="160" cy="520" r="14" class="node" />
  <text x="160" y="520" class="node-text">b</text>
  <circle cx="80" cy="560" r="14" class="node-popped" />
  <text x="80" y="560" class="node-text">c</text>
  <circle cx="130" cy="560" r="14" class="node" />
  <text x="130" y="560" class="node-text">d</text>
  <circle cx="180" cy="560" r="14" class="node" />
  <text x="180" y="560" class="node-text">e</text>

  <text x="360" y="474" class="pq-text">[(c,6), (d,9)]</text>
  <text x="360" y="492" class="anno-left">pop c (finalize dist=6)</text>
  <text x="560" y="474" class="dist-update">dist[d] = 6+2 = 8 (was 9)</text>
  <text x="560" y="490" class="dist-update">dist[e] = 6+5 = 11 (was inf)</text>
  <text x="560" y="510" class="pq-text">PQ after: [(d,8), (e,11)]</text>

  <!-- ============================================================ -->
  <!-- STEP 5: Pop d                                                 -->
  <!-- Row y-offset: 580                                             -->
  <!-- ============================================================ -->
  <line x1="20" y1="582" x2="760" y2="582" class="sep" />

  <text x="30" y="602" class="step-label">5</text>
  <text x="30" y="616" class="desc">Pop d</text>

  <!-- Mini graph 5 -->
  <line x1="124" y1="621" x2="107" y2="639" class="edge" marker-end="url(#arr)" />
  <text x="108" y="626" class="edge-weight">4</text>
  <line x1="136" y1="621" x2="153" y2="639" class="edge" marker-end="url(#arr)" />
  <text x="153" y="626" class="edge-weight">2</text>
  <line x1="146" y1="650" x2="114" y2="650" class="edge" marker-end="url(#arr)" />
