  <!-- nodes -->
  <circle cx="130" cy="610" r="14" class="node" />
  <text x="130" y="610" class="node-text">s</text>
  <circle cx="100" cy="650" r="14" class="node" />
  <text x="100" y="650" class="node-text">a</text>
  <circle cx="160" cy="650" r="14" class="node" />
  <text x="160" y="650" class="node-text">b</text>
  <circle cx="80" cy="690" r="14" class="node" />
  <text x="80" y="690" class="node-text">c</text>
  <circle cx="130" cy="690" r="14" class="node-popped" />
  <text x="130" y="690" class="node-text">d</text>
  <circle cx="180" cy="690" r="14" class="node" />
  <text x="180" y="690" class="node-text">e</text>

  <text x="360" y="604" class="pq-text">[(d,8), (e,11)]</text>
  <text x="360" y="622" class="anno-left">pop d (finalize dist=8)</text>
  <text x="560" y="604" class="dist-update">dist[e] = 8+1 = 9 (was 11)</text>
  <text x="560" y="624" class="pq-text">PQ after: [(e,9)]</text>

  <!-- ============================================================ -->
  <!-- STEP 6: Pop e                                                 -->
  <!-- Row y-offset: 710                                             -->
  <!-- ============================================================ -->
  <line x1="20" y1="712" x2="760" y2="712" class="sep" />

  <text x="30" y="732" class="step-label">6</text>
  <text x="30" y="746" class="desc">Pop e</text>

  <!-- Mini graph 6 -->
  <line x1="124" y1="751" x2="107" y2="769" class="edge" marker-end="url(#arr)" />
  <text x="108" y="756" class="edge-weight">4</text>
  <line x1="136" y1="751" x2="153" y2="769" class="edge" marker-end="url(#arr)" />
