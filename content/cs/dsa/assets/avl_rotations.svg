<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 840" fill="none">
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .title { font-size: 16px; font-weight: 700; fill: #58a6ff; }
    .subtitle { font-size: 12px; fill: #93a3b8; }
    .node-text { font-size: 13px; fill: #c9d1d9; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .label { font-size: 11px; fill: #8b949e; text-anchor: middle; dominant-baseline: central; font-style: italic; }
    .arrow-label { font-size: 13px; fill: #3fb950; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .case-label { font-size: 14px; fill: #d29922; font-weight: 700; }
  </style>

  <!-- LL Case (Right Rotation) -->
  <text x="220" y="30" class="title">LL Case → Right Rotation</text>
  <text x="220" y="48" class="subtitle">Left subtree of left child grew</text>

  <!-- Before -->
  <text x="130" y="75" class="case-label">Before</text>
  <!-- y node -->
  <circle cx="150" cy="110" r="20" stroke="#58a6ff" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="150" y="110" class="node-text">y</text>
  <!-- x node -->
  <line x1="135" y1="127" x2="95" y2="155" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="80" cy="170" r="20" stroke="#58a6ff" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="80" y="170" class="node-text">x</text>
  <!-- T3 subtree -->
  <line x1="165" y1="127" x2="205" y2="155" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="220" y="172" class="label">T3</text>
  <path d="M205 158 L220 180 L235 158 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>
  <!-- T1 subtree (grown - highlighted) -->
  <line x1="65" y1="187" x2="35" y2="215" stroke="#d29922" stroke-width="2"/>
  <text x="20" y="232" class="label">T1</text>
  <path d="M20 218 L5 240 L35 240 Z" stroke="#d29922" stroke-width="1.5" fill="rgba(210,153,34,0.15)"/>
  <!-- T2 subtree -->
  <line x1="95" y1="187" x2="125" y2="215" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="140" y="232" class="label">T2</text>
  <path d="M125 218 L140 240 L155 218 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>
  <!-- bf annotation -->
  <text x="178" y="103" font-size="10" fill="#d29922" font-weight="600">bf=+2</text>

  <!-- Arrow -->
  <line x1="260" y1="160" x2="310" y2="160" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3fb950"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#93a3b8"/>
    </marker>
  </defs>

  <!-- After -->
  <text x="390" y="75" class="case-label">After</text>
  <!-- x node (new root) -->
  <circle cx="420" cy="110" r="20" stroke="#3fb950" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="420" y="110" class="node-text">x</text>
  <!-- T1 subtree -->
  <line x1="405" y1="127" x2="365" y2="155" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="350" y="172" class="label">T1</text>
  <path d="M350 158 L335 180 L365 158 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>
  <!-- y node -->
  <line x1="435" y1="127" x2="475" y2="155" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="490" cy="170" r="20" stroke="#58a6ff" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="490" y="170" class="node-text">y</text>
  <!-- T2 subtree -->
  <line x1="475" y1="187" x2="445" y2="215" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="430" y="232" class="label">T2</text>
  <path d="M430 218 L415 240 L445 218 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>
  <!-- T3 subtree -->
  <line x1="505" y1="187" x2="535" y2="215" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="550" y="232" class="label">T3</text>
  <path d="M535 218 L550 240 L565 218 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>

  <!-- Separator -->
  <line x1="40" y1="270" x2="840" y2="270" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RR Case (Left Rotation) -->
  <text x="220" y="300" class="title">RR Case → Left Rotation</text>
  <text x="220" y="318" class="subtitle">Right subtree of right child grew</text>

  <!-- Before -->
  <text x="130" y="345" class="case-label">Before</text>
  <!-- x node -->
  <circle cx="120" cy="380" r="20" stroke="#58a6ff" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="120" y="380" class="node-text">x</text>
  <!-- T1 subtree -->
  <line x1="105" y1="397" x2="65" y2="425" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="50" y="442" class="label">T1</text>
  <path d="M50 428 L35 450 L65 428 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>
  <!-- y node -->
  <line x1="135" y1="397" x2="175" y2="425" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="190" cy="440" r="20" stroke="#58a6ff" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="190" y="440" class="node-text">y</text>
  <!-- T2 subtree -->
  <line x1="175" y1="457" x2="145" y2="485" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="130" y="502" class="label">T2</text>
  <path d="M130 488 L115 510 L145 488 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>
  <!-- T3 subtree (grown) -->
  <line x1="205" y1="457" x2="235" y2="485" stroke="#d29922" stroke-width="2"/>
  <text x="250" y="502" class="label">T3</text>
  <path d="M235 488 L250 510 L265 488 Z" stroke="#d29922" stroke-width="1.5" fill="rgba(210,153,34,0.15)"/>
  <!-- bf annotation -->
  <text x="148" y="373" font-size="10" fill="#d29922" font-weight="600">bf=-2</text>

  <!-- Arrow -->
  <line x1="290" y1="430" x2="340" y2="430" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- After -->
  <text x="420" y="345" class="case-label">After</text>
  <!-- y node (new root) -->
  <circle cx="450" cy="380" r="20" stroke="#3fb950" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="450" y="380" class="node-text">y</text>
  <!-- x node -->
  <line x1="435" y1="397" x2="395" y2="425" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="380" cy="440" r="20" stroke="#58a6ff" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="380" y="440" class="node-text">x</text>
  <!-- T1 -->
  <line x1="365" y1="457" x2="335" y2="485" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="320" y="502" class="label">T1</text>
  <path d="M320 488 L305 510 L335 488 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>
  <!-- T2 -->
  <line x1="395" y1="457" x2="425" y2="485" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="440" y="502" class="label">T2</text>
  <path d="M425 488 L440 510 L455 488 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>
  <!-- T3 -->
  <line x1="465" y1="397" x2="505" y2="425" stroke="#93a3b8" stroke-width="1.5"/>
  <text x="520" y="442" class="label">T3</text>
  <path d="M505 428 L520 450 L535 428 Z" stroke="#93a3b8" stroke-width="1" fill="rgba(30,40,55,0.3)"/>

  <!-- Separator -->
  <line x1="40" y1="540" x2="840" y2="540" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- LR Case (Double Rotation) -->
  <text x="100" y="570" class="title">LR Case → Left-Right</text>
  <text x="100" y="588" class="subtitle">Right subtree of left child grew</text>

  <!-- Step 1 label -->
  <text x="80" y="615" class="case-label">Step 1</text>
  <!-- z node -->
  <circle cx="100" cy="640" r="16" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="100" y="640" class="node-text" font-size="11">z</text>
  <!-- x node -->
  <line x1="88" y1="653" x2="60" y2="672" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="48" cy="684" r="16" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="48" y="684" class="node-text" font-size="11">x</text>
  <!-- y node (problem) -->
  <line x1="60" y1="697" x2="80" y2="710" stroke="#d29922" stroke-width="1.5"/>
  <circle cx="90" cy="718" r="11" stroke="#d29922" stroke-width="1.5" fill="rgba(210,153,34,0.15)"/>
  <text x="90" y="718" class="node-text" font-size="10">y</text>

  <!-- Arrow to step 2 -->
  <line x1="150" y1="680" x2="195" y2="680" stroke="#93a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="173" y="670" font-size="9" fill="#93a3b8" text-anchor="middle">rotL(x)</text>

  <!-- Step 2 -->
  <text x="215" y="615" class="case-label">Step 2</text>
  <circle cx="240" cy="640" r="16" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="240" y="640" class="node-text" font-size="11">z</text>
  <line x1="228" y1="653" x2="205" y2="672" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="195" cy="684" r="16" stroke="#d29922" stroke-width="1.5" fill="rgba(210,153,34,0.15)"/>
  <text x="195" y="684" class="node-text" font-size="11">y</text>
  <line x1="183" y1="697" x2="165" y2="710" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="155" cy="718" r="11" stroke="#58a6ff" stroke-width="1" fill="rgba(30,40,55,0.5)"/>
  <text x="155" y="718" class="node-text" font-size="10">x</text>

  <!-- Arrow to result -->
  <line x1="285" y1="680" x2="330" y2="680" stroke="#93a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="308" y="670" font-size="9" fill="#93a3b8" text-anchor="middle">rotR(z)</text>

  <!-- Result -->
  <text x="360" y="615" class="case-label">Result</text>
  <circle cx="390" cy="660" r="16" stroke="#3fb950" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="390" y="660" class="node-text" font-size="11">y</text>
  <line x1="378" y1="673" x2="355" y2="692" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="345" cy="700" r="14" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="345" y="700" class="node-text" font-size="10">x</text>
  <line x1="402" y1="673" x2="425" y2="692" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="435" cy="700" r="14" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="435" y="700" class="node-text" font-size="10">z</text>

  <!-- RL Case (Double Rotation) -->
  <text x="530" y="570" class="title">RL Case → Right-Left</text>
  <text x="530" y="588" class="subtitle">Left subtree of right child grew</text>

  <!-- Step 1 -->
  <text x="520" y="615" class="case-label">Step 1</text>
  <circle cx="540" cy="640" r="16" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="540" y="640" class="node-text" font-size="11">x</text>
  <line x1="552" y1="653" x2="575" y2="672" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="588" cy="684" r="16" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="588" y="684" class="node-text" font-size="11">z</text>
  <line x1="576" y1="697" x2="556" y2="710" stroke="#d29922" stroke-width="1.5"/>
  <circle cx="546" cy="718" r="11" stroke="#d29922" stroke-width="1.5" fill="rgba(210,153,34,0.15)"/>
  <text x="546" y="718" class="node-text" font-size="10">y</text>

  <!-- Arrow -->
  <line x1="630" y1="680" x2="675" y2="680" stroke="#93a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="653" y="670" font-size="9" fill="#93a3b8" text-anchor="middle">rotR(z)</text>

  <!-- Step 2 -->
  <text x="695" y="615" class="case-label">Step 2</text>
  <circle cx="720" cy="640" r="16" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="720" y="640" class="node-text" font-size="11">x</text>
  <line x1="732" y1="653" x2="755" y2="672" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="765" cy="684" r="16" stroke="#d29922" stroke-width="1.5" fill="rgba(210,153,34,0.15)"/>
  <text x="765" y="684" class="node-text" font-size="11">y</text>
  <line x1="777" y1="697" x2="797" y2="710" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="807" cy="718" r="11" stroke="#58a6ff" stroke-width="1" fill="rgba(30,40,55,0.5)"/>
  <text x="807" y="718" class="node-text" font-size="10">z</text>

  <!-- Arrow to result -->
  <line x1="820" y1="680" x2="840" y2="680" stroke="#93a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="830" y="670" font-size="9" fill="#93a3b8" text-anchor="middle">rotL(x)</text>

  <!-- RL Result - shifted down to avoid overflow -->
  <text x="680" y="745" class="case-label">Result</text>
  <circle cx="720" cy="775" r="16" stroke="#3fb950" stroke-width="2" fill="rgba(30,40,55,0.5)"/>
  <text x="720" y="775" class="node-text" font-size="11">y</text>
  <line x1="708" y1="788" x2="685" y2="807" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="675" cy="815" r="14" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="675" y="815" class="node-text" font-size="10">x</text>
  <line x1="732" y1="788" x2="755" y2="807" stroke="#93a3b8" stroke-width="1.5"/>
  <circle cx="765" cy="815" r="14" stroke="#58a6ff" stroke-width="1.5" fill="rgba(30,40,55,0.5)"/>
  <text x="765" y="815" class="node-text" font-size="10">z</text>

  <!-- LR Result label -->
  <text x="100" y="745" class="case-label">LR Result</text>
  <text x="530" y="745" class="case-label">RL Result</text>
  <line x1="100" y1="753" x2="460" y2="753" stroke="#30363d" stroke-width="0.5" stroke-dasharray="2,3"/>
  <line x1="530" y1="753" x2="840" y2="753" stroke="#30363d" stroke-width="0.5" stroke-dasharray="2,3"/>

</svg>
