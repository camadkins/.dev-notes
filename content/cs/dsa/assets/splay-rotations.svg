<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" fill="none">
  <!-- GRID CONSTANTS:
    Layout: 3 rows (Zig, Zig-Zig, Zig-Zag), each ~230px tall
    Row 1 (Zig):     y=30..230
    Row 2 (Zig-Zig): y=255..490
    Row 3 (Zig-Zag): y=510..740

    Each row: Before panel (x=30..220), Arrow (x=220..250), After panel (x=250..440)
    Separator at x=460
    Description panel (x=470..880) for annotations

    Node radius: 16px
    Depth spacing: 55px vertical
    Sibling spacing: 50px horizontal (subtree triangles: 30px wide base)
    Subtree triangle: 30px wide, 30px tall
  -->
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .node-x { fill: rgba(30,40,55,0.95); stroke: #d29922; stroke-width: 2.5; }
    .node-text { font-size: 12px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; }
    .anno { font-size: 12px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .desc { font-size: 11px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    .desc-left { font-size: 11px; fill: #8b949e; font-style: italic; text-anchor: start; }
    .section-title { font-size: 15px; fill: #7b97aa; font-weight: 700; text-anchor: start; }
    .subtree { fill: none; stroke: #58a6ff; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.6; }
    .subtree-label { font-size: 11px; fill: #8b949e; text-anchor: middle; dominant-baseline: central; }
    .arrow-line { stroke: #d29922; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .note-text { font-size: 11px; fill: #84a59d; text-anchor: start; }
    @media (prefers-color-scheme: light) {
      .node { fill: #1a1a2e; stroke: #284b63; }
      .node-x { fill: #1a1a2e; stroke: #9e6000; }
      .edge { stroke: #b8b8b8; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
      .desc-left { fill: #6e7781; }
      .section-title { fill: #284b63; }
      .subtree { stroke: #284b63; }
      .subtree-label { fill: #6e7781; }
      .arrow-line { stroke: #9e6000; }
      .sep { stroke: #e5e5e5; }
      .note-text { fill: #2d6a4f; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d29922"/>
    </marker>
  </defs>

  <!-- ROW 1: ZIG -->
  <!-- y-base: 30 -->
  <text x="30" y="40" class="section-title">Zig</text>
  <text x="30" y="56" class="desc-left">x is a child of root p -- single rotation</text>

  <!-- BEFORE: Before label -->
  <text x="125" y="76" class="anno">Before</text>

  <!-- BEFORE: p at depth 0 (y=100) -->
  <circle cx="125" cy="100" r="16" class="node"/>
  <text x="125" y="100" class="node-text">p</text>

  <!-- BEFORE: x at depth 1 left (y=155) -->
  <circle cx="80" cy="155" r="16" class="node-x"/>
  <text x="80" y="155" class="node-text">x</text>

  <!-- BEFORE: subtree C at depth 1 right -->
  <polygon points="170,147 155,177 185,177" class="subtree"/>
  <text x="170" y="168" class="subtree-label">C</text>

  <!-- BEFORE: subtree A at depth 2 left of x -->
  <polygon points="55,187 40,217 70,217" class="subtree"/>
  <text x="55" y="208" class="subtree-label">A</text>

  <!-- BEFORE: subtree B at depth 2 right of x -->
  <polygon points="105,187 90,217 120,217" class="subtree"/>
  <text x="105" y="208" class="subtree-label">B</text>

  <!-- BEFORE edges -->
  <line x1="113" y1="112" x2="92" y2="143" class="edge"/>
  <line x1="137" y1="112" x2="164" y2="147" class="edge"/>
  <line x1="68" y1="167" x2="58" y2="187" class="edge"/>
  <line x1="92" y1="167" x2="102" y2="187" class="edge"/>

  <!-- Arrow -->
  <line x1="210" y1="145" x2="260" y2="145" class="arrow-line"/>

  <!-- AFTER: After label -->
  <text x="370" y="76" class="anno">After</text>

  <!-- AFTER: x at root (y=100) -->
  <circle cx="370" cy="100" r="16" class="node-x"/>
  <text x="370" y="100" class="node-text">x</text>

  <!-- AFTER: subtree A at depth 1 left -->
  <polygon points="320,132 305,162 335,162" class="subtree"/>
  <text x="320" y="153" class="subtree-label">A</text>

  <!-- AFTER: p at depth 1 right (y=155) -->
  <circle cx="420" cy="155" r="16" class="node"/>
  <text x="420" y="155" class="node-text">p</text>

  <!-- AFTER: subtree B at depth 2 left of p -->
  <polygon points="395,187 380,217 410,217" class="subtree"/>
  <text x="395" y="208" class="subtree-label">B</text>

  <!-- AFTER: subtree C at depth 2 right of p -->
  <polygon points="445,187 430,217 460,217" class="subtree"/>
  <text x="445" y="208" class="subtree-label">C</text>

  <!-- AFTER edges -->
  <line x1="358" y1="112" x2="326" y2="132" class="edge"/>
  <line x1="382" y1="112" x2="408" y2="143" class="edge"/>
  <line x1="408" y1="167" x2="398" y2="187" class="edge"/>
  <line x1="432" y1="167" x2="442" y2="187" class="edge"/>

  <!-- Zig annotation -->
  <text x="530" y="100" class="note-text">x is child of root.</text>
  <text x="530" y="116" class="note-text">Single rotation raises x,</text>
  <text x="530" y="132" class="note-text">p becomes child of x.</text>
  <text x="530" y="156" class="note-text">B moves from x.right</text>
  <text x="530" y="172" class="note-text">to p.left.</text>

  <!-- Separator -->
  <line x1="30" y1="240" x2="970" y2="240" class="sep"/>

  <!-- ROW 2: ZIG-ZIG -->
  <!-- y-base: 275 -->
  <text x="30" y="288" class="section-title">Zig-Zig</text>
  <text x="30" y="306" class="desc-left">x and p are same-side children -- rotate p over g, then x over p</text>

  <!-- BEFORE: Before label -->
  <text x="120" y="322" class="anno">Before</text>

  <!-- BEFORE: g at depth 0 (y=340) -->
  <circle cx="155" cy="340" r="16" class="node"/>
  <text x="155" y="340" class="node-text">g</text>

  <!-- BEFORE: p at depth 1 left (y=395) -->
  <circle cx="100" cy="395" r="16" class="node"/>
  <text x="100" y="395" class="node-text">p</text>

  <!-- BEFORE: subtree D at depth 1 right of g -->
  <polygon points="210,387 195,417 225,417" class="subtree"/>
  <text x="210" y="408" class="subtree-label">D</text>

  <!-- BEFORE: x at depth 2 left of p (y=450) -->
  <circle cx="60" cy="450" r="16" class="node-x"/>
  <text x="60" y="450" class="node-text">x</text>

  <!-- BEFORE: subtree C at depth 2 right of p -->
  <polygon points="140,442 125,472 155,472" class="subtree"/>
  <text x="140" y="463" class="subtree-label">C</text>

  <!-- BEFORE: subtree A at depth 3 left of x -->
  <polygon points="40,482 25,512 55,512" class="subtree"/>
  <text x="40" y="503" class="subtree-label">A</text>

  <!-- BEFORE: subtree B at depth 3 right of x -->
  <polygon points="80,482 65,512 95,512" class="subtree"/>
  <text x="80" y="503" class="subtree-label">B</text>

  <!-- BEFORE edges -->
  <line x1="143" y1="352" x2="112" y2="383" class="edge"/>
  <line x1="167" y1="352" x2="204" y2="387" class="edge"/>
  <line x1="88" y1="407" x2="72" y2="438" class="edge"/>
  <line x1="112" y1="407" x2="134" y2="442" class="edge"/>
  <line x1="48" y1="462" x2="43" y2="482" class="edge"/>
  <line x1="72" y1="462" x2="77" y2="482" class="edge"/>

  <!-- Arrow -->
  <line x1="245" y1="410" x2="295" y2="410" class="arrow-line"/>

  <!-- AFTER: After label -->
  <text x="415" y="322" class="anno">After</text>

  <!-- AFTER: x at root (y=340) -->
  <circle cx="415" cy="340" r="16" class="node-x"/>
  <text x="415" y="340" class="node-text">x</text>

  <!-- AFTER: subtree A at depth 1 left of x -->
  <polygon points="360,372 345,402 375,402" class="subtree"/>
  <text x="360" y="393" class="subtree-label">A</text>

  <!-- AFTER: p at depth 1 right of x (y=395) -->
  <circle cx="470" cy="395" r="16" class="node"/>
  <text x="470" y="395" class="node-text">p</text>

  <!-- AFTER: subtree B at depth 2 left of p -->
  <polygon points="440,427 425,457 455,457" class="subtree"/>
  <text x="440" y="448" class="subtree-label">B</text>

  <!-- AFTER: g at depth 2 right of p (y=450) -->
  <circle cx="510" cy="450" r="16" class="node-x" style="stroke: #58a6ff; stroke-width: 1.5;"/>
  <text x="510" y="450" class="node-text">g</text>

  <!-- AFTER: subtree C at depth 3 left of g -->
  <polygon points="490,482 475,512 505,512" class="subtree"/>
  <text x="490" y="503" class="subtree-label">C</text>

  <!-- AFTER: subtree D at depth 3 right of g -->
  <polygon points="530,482 515,512 545,512" class="subtree"/>
  <text x="530" y="503" class="subtree-label">D</text>

  <!-- AFTER edges -->
  <line x1="403" y1="352" x2="366" y2="372" class="edge"/>
  <line x1="427" y1="352" x2="458" y2="383" class="edge"/>
  <line x1="458" y1="407" x2="446" y2="427" class="edge"/>
  <line x1="482" y1="407" x2="498" y2="438" class="edge"/>
  <line x1="498" y1="462" x2="493" y2="482" class="edge"/>
  <line x1="522" y1="462" x2="527" y2="482" class="edge"/>

  <!-- ZigZig annotation -->
  <text x="600" y="350" class="note-text">Both left-left (or right-right).</text>
  <text x="600" y="368" class="note-text">First rotate p over g,</text>
  <text x="600" y="386" class="note-text">then rotate x over p.</text>
  <text x="600" y="410" class="note-text">Subtrees B, C, D redistribute</text>
  <text x="600" y="428" class="note-text">to maintain BST order.</text>

  <!-- Separator -->
  <line x1="30" y1="535" x2="970" y2="535" class="sep"/>

  <!-- ROW 3: ZIG-ZAG -->
  <!-- y-base: 560 -->
  <text x="30" y="573" class="section-title">Zig-Zag</text>
  <text x="30" y="591" class="desc-left">x and p are opposite-side children -- rotate x over p, then x over g</text>

  <!-- BEFORE: Before label -->
  <text x="120" y="611" class="anno">Before</text>

  <!-- BEFORE: g at depth 0 (y=629) -->
  <circle cx="155" cy="629" r="16" class="node"/>
  <text x="155" y="629" class="node-text">g</text>

  <!-- BEFORE: p at depth 1 left (y=684) -->
  <circle cx="90" cy="684" r="16" class="node"/>
  <text x="90" y="684" class="node-text">p</text>

  <!-- BEFORE: subtree D at depth 1 right of g -->
  <polygon points="215,676 200,706 230,706" class="subtree"/>
  <text x="215" y="697" class="subtree-label">D</text>

  <!-- BEFORE: subtree A at depth 2 left of p -->
  <polygon points="55,716 40,746 70,746" class="subtree"/>
  <text x="55" y="737" class="subtree-label">A</text>

  <!-- BEFORE: x at depth 2 right of p (y=739) -->
  <circle cx="135" cy="739" r="16" class="node-x"/>
  <text x="135" y="739" class="node-text">x</text>

  <!-- BEFORE: subtree B at depth 3 left of x -->
  <polygon points="115,771 100,794 130,794" class="subtree"/>
  <text x="115" y="788" class="subtree-label">B</text>

  <!-- BEFORE: subtree C at depth 3 right of x  -->
  <polygon points="155,771 140,794 170,794" class="subtree"/>
  <text x="155" y="788" class="subtree-label">C</text>

  <!-- BEFORE edges -->
  <line x1="143" y1="641" x2="102" y2="672" class="edge"/>
  <line x1="167" y1="641" x2="209" y2="676" class="edge"/>
  <line x1="78" y1="696" x2="61" y2="716" class="edge"/>
  <line x1="102" y1="696" x2="123" y2="727" class="edge"/>
  <line x1="123" y1="751" x2="118" y2="771" class="edge"/>
  <line x1="147" y1="751" x2="152" y2="771" class="edge"/>

  <!-- Arrow -->
  <line x1="245" y1="694" x2="295" y2="694" class="arrow-line"/>

  <!-- AFTER: After label -->
  <text x="415" y="611" class="anno">After</text>

  <!-- AFTER: x at root (y=629) -->
  <circle cx="415" cy="629" r="16" class="node-x"/>
  <text x="415" y="629" class="node-text">x</text>

  <!-- AFTER: p at depth 1 left (y=684) -->
  <circle cx="365" cy="684" r="16" class="node"/>
  <text x="365" y="684" class="node-text">p</text>

  <!-- AFTER: g at depth 1 right (y=684) -->
  <circle cx="465" cy="684" r="16" class="node"/>
  <text x="465" y="684" class="node-text">g</text>

  <!-- AFTER: subtree A at depth 2 left of p -->
  <polygon points="340,716 325,746 355,746" class="subtree"/>
  <text x="340" y="737" class="subtree-label">A</text>

  <!-- AFTER: subtree B at depth 2 right of p -->
  <polygon points="390,716 375,746 405,746" class="subtree"/>
  <text x="390" y="737" class="subtree-label">B</text>

  <!-- AFTER: subtree C at depth 2 left of g -->
  <polygon points="440,716 425,746 455,746" class="subtree"/>
  <text x="440" y="737" class="subtree-label">C</text>

  <!-- AFTER: subtree D at depth 2 right of g -->
  <polygon points="490,716 475,746 505,746" class="subtree"/>
  <text x="490" y="737" class="subtree-label">D</text>

  <!-- AFTER edges -->
  <line x1="403" y1="641" x2="377" y2="672" class="edge"/>
  <line x1="427" y1="641" x2="453" y2="672" class="edge"/>
  <line x1="353" y1="696" x2="343" y2="716" class="edge"/>
  <line x1="377" y1="696" x2="387" y2="716" class="edge"/>
  <line x1="453" y1="696" x2="443" y2="716" class="edge"/>
  <line x1="477" y1="696" x2="487" y2="716" class="edge"/>

  <!-- ZigZag annotation -->
  <text x="560" y="634" class="note-text">Left-right (or right-left).</text>
  <text x="560" y="652" class="note-text">First rotate x over p,</text>
  <text x="560" y="670" class="note-text">then rotate x over g.</text>
  <text x="560" y="694" class="note-text">x becomes root; p and g</text>
  <text x="560" y="712" class="note-text">become its children.</text>
  <text x="560" y="736" class="note-text">Subtrees A, B, C, D stay</text>
  <text x="560" y="754" class="note-text">in BST order.</text>
</svg>
