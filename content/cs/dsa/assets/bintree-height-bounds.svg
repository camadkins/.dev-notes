<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7.4 0 600 400" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .axis { stroke: #93a3b8; stroke-width: 1.5; }
    .tick { stroke: #93a3b8; stroke-width: 1; }
    .tick-label { font-size: 9px; fill: #8b949e; text-anchor: middle; }
    .tick-label-y { font-size: 9px; fill: #8b949e; text-anchor: end; }
    .axis-label { font-size: 11px; fill: #e8e8e8; font-weight: 600; }
    .grid { stroke: #30363d; stroke-width: 0.5; stroke-dasharray: 3 3; }
    .curve-perfect { stroke: #84a59d; stroke-width: 2; fill: none; }
    .curve-avl { stroke: #58a6ff; stroke-width: 2; fill: none; }
    .curve-rb { stroke: #d29922; stroke-width: 2; fill: none; }
    .curve-worst { stroke: #f47067; stroke-width: 2; fill: none; stroke-dasharray: 6 3; }
    .legend-text { font-size: 10px; fill: #e8e8e8; text-anchor: start; }
    .legend-eq { font-size: 9px; fill: #8b949e; text-anchor: start; }
    .title { font-size: 13px; fill: #e8e8e8; font-weight: 700; text-anchor: middle; }
    @media (prefers-color-scheme: light) {
      .axis { stroke: #333; }
      .tick { stroke: #333; }
      .tick-label { fill: #6e7781; }
      .tick-label-y { fill: #6e7781; }
      .axis-label { fill: #1a1a2e; }
      .grid { stroke: #e5e5e5; }
      .curve-perfect { stroke: #2d6a4f; }
      .curve-avl { stroke: #284b63; }
      .curve-rb { stroke: #9e6000; }
      .curve-worst { stroke: #c0392b; }
      .legend-text { fill: #1a1a2e; }
      .legend-eq { fill: #6e7781; }
      .title { fill: #1a1a2e; }
    }
  </style>

  <!-- Layout constants:
       Plot area: x=[80..560], y=[40..340]  (480 x 300)
       Origin: (80, 340)
       X-axis: n from 1 to 31, scale = 480/30 = 16px per unit
       Y-axis: h from 0 to 30, scale = 300/30 = 10px per unit
       Margin: 20px padding on all sides of viewBox
  -->

  <!-- Title -->
  <text x="320" y="28" class="title">Height Bounds by Tree Type</text>

  <!-- Grid lines (horizontal, at h=5,10,15,20,25,30) -->
  <line x1="80" y1="290" x2="560" y2="290" class="grid"/>
  <line x1="80" y1="240" x2="560" y2="240" class="grid"/>
  <line x1="80" y1="190" x2="560" y2="190" class="grid"/>
  <line x1="80" y1="140" x2="560" y2="140" class="grid"/>
  <line x1="80" y1="90" x2="560" y2="90" class="grid"/>
  <line x1="80" y1="40" x2="560" y2="40" class="grid"/>

  <!-- Grid lines (vertical, at n=5,10,15,20,25,30) -->
  <line x1="160" y1="40" x2="160" y2="340" class="grid"/>
  <line x1="240" y1="40" x2="240" y2="340" class="grid"/>
  <line x1="320" y1="40" x2="320" y2="340" class="grid"/>
  <line x1="400" y1="40" x2="400" y2="340" class="grid"/>
  <line x1="480" y1="40" x2="480" y2="340" class="grid"/>
  <line x1="560" y1="40" x2="560" y2="340" class="grid"/>

  <!-- Axes -->
  <line x1="80" y1="340" x2="560" y2="340" class="axis"/>
  <line x1="80" y1="340" x2="80" y2="40" class="axis"/>

  <!-- X-axis ticks and labels (n = 1, 5, 10, 15, 20, 25, 30, 31) -->
  <line x1="96" y1="340" x2="96" y2="345" class="tick"/>
  <text x="96" y="358" class="tick-label">1</text>
  <line x1="160" y1="340" x2="160" y2="345" class="tick"/>
  <text x="160" y="358" class="tick-label">5</text>
  <line x1="240" y1="340" x2="240" y2="345" class="tick"/>
  <text x="240" y="358" class="tick-label">10</text>
  <line x1="320" y1="340" x2="320" y2="345" class="tick"/>
  <text x="320" y="358" class="tick-label">15</text>
  <line x1="400" y1="340" x2="400" y2="345" class="tick"/>
  <text x="400" y="358" class="tick-label">20</text>
  <line x1="480" y1="340" x2="480" y2="345" class="tick"/>
  <text x="480" y="358" class="tick-label">25</text>
  <line x1="560" y1="340" x2="560" y2="345" class="tick"/>
  <text x="560" y="358" class="tick-label">31</text>

  <!-- X-axis label -->
  <text x="320" y="380" class="axis-label" text-anchor="middle">n (nodes)</text>

  <!-- Y-axis ticks and labels (h = 0, 5, 10, 15, 20, 25, 30) -->
  <line x1="75" y1="340" x2="80" y2="340" class="tick"/>
  <text x="72" y="343" class="tick-label-y">0</text>
  <line x1="75" y1="290" x2="80" y2="290" class="tick"/>
  <text x="72" y="293" class="tick-label-y">5</text>
  <line x1="75" y1="240" x2="80" y2="240" class="tick"/>
  <text x="72" y="243" class="tick-label-y">10</text>
  <line x1="75" y1="190" x2="80" y2="190" class="tick"/>
  <text x="72" y="193" class="tick-label-y">15</text>
  <line x1="75" y1="140" x2="80" y2="140" class="tick"/>
  <text x="72" y="143" class="tick-label-y">20</text>
  <line x1="75" y1="90" x2="80" y2="90" class="tick"/>
  <text x="72" y="93" class="tick-label-y">25</text>
  <line x1="75" y1="40" x2="80" y2="40" class="tick"/>
  <text x="72" y="43" class="tick-label-y">30</text>

  <!-- Y-axis label -->
  <text x="30" y="190" class="axis-label" text-anchor="middle" transform="rotate(-90, 30, 190)">h (height)</text>

  <!-- ==================== CURVES ==================== -->
  <!-- Scale: px_x(n) = 80 + (n-1)*16, px_y(h) = 340 - h*10 -->

  <!-- Perfect: h = floor(log2(n)) — step function (lower bound) -->
  <!-- n=1: h=0, n=2-3: h=1, n=4-7: h=2, n=8-15: h=3, n=16-31: h=4 -->
  <polyline class="curve-perfect" points="
    96,340
    112,330 128,330
    144,320 160,320 176,320 192,320
    208,310 224,310 240,310 256,310 272,310 288,310 304,310 320,310
    336,300 352,300 368,300 384,300 400,300 416,300 432,300 448,300 464,300 480,300 496,300 512,300 528,300 544,300 560,300
  "/>

  <!-- AVL: h <= 1.44 * log2(n+1) — smooth curve -->
  <!-- n=1:0, n=2:1.44, n=3:2.28, n=5:3.56, n=7:4.32, n=10:5.0, n=15:5.76, n=20:6.25, n=25:6.62, n=31:7.2 -->
  <polyline class="curve-avl" points="
    96,340
    112,325.6 128,317.2
    144,313.1 160,304.4
    176,299.6 192,296.8 208,294.6 224,292.2
    240,290.0 256,288.2 272,286.6 288,285.2
    304,283.8 320,282.4 336,281.4 352,280.4
    368,279.4 384,278.6 400,277.5 416,276.8
    432,276.0 448,275.3 464,274.6 480,273.8
    496,273.2 512,272.6 528,272.0 544,271.4 560,270.8
  "/>

  <!-- Red-black: h <= 2 * floor(log2(n+1)) — step function -->
  <!-- floor(log2(n+1)) steps at n=2^k - 1: n=1→1, n=3→2, n=7→3, n=15→4, n=31→5 -->
  <!-- n=1-2: 2*1=2, n=3-6: 2*2=4, n=7-14: 2*3=6, n=15-30: 2*4=8, n=31: 2*5=10 -->
  <polyline class="curve-rb" points="
    96,320 112,320
    128,300 144,300 160,300 176,300
    192,280 208,280 224,280 240,280 256,280 272,280 288,280 304,280
    320,260 336,260 352,260 368,260 384,260 400,260 416,260 432,260 448,260 464,260 480,260 496,260 512,260 528,260 544,260
    560,240
  "/>

  <!-- Worst-case (degenerate): h = n-1 — linear -->
  <polyline class="curve-worst" points="
    96,340
    112,330 128,320 144,310 160,300 176,290 192,280 208,270 224,260 240,250
    256,240 272,230 288,220 304,210 320,200
    336,190 352,180 368,170 384,160 400,150
    416,140 432,130 448,120 464,110 480,100
    496,90 512,80 528,70 544,60 560,50
  "/>

  <!-- ==================== LEGEND ==================== -->
  <!-- Legend box positioned in upper-left of plot area -->
  <rect x="90" y="46" width="240" height="92" rx="4" fill="rgba(30,40,55,0.85)" stroke="#30363d" stroke-width="1"/>

  <!-- Perfect -->
  <line x1="98" y1="62" x2="128" y2="62" class="curve-perfect" stroke-width="2"/>
  <text x="134" y="65" class="legend-text">Perfect</text>
  <text x="206" y="65" class="legend-eq">h = floor(log2 n)</text>

  <!-- AVL -->
  <line x1="98" y1="82" x2="128" y2="82" class="curve-avl" stroke-width="2"/>
  <text x="134" y="85" class="legend-text">AVL</text>
  <text x="206" y="85" class="legend-eq">h &lt;= 1.44 log2(n+1)</text>

  <!-- Red-black -->
  <line x1="98" y1="102" x2="128" y2="102" class="curve-rb" stroke-width="2"/>
  <text x="134" y="105" class="legend-text">Red-black</text>
  <text x="206" y="105" class="legend-eq">h &lt;= 2 floor(log2(n+1))</text>

  <!-- Worst-case -->
  <line x1="98" y1="122" x2="128" y2="122" class="curve-worst" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="134" y="125" class="legend-text">Worst-case</text>
  <text x="206" y="125" class="legend-eq">h = n - 1</text>
</svg>