<svg xmlns="http://www.w3.org/2000/svg" viewBox="30.4 0 700 300" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .node-hl { fill: rgba(30,40,55,0.95); stroke: #d29922; stroke-width: 2.5; }
    .node-new { fill: rgba(30,40,55,0.95); stroke: #84a59d; stroke-width: 2.5; }
    .node-text { font-size: 13px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .edge-hl { stroke: #d29922; stroke-width: 2.5; fill: none; }
    .anno { font-size: 10px; fill: #d29922; font-weight: 600; }
    .desc { font-size: 10px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    .title { font-size: 12px; fill: #7b97aa; font-weight: 600; text-anchor: middle; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: light) {
      .node { fill: #1a1a2e; stroke: #284b63; }
      .node-hl { fill: #1a1a2e; stroke: #9e6000; stroke-width: 2.5; }
      .node-new { fill: #1a1a2e; stroke: #3a7d5c; stroke-width: 2.5; }
      .edge { stroke: #b8b8b8; }
      .edge-hl { stroke: #9e6000; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
      .title { fill: #284b63; }
      .sep { stroke: #e5e5e5; }
    }
  </style>

  <!-- Layout grid:
       viewBox: 700 x 300, 20px padding
       Separator: x=350
       Left panel (Before):  center=175, tree at x=130..220
       Right panel (After):  center=525, tree at x=430..620
       Depth rows: d0=70, d1=145, d2=220
       Node radius: 20
  -->

  <!-- Panel titles -->
  <text class="title" x="175" y="30">Before</text>
  <text class="title" x="525" y="30">After insert(42)</text>

  <!-- Separator -->
  <line class="sep" x1="350" y1="20" x2="350" y2="280"/>

  <!-- ===== LEFT PANEL: BEFORE — right-skewed [40, 50, 60] ===== -->
  <!-- 40 at (150, 70) — root -->
  <!-- 50 at (200, 145) — right child -->
  <!-- 60 at (250, 220) — right-right child -->

  <!-- Edges (behind nodes) -->
  <line class="edge" x1="167.1" y1="84.1" x2="183.4" y2="131.2" />
  <line class="edge" x1="217.1" y1="159.1" x2="233.4" y2="206.2" />

  <!-- Nodes -->
  <circle cx="150" cy="70" r="20" class="node"/>
  <text x="150" y="70" class="node-text">40</text>

  <circle cx="200" cy="145" r="20" class="node"/>
  <text x="200" y="145" class="node-text">50</text>

  <circle cx="250" cy="220" r="20" class="node"/>
  <text x="250" y="220" class="node-text">60</text>

  <!-- Skew annotation -->
  <text class="desc" x="175" y="275">right-skewed chain</text>

  <!-- ===== RIGHT PANEL: AFTER — insert 42 ===== -->
  <!-- 40 at (490, 70) — root, highlighted (traversed) -->
  <!-- 50 at (560, 145) — right child, highlighted (traversed) -->
  <!-- 42 at (500, 220) — NEW left child of 50 -->
  <!-- 60 at (620, 220) — right child of 50 -->

  <!-- Edges -->
  <!-- 40→50: highlighted path -->
  <line class="edge-hl" x1="507.1" y1="84.1" x2="543.4" y2="131.2" />
  <!-- 50→42: highlighted path -->
  <line class="edge-hl" x1="545.7" y1="160.3" x2="514.3" y2="205.7" />
  <!-- 50→60: normal edge -->
  <line class="edge" x1="574.3" y1="160.3" x2="605.7" y2="205.7" />

  <!-- Path annotations -->
  <text class="anno" x="540" y="92">42 &gt; 40</text>
  <text class="anno" x="540" y="104">go right</text>
  <text class="anno" x="490" y="175" text-anchor="end">42 &lt; 50</text>
  <text class="anno" x="490" y="187" text-anchor="end">go left</text>

  <!-- Nodes -->
  <circle cx="490" cy="70" r="20" class="node-hl"/>
  <text x="490" y="70" class="node-text">40</text>

  <circle cx="560" cy="145" r="20" class="node-hl"/>
  <text x="560" y="145" class="node-text">50</text>

  <circle cx="500" cy="220" r="20" class="node-new"/>
  <text x="500" y="220" class="node-text">42</text>

  <circle cx="620" cy="220" r="20" class="node"/>
  <text x="620" y="220" class="node-text">60</text>

  <!-- New node annotation -->
  <text class="anno" x="500" y="250">new</text>
</svg>
