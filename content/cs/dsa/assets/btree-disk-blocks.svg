<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node-box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 6; }
    .node-text { font-size: 13px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .key-sep { stroke: #58a6ff; stroke-width: 1; opacity: 0.4; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .disk-page { fill: rgba(30,40,55,0.6); stroke: #7b97aa; stroke-width: 1.5; rx: 3; }
    .disk-text { font-size: 11px; fill: #7b97aa; text-anchor: middle; dominant-baseline: central; }
    .disk-label { font-size: 10px; fill: #8b949e; text-anchor: middle; dominant-baseline: central; font-style: italic; }
    .mapping { stroke: #d29922; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
    .anno { font-size: 11px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .layer-label { font-size: 10px; fill: #8b949e; text-anchor: end; font-style: italic; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: light) {
      .node-box { fill: #1a1a2e; stroke: #284b63; }
      .key-sep { stroke: #284b63; }
      .edge { stroke: #b8b8b8; }
      .disk-page { fill: rgba(26,26,46,0.15); stroke: #284b63; }
      .disk-text { fill: #284b63; }
      .disk-label { fill: #6e7781; }
      .mapping { stroke: #9e6000; }
      .anno { fill: #9e6000; }
      .layer-label { fill: #6e7781; }
      .sep { stroke: #e5e5e5; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#93a3b8"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 7" refX="10" refY="3.5"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#d29922"/>
    </marker>
  </defs>

  <!-- Layer labels -->
  <text x="58" y="30" class="layer-label">B-tree</text>
  <text x="58" y="260" class="layer-label">Disk</text>

  <!-- ==================== TOP LAYER: B-TREE ==================== -->

  <!-- Root node: [17 | 35] at cx=360, cy=58 -->
  <rect class="node-box" x="306" y="40" width="108" height="36"/>
  <line class="key-sep" x1="342" y1="42" x2="342" y2="74"/>
  <line class="key-sep" x1="378" y1="42" x2="378" y2="74"/>
  <text class="node-text" x="324" y="58">17</text>
  <text class="node-text" x="396" y="58">35</text>

  <!-- Left child: [5 | 12] at cx=150, cy=148 -->
  <rect class="node-box" x="96" y="130" width="108" height="36"/>
  <line class="key-sep" x1="132" y1="132" x2="132" y2="164"/>
  <line class="key-sep" x1="168" y1="132" x2="168" y2="164"/>
  <text class="node-text" x="114" y="148">5</text>
  <text class="node-text" x="186" y="148">12</text>

  <!-- Middle child: [20 | 28] at cx=360, cy=148 -->
  <rect class="node-box" x="306" y="130" width="108" height="36"/>
  <line class="key-sep" x1="342" y1="132" x2="342" y2="164"/>
  <line class="key-sep" x1="378" y1="132" x2="378" y2="164"/>
  <text class="node-text" x="324" y="148">20</text>
  <text class="node-text" x="396" y="148">28</text>

  <!-- Right child: [40 | 50 | 60] at cx=570, cy=148 -->
  <rect class="node-box" x="498" y="130" width="144" height="36"/>
  <line class="key-sep" x1="534" y1="132" x2="534" y2="164"/>
  <line class="key-sep" x1="570" y1="132" x2="570" y2="164"/>
  <line class="key-sep" x1="606" y1="132" x2="606" y2="164"/>
  <text class="node-text" x="516" y="148">40</text>
  <text class="node-text" x="570" y="148">50</text>
  <text class="node-text" x="624" y="148">60</text>

  <!-- Tree edges: root to children -->
  <line class="edge" x1="320" y1="76" x2="190" y2="130" marker-end="url(#arrow)"/>
  <line class="edge" x1="360" y1="76" x2="360" y2="130" marker-end="url(#arrow)"/>
  <line class="edge" x1="400" y1="76" x2="512" y2="130" marker-end="url(#arrow)"/>

  <!-- ==================== SEPARATOR ==================== -->
  <line class="sep" x1="70" y1="205" x2="650" y2="205"/>

  <!-- ==================== BOTTOM LAYER: DISK PAGES (all on same row y=280) ==================== -->

  <!-- Page 1 (root) at cx=150, cy=280 -->
  <rect class="disk-page" x="70" y="270" width="100" height="40"/>
  <text class="disk-text" x="120" y="284">17 | 35</text>
  <text class="disk-label" x="120" y="302">Page 1</text>

  <!-- Page 2 (left child) at cx=280, cy=280 -->
  <rect class="disk-page" x="230" y="270" width="100" height="40"/>
  <text class="disk-text" x="280" y="284">5 | 12</text>
  <text class="disk-label" x="280" y="302">Page 2</text>

  <!-- Page 3 (middle child) at cx=420, cy=280 -->
  <rect class="disk-page" x="380" y="270" width="100" height="40"/>
  <text class="disk-text" x="430" y="284">20 | 28</text>
  <text class="disk-label" x="430" y="302">Page 3</text>

  <!-- Page 4 (right child) at cx=570, cy=280 -->
  <rect class="disk-page" x="530" y="270" width="100" height="40"/>
  <text class="disk-text" x="580" y="284">40 | 50 | 60</text>
  <text class="disk-label" x="580" y="302">Page 4</text>

  <!-- ==================== DASHED MAPPING ARROWS ==================== -->

  <!-- Root [17|35] -> Page 1 -->
  <path class="mapping" d="M 330,76 C 330,170 120,210 120,268" marker-end="url(#arrow-gold)"/>

  <!-- [5|12] -> Page 2 -->
  <path class="mapping" d="M 150,166 C 150,210 280,230 280,268" marker-end="url(#arrow-gold)"/>

  <!-- [20|28] -> Page 3 -->
  <path class="mapping" d="M 360,166 C 360,210 430,230 430,268" marker-end="url(#arrow-gold)"/>

  <!-- [40|50|60] -> Page 4 -->
  <path class="mapping" d="M 570,166 C 570,210 580,230 580,268" marker-end="url(#arrow-gold)"/>

  <!-- ==================== ANNOTATION ==================== -->
  <text class="anno" x="360" y="355">1 node read = 1 disk I/O = multiple keys compared</text>

</svg>