<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node-box { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; rx: 4; }
    .node-text { font-size: 12px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .anno { font-size: 10px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    .range-text { font-size: 9px; fill: #84a59d; text-anchor: middle; dominant-baseline: central; }
    .depth-label { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: end; dominant-baseline: central; }
    .sep-line { stroke: #58a6ff; stroke-width: 1; opacity: 0.4; }
    @media (prefers-color-scheme: light) {
      .node-box { fill: #1a1a2e; stroke: #284b63; }
      .edge { stroke: #b8b8b8; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
      .range-text { fill: #3a7a6a; }
      .sep-line { stroke: #284b63; opacity: 0.4; }
    }
  </style>

  <!-- Title -->
  <text x="330" y="28" class="anno" font-size="11">Order-3 B-Tree (m = 3, max 2 keys per node)</text>

  <!-- Grid constants:
       Depth labels: x=55 (right-aligned)
       Tree content starts at x=80
       Depth 0 y=75, Depth 1 y=155, Depth 2 y=245
       viewBox: 580 wide, 320 tall, 20px min padding all sides
  -->

  <!-- DEPTH 0: Root node [15] -->
  <rect x="300" y="59" width="60" height="32" class="node-box"/>
  <text x="330" y="75" class="node-text">15</text>
  <text x="55" y="75" class="depth-label">depth 0</text>

  <!-- DEPTH 1: Two internal nodes -->
  <!-- Left internal [5, 10]: centered at (200, 155) -->
  <rect x="160" y="139" width="80" height="32" class="node-box"/>
  <line x1="200" y1="139" x2="200" y2="171" class="sep-line"/>
  <text x="180" y="155" class="node-text">5</text>
  <text x="220" y="155" class="node-text">10</text>

  <!-- Right internal [20, 25]: centered at (460, 155) -->
  <rect x="420" y="139" width="80" height="32" class="node-box"/>
  <line x1="460" y1="139" x2="460" y2="171" class="sep-line"/>
  <text x="440" y="155" class="node-text">20</text>
  <text x="480" y="155" class="node-text">25</text>

  <text x="55" y="155" class="depth-label">depth 1</text>

  <!-- Edges: root to depth-1 nodes -->
  <!-- Root center (330,75), bottom at y=91 -->
  <!-- Left internal center (200,155), top at y=139 -->
  <!-- Right internal center (460,155), top at y=139 -->
  <line x1="313" y1="91" x2="213" y2="139" class="edge"/>
  <line x1="347" y1="91" x2="447" y2="139" class="edge"/>

  <!-- DEPTH 2: Leaf nodes (y=245) -->
  <!-- Under [5,10]: three children at x: 90, 200, 290 -->
  <!-- C0: [2,3] centered at (100, 245) -->
  <rect x="70" y="229" width="60" height="32" class="node-box"/>
  <line x1="100" y1="229" x2="100" y2="261" class="sep-line"/>
  <text x="85" y="245" class="node-text">2</text>
  <text x="115" y="245" class="node-text">3</text>

  <!-- C1: [7] centered at (200, 245) -->
  <rect x="170" y="229" width="60" height="32" class="node-box"/>
  <text x="200" y="245" class="node-text">7</text>

  <!-- C2: [12] centered at (290, 245) -->
  <rect x="260" y="229" width="60" height="32" class="node-box"/>
  <text x="290" y="245" class="node-text">12</text>

  <!-- Under [20,25]: three children at x: 370, 460, 540 -->
  <!-- C3: [17] centered at (370, 245) -->
  <rect x="340" y="229" width="60" height="32" class="node-box"/>
  <text x="370" y="245" class="node-text">17</text>

  <!-- C4: [22] centered at (460, 245) -->
  <rect x="430" y="229" width="60" height="32" class="node-box"/>
  <text x="460" y="245" class="node-text">22</text>

  <!-- C5: [28,30] centered at (530, 245) -->
  <rect x="500" y="229" width="60" height="32" class="node-box"/>
  <line x1="530" y1="229" x2="530" y2="261" class="sep-line"/>
  <text x="515" y="245" class="node-text">28</text>
  <text x="545" y="245" class="node-text">30</text>

  <text x="55" y="245" class="depth-label">depth 2</text>

  <!-- Edges: [5,10] to its 3 children -->
  <!-- Left edge of rect [5,10] at x=160, center connections at ~170,200,230 -->
  <line x1="170" y1="171" x2="110" y2="229" class="edge"/>
  <line x1="200" y1="171" x2="200" y2="229" class="edge"/>
  <line x1="230" y1="171" x2="280" y2="229" class="edge"/>

  <!-- Edges: [20,25] to its 3 children -->
  <line x1="430" y1="171" x2="380" y2="229" class="edge"/>
  <line x1="460" y1="171" x2="460" y2="229" class="edge"/>
  <line x1="490" y1="171" x2="520" y2="229" class="edge"/>

  <!-- Range annotations below leaves -->
  <text x="100" y="285" class="range-text">&lt; 5</text>
  <text x="200" y="285" class="range-text">5..10</text>
  <text x="290" y="285" class="range-text">10..15</text>
  <text x="370" y="285" class="range-text">15..20</text>
  <text x="460" y="285" class="range-text">20..25</text>
  <text x="530" y="285" class="range-text">&gt; 25</text>
</svg>