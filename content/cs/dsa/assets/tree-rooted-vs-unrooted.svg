<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" fill="none">
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .title { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 2; }
    .node-text { font-size: 12px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; }
    .label { font-size: 10px; fill: #8b949e; text-anchor: middle; }
    .depth { font-size: 10px; fill: #d29922; font-weight: 600; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .sub { font-size: 11px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    @media (prefers-color-scheme: light) {
      .title { fill: #284b63; }
      .node { fill: #1a1a2e; stroke: #284b63; }
      .edge { stroke: #b8b8b8; }
      .label { fill: #6e7781; }
      .depth { fill: #9e6000; }
      .sep { stroke: #e5e5e5; }
      .sub { fill: #6e7781; }
    }
  </style>

  <!-- ===== LEFT: Unrooted ===== -->
  <text x="150" y="20" class="title">Unrooted</text>
  <text x="150" y="35" class="sub">acyclic, connected graph</text>

  <!-- Edges -->
  <line x1="61" y1="115" x2="104" y2="115" class="edge"/>
  <line x1="136" y1="115" x2="179" y2="115" class="edge"/>
  <line x1="209" y1="107" x2="244" y2="88" class="edge"/>
  <line x1="209" y1="123" x2="244" y2="142" class="edge"/>

  <!-- Nodes -->
  <circle cx="45" cy="115" r="16" class="node"/>
  <text x="45" y="116" class="node-text">1</text>
  <circle cx="120" cy="115" r="16" class="node"/>
  <text x="120" y="116" class="node-text">2</text>
  <circle cx="195" cy="115" r="16" class="node"/>
  <text x="195" y="116" class="node-text">3</text>
  <circle cx="257" cy="80" r="16" class="node"/>
  <text x="257" y="81" class="node-text">4</text>
  <circle cx="257" cy="150" r="16" class="node"/>
  <text x="257" y="151" class="node-text">5</text>

  <text x="150" y="210" class="label">No root; edges undirected</text>

  <!-- Separator -->
  <line x1="305" y1="10" x2="305" y2="250" class="sep"/>

  <!-- ===== RIGHT: Rooted at 3 ===== -->
  <text x="480" y="20" class="title">Rooted at 3</text>
  <text x="480" y="35" class="sub">parent–child hierarchy</text>

  <!-- Edges (border-to-border) -->
  <line x1="468" y1="77" x2="415" y2="128" class="edge"/>
  <line x1="480" y1="81" x2="480" y2="124" class="edge"/>
  <line x1="492" y1="77" x2="545" y2="128" class="edge"/>
  <line x1="400" y1="156" x2="400" y2="199" class="edge"/>

  <!-- Nodes -->
  <circle cx="480" cy="65" r="16" class="node"/>
  <text x="480" y="66" class="node-text">3</text>
  <circle cx="400" cy="140" r="16" class="node"/>
  <text x="400" y="141" class="node-text">2</text>
  <circle cx="480" cy="140" r="16" class="node"/>
  <text x="480" y="141" class="node-text">4</text>
  <circle cx="560" cy="140" r="16" class="node"/>
  <text x="560" y="141" class="node-text">5</text>
  <circle cx="400" cy="215" r="16" class="node"/>
  <text x="400" y="216" class="node-text">1</text>

  <!-- Depth row labels -->
  <text x="625" y="69" class="depth">depth 0</text>
  <text x="625" y="144" class="depth">depth 1</text>
  <text x="625" y="219" class="depth">depth 2</text>

  <text x="480" y="250" class="label">height = 2  (longest path: 3 → 2 → 1)</text>
</svg>
