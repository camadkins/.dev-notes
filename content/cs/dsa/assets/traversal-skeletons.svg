    LAYOUT GRID (v3 — parent centering fixed):
    - 4 panels in 2x2
    - Left panels cx_base=240, Right panels cx_base=680
    - Node r=16, Badge r=7
    - Depth spacing: 55px

    TREE:          8
                 /   \
                3     10
               / \      \
              1   6     14
                 / \    /
                4   7  13

    CENTERING (T2):
    - 8 children: 3(cx=170), 10(cx=340) => midpoint=255, so root 8 at cx=255
    - 3 children: 1(cx=110), 6(cx=210) => midpoint=160, so 3 at cx=160
    - 6 children: 4(cx=180), 7(cx=240) => midpoint=210, so 6 at cx=210
    - 10 child: 14(cx=370) => 10 at cx=370
    - 14 child: 13(cx=350) => 14 at cx=350

    Recalculate all positions with strict centering:
    d3 leaves: 1(110), 4(180), 7(240), 13(350)
    d2: 1(110)=leaf, 6=mid(180,240)=210, 14=above(350)=350
    d1: 3=mid(110,210)=160, 10=above(350..only child via 14)=350...
        but 10 has no left child, only right=14. Single child => near-vertical.
        10 at cx=350, 14 at cx=350? That works for single-child vertical.
        Actually 10's only child is 14. So 10 should be directly above 14.

    Let me recalculate bottom-up:
    d3: 4(cx=175), 7(cx=235), 13(cx=345)
    d2: 1(cx=110, leaf), 6=mid(175,235)=205, 14=above 13=345
    d1: 3=mid(110,205)=158, 10=above 14=345
    d0: 8=mid(158,345)=252

    Let me use nice round numbers:
    d3: 4(175), 7(235), 13(350)
    d2: 1(105), 6(205), 14(350)
    d1: 3(155), 10(350)
    d0: 8(253)... let's use 252

    Hmm, let me re-derive with cleaner numbers:
    d3: 4(180), 7(240), 13(360)
    d2: 1(110), 6=mid(180,240)=210, 14=360
    d1: 3=mid(110,210)=160, 10=360
    d0: 8=mid(160,360)=260

    Left panel positions:
    d0: 8 at (260, 80)
    d1: 3 at (160, 135), 10 at (360, 135)
    d2: 1 at (110, 190), 6 at (210, 190), 14 at (360, 190)
    d3: 4 at (180, 245), 7 at (240, 245), 13 at (360, 245)

    10 and 14 both at cx=360 = single-child vertical (good per T5).
    14 and 13 both at cx=360 = another single-child vertical. Good.

    Right panel: offset by +440 from left
    d0: 8 at (700, y)
    d1: 3 at (600, y), 10 at (800, y)
    d2: 1 at (550, y), 6 at (650, y), 14 at (800, y)
    d3: 4 at (620, y), 7 at (680, y), 13 at (800, y)

    Check: 6=mid(620,680)=650 ✓, 3=mid(550,650)=600 ✓, 10=above(800)=800 ✓
    8=mid(600,800)=700 ✓
  -->
