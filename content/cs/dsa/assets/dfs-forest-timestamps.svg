<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .node-text { font-size: 13px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .ts-text { font-size: 9px; fill: #d29922; text-anchor: middle; font-weight: 600; }
    .edge-tree { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
    .edge-back { stroke: #f85149; stroke-width: 1.8; fill: none; stroke-dasharray: 6 3; }
    .edge-forward { stroke: #79c0ff; stroke-width: 1.8; fill: none; stroke-dasharray: 4 4; }
    .edge-cross { stroke: #6e7681; stroke-width: 1.8; fill: none; stroke-dasharray: 2 3; }
    .arrow-tree { fill: #58a6ff; }
    .arrow-back { fill: #f85149; }
    .arrow-forward { fill: #79c0ff; }
    .arrow-cross { fill: #6e7681; }
    .legend-label { font-size: 10px; fill: #e8e8e8; }
    .title { font-size: 11px; fill: #7b97aa; text-anchor: middle; font-weight: 600; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .edge-anno { font-size: 8px; font-weight: 600; }
    .edge-anno-back { fill: #f85149; }
    .edge-anno-fwd { fill: #79c0ff; }
    .edge-anno-cross { fill: #6e7681; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; }
    @media (prefers-color-scheme: light) {
      .node { fill: #1a1a2e; stroke: #284b63; }
      .node-text { fill: #e8e8e8; }
      .ts-text { fill: #9e6000; }
      .edge-tree { stroke: #284b63; }
      .arrow-tree { fill: #284b63; }
      .edge-back { stroke: #cf222e; }
      .arrow-back { fill: #cf222e; }
      .edge-forward { stroke: #0969da; }
      .arrow-forward { fill: #0969da; }
      .edge-cross { stroke: #b8b8b8; }
      .arrow-cross { fill: #b8b8b8; }
      .legend-label { fill: #1a1a2e; }
      .title { fill: #284b63; }
      .sep { stroke: #e5e5e5; }
      .edge-anno-back { fill: #cf222e; }
      .edge-anno-fwd { fill: #0969da; }
      .edge-anno-cross { fill: #b8b8b8; }
      .desc { fill: #6e7781; }
    }
  </style>

  <defs>
    <marker id="ah-tree" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" class="arrow-tree"/>
    </marker>
    <marker id="ah-back" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" class="arrow-back"/>
    </marker>
    <marker id="ah-forward" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" class="arrow-forward"/>
    </marker>
    <marker id="ah-cross" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" class="arrow-cross"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="28" class="title">DFS Forest with Discovery/Finish Timestamps</text>

  <!-- Layout constants:
       Row 0: y=80   (root a)
       Row 1: y=160  (c, b)
       Row 2: y=240  (d, e, h)
       Row 3: y=320  (g, f)

       a centered over c,b: cx = (120+410)/2 = 265
       b centered over e,h: cx = (340+480)/2 = 410
       c: cx=120, d: cx=120, g: cx=120
       e: cx=340, f: cx=340, h: cx=480
       r=22
  -->

  <!-- TREE EDGES (solid blue with arrows) -->
  <!-- a(265,80) to c(120,160) -->
  <line x1="247" y1="96" x2="138" y2="145" class="edge-tree" marker-end="url(#ah-tree)"/>
  <!-- a(265,80) to b(410,160) -->
  <line x1="283" y1="96" x2="393" y2="144" class="edge-tree" marker-end="url(#ah-tree)"/>
  <!-- c(120,160) to d(120,240) -->
  <line x1="120" y1="182" x2="120" y2="218" class="edge-tree" marker-end="url(#ah-tree)"/>
  <!-- d(120,240) to g(120,320) -->
  <line x1="120" y1="262" x2="120" y2="298" class="edge-tree" marker-end="url(#ah-tree)"/>
  <!-- b(410,160) to e(340,240) -->
  <line x1="395" y1="179" x2="355" y2="223" class="edge-tree" marker-end="url(#ah-tree)"/>
  <!-- b(410,160) to h(480,240) -->
  <line x1="425" y1="179" x2="465" y2="223" class="edge-tree" marker-end="url(#ah-tree)"/>
  <!-- e(340,240) to f(340,320) -->
  <line x1="340" y1="262" x2="340" y2="298" class="edge-tree" marker-end="url(#ah-tree)"/>

  <!-- BACK EDGE: d(120,240) to c(120,160), curved right -->
  <path d="M 142,234 C 178,205 178,175 142,166" class="edge-back" marker-end="url(#ah-back)"/>
  <text x="188" y="198" class="edge-anno edge-anno-back">back</text>

  <!-- FORWARD EDGE: a(265,80) to e(340,240), curved -->
  <path d="M 280,98 C 320,140 335,190 342,220" class="edge-forward" marker-end="url(#ah-forward)"/>
  <text x="318" y="155" class="edge-anno edge-anno-fwd">fwd</text>

  <!-- CROSS EDGE: e(340,240) to c(120,160), curved below -->
  <path d="M 322,234 C 280,215 210,180 142,166" class="edge-cross" marker-end="url(#ah-cross)"/>
  <text x="230" y="192" class="edge-anno edge-anno-cross">cross</text>

  <!-- NODES -->
  <!-- a: d=1, f=16 -->
  <circle cx="265" cy="80" r="22" class="node" id="node-a"/>
  <text x="265" y="80" class="node-text">a</text>
  <text x="265" y="56" class="ts-text">1/16</text>

  <!-- c: d=2, f=7 -->
  <circle cx="120" cy="160" r="22" class="node" id="node-c"/>
  <text x="120" y="160" class="node-text">c</text>
  <text x="120" y="136" class="ts-text">2/7</text>

  <!-- b: d=8, f=15 -->
  <circle cx="410" cy="160" r="22" class="node" id="node-b"/>
  <text x="410" y="160" class="node-text">b</text>
  <text x="410" y="136" class="ts-text">8/15</text>

  <!-- d: d=3, f=6 -->
  <circle cx="120" cy="240" r="22" class="node" id="node-d"/>
  <text x="120" y="240" class="node-text">d</text>
  <text x="120" y="216" class="ts-text">3/6</text>

  <!-- e: d=9, f=12 -->
  <circle cx="340" cy="240" r="22" class="node" id="node-e"/>
  <text x="340" y="240" class="node-text">e</text>
  <text x="370" y="225" class="ts-text">9/12</text>

  <!-- h: d=13, f=14 -->
  <circle cx="480" cy="240" r="22" class="node" id="node-h"/>
  <text x="480" y="240" class="node-text">h</text>
  <text x="480" y="216" class="ts-text">13/14</text>

  <!-- g: d=4, f=5 -->
  <circle cx="120" cy="320" r="22" class="node" id="node-g"/>
  <text x="120" y="320" class="node-text">g</text>
  <text x="120" y="296" class="ts-text">4/5</text>

  <!-- f: d=10, f=11 -->
  <circle cx="340" cy="320" r="22" class="node" id="node-f"/>
  <text x="340" y="320" class="node-text">f</text>
  <text x="370" y="305" class="ts-text">10/11</text>

  <!-- LEGEND -->
  <line x1="40" y1="390" x2="605" y2="390" class="sep"/>

  <line x1="55" y1="407" x2="90" y2="407" class="edge-tree" marker-end="url(#ah-tree)"/>
  <text x="98" y="410" class="legend-label">Tree</text>

  <line x1="175" y1="407" x2="210" y2="407" class="edge-back" marker-end="url(#ah-back)"/>
  <text x="218" y="410" class="legend-label">Back</text>

  <line x1="295" y1="407" x2="330" y2="407" class="edge-forward" marker-end="url(#ah-forward)"/>
  <text x="338" y="410" class="legend-label">Forward</text>

  <line x1="430" y1="407" x2="465" y2="407" class="edge-cross" marker-end="url(#ah-cross)"/>
  <text x="473" y="410" class="legend-label">Cross</text>

  <text x="568" y="410" class="ts-text">d/f</text>
</svg>
