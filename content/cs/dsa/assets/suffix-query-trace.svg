    <!-- All leaf annotations -->
    <text x="503" y="100" class="anno">i=6</text>
    <text x="293" y="146" class="anno">i=5</text>
    <text x="433" y="192" class="anno">i=4</text>
    <text x="223" y="238" class="anno">i=3</text>
