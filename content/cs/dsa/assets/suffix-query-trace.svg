    <text x="153" y="330" class="anno">i=1</text>
    <text x="83" y="376" class="anno">i=0</text>
  </g>

  <!-- ═══ QUERY PATH OVERLAY ═══ -->
  <!-- Query edges: root → a → an → ana -->
  <line x1="275" y1="55" x2="233" y2="91" class="qedge"/>
  <line x1="223" y1="101" x2="180" y2="137" class="qedge"/>
  <line x1="175" y1="149" x2="175" y2="181" class="qedge"/>

  <!-- Query edge labels -->
  <text x="242" y="69" class="qlabel">a</text>
  <text x="190" y="115" class="qlabel">n</text>
  <text x="187" y="169" class="qlabel">a</text>

  <!-- Query path nodes (highlighted, outside dimmed group) -->
  <circle cx="280" cy="50" r="7" class="highlighted"/>        <!-- root -->
  <circle cx="228" cy="96" r="7" class="highlighted"/>        <!-- a -->
  <circle cx="175" cy="142" r="7" class="highlighted"/>       <!-- an -->
  <circle cx="175" cy="188" r="7" class="highlighted-target"/> <!-- ana (target) -->

  <!-- Root label (query overlay) -->
  <text x="280" y="37" class="rlabel">root</text>

  <!-- ═══ ANNOTATIONS ═══ -->
  <!-- Dashed line from ana node to annotation -->
  <line x1="184" y1="188" x2="228" y2="188" stroke="#d29922" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Position result -->
  <text x="233" y="184" class="qanno">positions: [1, 3]</text>
  <text x="233" y="198" class="qresult">S[1..3] = "ana"</text>
  <text x="233" y="210" class="qresult">S[3..5] = "ana"</text>
</svg>