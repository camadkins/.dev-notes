<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 680 460" fill="none">
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .title { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .node-text { font-size: 14px; fill: #F1F5F9; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .anno-title { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .anno-text { font-size: 11px; text-anchor: middle; }
    .nil-text { font-size: 10px; font-weight: 700; text-anchor: middle; }

    /* Dark mode — node semantics separated from explanatory overlays */
    .title { fill: #58a6ff; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; }
    .edge-gold { stroke: #D4A017; stroke-width: 3; }
    .edge-blue { stroke: #58a6ff; stroke-width: 3; }
    .edge-gold-dash { stroke: #D4A017; stroke-width: 2.5; stroke-dasharray: 5 3; }
    .edge-blue-dash { stroke: #58a6ff; stroke-width: 2.5; stroke-dasharray: 5 3; }

    /* Node colors follow RB-tree semantics — NOT explanatory overlay colors */
    .node-black { fill: rgba(30,40,55,0.95); stroke: #93a3b8; stroke-width: 2; }
    .node-red { fill: rgba(185,28,28,0.95); stroke: #FCA5A5; stroke-width: 2; }

    /* Explanatory overlays stay in a separate color layer */
    .anno-box-blue { fill: rgba(96,165,250,0.10); stroke: #58a6ff; stroke-width: 1.5; }
    .anno-box-gold { fill: rgba(212,160,23,0.12); stroke: #D4A017; stroke-width: 1.5; }
    .anno-box-purple { fill: rgba(168,85,247,0.10); stroke: #A855F7; stroke-width: 1.5; }
    .fill-blue { fill: #58a6ff; }
    .fill-gold { fill: #D4A017; }
    .fill-purple { fill: #A855F7; }
    .nil-box-blue { fill: rgba(96,165,250,0.15); stroke: #58a6ff; }
    .nil-box-gold { fill: rgba(212,160,23,0.15); stroke: #D4A017; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; }

    @media (prefers-color-scheme: light) {
      .title { fill: #284b63; }
      .edge { stroke: #6e7781; }
      .edge-gold { stroke: #A16207; }
      .edge-blue { stroke: #284b63; }
      .edge-gold-dash { stroke: #A16207; }
      .edge-blue-dash { stroke: #284b63; }
      .node-black { fill: #334155; stroke: #475569; }
      .node-red { fill: #C2410C; stroke: #EA580C; }
      .anno-box-blue { fill: rgba(37,99,235,0.06); stroke: #284b63; }
      .anno-box-gold { fill: rgba(161,98,7,0.08); stroke: #A16207; }
      .anno-box-purple { fill: rgba(147,51,234,0.06); stroke: #9333EA; }
      .fill-blue { fill: #284b63; }
      .fill-gold { fill: #A16207; }
      .fill-purple { fill: #9333EA; }
      .nil-box-blue { fill: rgba(37,99,235,0.10); stroke: #284b63; }
      .nil-box-gold { fill: rgba(161,98,7,0.10); stroke: #A16207; }
      .desc { fill: #6e7781; }
    }
  </style>

  <!-- Title -->
  <text x="330" y="24" class="title">Black-Height and the h ≤ 2·log₂(n+1) Height Bound</text>

  <!-- Edges (behind nodes) -->
  <line x1="281.8" y1="68.5" x2="176.2" y2="129.5" class="edge-gold"/>
  <line x1="318.1" y1="68.6" x2="421.9" y2="129.4" class="edge-blue"/>
  <line x1="143.5" y1="155.2" x2="94.5" y2="206.8" class="edge-gold"/>
  <line x1="172.8" y1="154.8" x2="225.2" y2="207.2" class="edge"/>
  <line x1="70.2" y1="240.6" x2="49.8" y2="279.4" class="edge-gold"/>
  <line x1="89.8" y1="240.6" x2="110.2" y2="279.4" class="edge"/>
  <line x1="440" y1="161" x2="440" y2="197" class="edge-blue-dash"/>
  <line x1="40" y1="319" x2="40" y2="353" class="edge-gold-dash"/>

  <!-- Nodes — colors follow RB-tree semantics (black=neutral, red=RB-red) -->
  <!-- 8 (BLACK) - root -->
  <circle cx="300" cy="58" r="21" class="node-black"/>
  <text x="300" y="59" class="node-text">8</text>

  <!-- 4 (RED) -->
  <circle cx="158" cy="140" r="21" class="node-red"/>
  <text x="158" y="141" class="node-text">4</text>

  <!-- 12 (BLACK) -->
  <circle cx="440" cy="140" r="21" class="node-black"/>
  <text x="440" y="141" class="node-text">12</text>

  <!-- 2 (BLACK) -->
  <circle cx="80" cy="222" r="21" class="node-black"/>
  <text x="80" y="223" class="node-text">2</text>

  <!-- 6 (BLACK) -->
  <circle cx="240" cy="222" r="21" class="node-black"/>
  <text x="240" y="223" class="node-text">6</text>

  <!-- 1 (RED) -->
  <circle cx="40" cy="298" r="21" class="node-red"/>
  <text x="40" y="299" class="node-text">1</text>

  <!-- 3 (RED) -->
  <circle cx="120" cy="298" r="21" class="node-red"/>
  <text x="120" y="299" class="node-text">3</text>

  <!-- NIL markers -->
  <rect x="425" y="197" width="30" height="18" rx="3" class="nil-box-blue"/>
  <text x="440" y="210" class="nil-text fill-blue">NIL</text>

  <rect x="25" y="353" width="30" height="18" rx="3" class="nil-box-gold"/>
  <text x="40" y="366" class="nil-text fill-gold">NIL</text>

  <!-- Blue path annotation (shortest) — pulled closer to tree -->
  <rect x="478" y="78" width="170" height="62" rx="5" class="anno-box-blue"/>
  <text x="563" y="97" class="anno-title fill-blue">Shortest path</text>
  <text x="563" y="114" class="anno-text fill-blue">8(B) → 12(B) → NIL</text>
  <text x="563" y="131" class="anno-text fill-blue">length = 2, bh = 2</text>

  <!-- Gold path annotation (longest) -->
  <rect x="80" y="353" width="230" height="62" rx="5" class="anno-box-gold"/>
  <text x="195" y="372" class="anno-title fill-gold">Longest path</text>
  <text x="195" y="389" class="anno-text fill-gold">8(B)→4(R)→2(B)→1(R)→NIL</text>
  <text x="195" y="406" class="anno-text fill-gold">length = 4, bh = 2</text>

  <!-- Height bound formula — pulled left closer to tree -->
  <rect x="380" y="325" width="260" height="90" rx="6" class="anno-box-purple"/>
  <text x="510" y="347" class="fill-purple" font-size="14" font-weight="bold" text-anchor="middle">h ≤ 2 · bh</text>
  <text x="510" y="365" class="anno-text fill-purple">Here, bh = 2 ⇒ h ≤ 4</text>
  <text x="510" y="383" class="anno-text fill-purple">Also, bh ≤ log₂(n + 1)</text>
  <text x="510" y="401" class="anno-text fill-purple">Therefore, h ≤ 2 · log₂(n + 1)</text>
</svg>
