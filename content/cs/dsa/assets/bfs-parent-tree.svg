<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 435" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { stroke-width: 1.5; }
    .node-text { font-size: 13px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .edge-gray { stroke: #93a3b8; stroke-width: 1.2; opacity: 0.4; }
    .spt-arrow { stroke: #58a6ff; stroke-width: 2.2; fill: none; }
    .anno { font-size: 10px; fill: #d29922; font-weight: 600; text-anchor: middle; }
    .dist-label { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: start; }
    .layer-label { font-size: 10px; fill: #d29922; font-weight: 600; text-anchor: end; }
    .title { font-size: 12px; fill: #8b949e; text-anchor: middle; font-style: italic; }
    .legend-text { font-size: 9px; fill: #8b949e; text-anchor: start; }
    @media (prefers-color-scheme: light) {
      .node-text { fill: #e8e8e8; }
      .edge-gray { stroke: #b8b8b8; }
      .spt-arrow { stroke: #284b63; }
      .anno { fill: #9e6000; }
      .dist-label { fill: #6e7781; }
      .layer-label { fill: #9e6000; }
      .title { fill: #6e7781; }
      .legend-text { fill: #6e7781; }
    }
  </style>

  <defs>
    <marker id="spt-head" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 8,3 0,6" fill="#58a6ff"/>
    </marker>
    <!-- Light mode arrowhead -->
    <marker id="spt-head-light" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 8,3 0,6" fill="#284b63"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="30" class="title">BFS Shortest-Path Tree (SPT) from source A</text>

  <!-- Layer labels (left margin) -->
  <text x="55" y="80" class="layer-label">Layer 0</text>
  <text x="55" y="170" class="layer-label">Layer 1</text>
  <text x="55" y="260" class="layer-label">Layer 2</text>
  <text x="55" y="350" class="layer-label">Layer 3</text>

  <!-- Gray undirected edges (background) -->
  <!-- A to B -->
  <line x1="260" y1="80" x2="160" y2="170" class="edge-gray"/>
  <!-- A to C -->
  <line x1="260" y1="80" x2="360" y2="170" class="edge-gray"/>
  <!-- B to D -->
  <line x1="160" y1="170" x2="120" y2="260" class="edge-gray"/>
  <!-- C to E -->
  <line x1="360" y1="170" x2="400" y2="260" class="edge-gray"/>
  <!-- E to F -->
  <line x1="400" y1="260" x2="400" y2="350" class="edge-gray"/>

  <!-- SPT directed arrows (bold blue, with arrowheads) -->
  <!-- A -> B: from (260,80) toward (160,170). Offset by radius 22 at both ends -->
  <line x1="241" y1="98" x2="179" y2="152" class="spt-arrow" marker-end="url(#spt-head)"/>
  <!-- A -> C: from (260,80) toward (360,170) -->
  <line x1="279" y1="98" x2="341" y2="152" class="spt-arrow" marker-end="url(#spt-head)"/>
  <!-- B -> D: from (160,170) toward (120,260) -->
  <line x1="151" y1="190" x2="129" y2="240" class="spt-arrow" marker-end="url(#spt-head)"/>
  <!-- C -> E: from (360,170) toward (400,260) -->
  <line x1="369" y1="190" x2="391" y2="240" class="spt-arrow" marker-end="url(#spt-head)"/>
  <!-- E -> F: from (400,260) toward (400,350) -->
  <line x1="400" y1="282" x2="400" y2="328" class="spt-arrow" marker-end="url(#spt-head)"/>

  <!-- Nodes (colored by layer) -->
  <!-- Layer 0: A - source (bright blue) -->
  <circle cx="260" cy="80" r="22" class="node" fill="rgba(30,70,120,0.95)" stroke="#58a6ff"/>
  <text x="260" y="80" class="node-text">A</text>

  <!-- Layer 1: B, C (teal) -->
  <circle cx="160" cy="170" r="22" class="node" fill="rgba(30,80,90,0.95)" stroke="#58a6ff"/>
  <text x="160" y="170" class="node-text">B</text>
  <circle cx="360" cy="170" r="22" class="node" fill="rgba(30,80,90,0.95)" stroke="#58a6ff"/>
  <text x="360" y="170" class="node-text">C</text>

  <!-- Layer 2: D, E (muted green) -->
  <circle cx="120" cy="260" r="22" class="node" fill="rgba(40,75,60,0.95)" stroke="#58a6ff"/>
  <text x="120" y="260" class="node-text">D</text>
  <circle cx="400" cy="260" r="22" class="node" fill="rgba(40,75,60,0.95)" stroke="#58a6ff"/>
  <text x="400" y="260" class="node-text">E</text>

  <!-- Layer 3: F (gold-tinted) -->
  <circle cx="400" cy="350" r="22" class="node" fill="rgba(80,60,30,0.95)" stroke="#58a6ff"/>
  <text x="400" y="350" class="node-text">F</text>

  <!-- Distance labels (right of each node) -->
  <text x="288" y="75" class="dist-label">dist = 0</text>
  <text x="188" y="165" class="dist-label">dist = 1</text>
  <text x="388" y="165" class="dist-label">dist = 1</text>
  <text x="148" y="255" class="dist-label">dist = 2</text>
  <text x="428" y="255" class="dist-label">dist = 2</text>
  <text x="428" y="345" class="dist-label">dist = 3</text>

  <!-- Legend -->
  <line x1="80" y1="400" x2="110" y2="400" class="edge-gray" stroke-opacity="1"/>
  <text x="115" y="403" class="legend-text">undirected edge</text>
  <line x1="230" y1="400" x2="260" y2="400" class="spt-arrow" marker-end="url(#spt-head)"/>
  <text x="265" y="403" class="legend-text">parent pointer (SPT)</text>
</svg>