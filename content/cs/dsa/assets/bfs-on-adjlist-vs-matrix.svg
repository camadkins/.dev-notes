<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19 0 780 495" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .node-text { font-size: 11px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; }
    .anno { font-size: 10px; fill: #d29922; font-weight: 600; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .header { font-size: 12px; fill: #7b97aa; font-weight: 600; text-anchor: middle; }
    .cell { stroke: #30363d; stroke-width: 0.8; }
    .cell-active { fill: rgba(88,166,255,0.2); stroke: #58a6ff; stroke-width: 1; }
    .cell-empty { fill: rgba(30,40,55,0.4); stroke: #30363d; stroke-width: 0.8; }
    .cell-wasted { fill: rgba(210,153,34,0.15); stroke: #d29922; stroke-width: 0.8; }
    .cell-text { font-size: 9px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .cell-text-dim { font-size: 9px; fill: #484f58; text-anchor: middle; dominant-baseline: central; }
    .label { font-size: 10px; fill: #e8e8e8; text-anchor: end; dominant-baseline: central; }
    .col-label { font-size: 9px; fill: #8b949e; text-anchor: middle; }
    .highlight-bracket { stroke: #58a6ff; stroke-width: 1.5; fill: none; }
    .complexity { font-size: 11px; fill: #d29922; font-weight: 700; text-anchor: middle; }
    .footnote { font-size: 9px; fill: #8b949e; font-style: italic; text-anchor: middle; }
    .title { font-size: 12px; fill: #8b949e; text-anchor: middle; font-style: italic; }
    @media (prefers-color-scheme: light) {
      .node { fill: #1a1a2e; stroke: #284b63; }
      .edge { stroke: #b8b8b8; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
      .sep { stroke: #e5e5e5; }
      .header { fill: #284b63; }
      .cell-active { fill: rgba(40,75,99,0.15); stroke: #284b63; }
      .cell-empty { fill: rgba(200,200,200,0.2); stroke: #e5e5e5; }
      .cell-wasted { fill: rgba(158,96,0,0.12); stroke: #9e6000; }
      .cell-text { fill: #1a1a2e; }
      .cell-text-dim { fill: #b8b8b8; }
      .label { fill: #1a1a2e; }
      .col-label { fill: #6e7781; }
      .complexity { fill: #9e6000; }
      .footnote { fill: #6e7781; }
      .title { fill: #6e7781; }
    }
  </style>

  <!-- Title -->
  <text x="390" y="28" class="title">BFS work per vertex: adjacency list vs adjacency matrix</text>

  <!-- Separator -->
  <line x1="390" y1="45" x2="390" y2="440" class="sep"/>

  <!-- ============ LEFT PANEL: Adjacency List ============ -->
  <text x="195" y="58" class="header">Adjacency List</text>

  <!-- Adjacency list representation -->
  <!-- Each row: vertex label -> [neighbor, neighbor, ...] -->
  <!-- BFS processes from A. Highlighted cells = actual neighbors scanned -->

  <!-- Row positions: y = 90, 120, 150, 180, 210, 240 -->
  <!-- Vertex labels at x=50, list starts at x=80 -->

  <!-- A: [B, C] - 2 neighbors scanned -->
  <text x="60" y="95" class="label">A →</text>
  <rect x="75" y="82" width="30" height="24" rx="3" class="cell-active"/>
  <text x="90" y="95" class="cell-text">B</text>
  <rect x="110" y="82" width="30" height="24" rx="3" class="cell-active"/>
  <text x="125" y="95" class="cell-text">C</text>
  <text x="158" y="95" class="anno" text-anchor="start">2 ops</text>

  <!-- B: [A, D] - 2 neighbors scanned -->
  <text x="60" y="125" class="label">B →</text>
  <rect x="75" y="112" width="30" height="24" rx="3" class="cell-active"/>
  <text x="90" y="125" class="cell-text">A</text>
  <rect x="110" y="112" width="30" height="24" rx="3" class="cell-active"/>
  <text x="125" y="125" class="cell-text">D</text>
  <text x="158" y="125" class="anno" text-anchor="start">2 ops</text>

  <!-- C: [A, E] - 2 neighbors scanned -->
  <text x="60" y="155" class="label">C →</text>
  <rect x="75" y="142" width="30" height="24" rx="3" class="cell-active"/>
  <text x="90" y="155" class="cell-text">A</text>
  <rect x="110" y="142" width="30" height="24" rx="3" class="cell-active"/>
  <text x="125" y="155" class="cell-text">E</text>
  <text x="158" y="155" class="anno" text-anchor="start">2 ops</text>

  <!-- D: [B] - 1 neighbor scanned -->
  <text x="60" y="185" class="label">D →</text>
  <rect x="75" y="172" width="30" height="24" rx="3" class="cell-active"/>
  <text x="90" y="185" class="cell-text">B</text>
  <text x="123" y="185" class="anno" text-anchor="start">1 op</text>

  <!-- E: [C, F] - 2 neighbors scanned -->
  <text x="60" y="215" class="label">E →</text>
  <rect x="75" y="202" width="30" height="24" rx="3" class="cell-active"/>
  <text x="90" y="215" class="cell-text">C</text>
  <rect x="110" y="202" width="30" height="24" rx="3" class="cell-active"/>
  <text x="125" y="215" class="cell-text">F</text>
  <text x="158" y="215" class="anno" text-anchor="start">2 ops</text>

  <!-- F: [E] - 1 neighbor scanned -->
  <text x="60" y="245" class="label">F →</text>
  <rect x="75" y="232" width="30" height="24" rx="3" class="cell-active"/>
  <text x="90" y="245" class="cell-text">E</text>
  <text x="123" y="245" class="anno" text-anchor="start">1 op</text>

  <!-- Total -->
  <line x1="50" y1="268" x2="210" y2="268" stroke="#30363d" stroke-width="0.8"/>
  <text x="130" y="288" class="anno" text-anchor="middle">Total: 10 ops = 2m</text>
  <text x="130" y="308" class="complexity">O(n + m)</text>
  <text x="130" y="328" class="desc" text-anchor="middle">scans only actual neighbors</text>

  <!-- Annotation: highlight that lists are compact -->
  <text x="130" y="358" class="desc" text-anchor="middle">n = 6 vertices, m = 5 edges</text>
  <text x="130" y="375" class="desc" text-anchor="middle">Each edge appears twice in lists</text>

  <!-- ============ RIGHT PANEL: Adjacency Matrix ============ -->
  <text x="585" y="58" class="header">Adjacency Matrix</text>

  <!-- Column headers -->
  <!-- Matrix starts at x=440, cell width=36, so columns at 458, 494, 530, 566, 602, 638 -->
  <text x="458" y="78" class="col-label">A</text>
  <text x="494" y="78" class="col-label">B</text>
  <text x="530" y="78" class="col-label">C</text>
  <text x="566" y="78" class="col-label">D</text>
  <text x="602" y="78" class="col-label">E</text>
  <text x="638" y="78" class="col-label">F</text>

  <!-- Row A: edges to B, C. Scans all 6 cells. -->
  <text x="432" y="103" class="label">A</text>
  <rect x="440" y="88" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="458" y="103" class="cell-text-dim">0</text>
  <rect x="476" y="88" width="36" height="26" rx="2" class="cell-active"/>
  <text x="494" y="103" class="cell-text">1</text>
  <rect x="512" y="88" width="36" height="26" rx="2" class="cell-active"/>
  <text x="530" y="103" class="cell-text">1</text>
  <rect x="548" y="88" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="566" y="103" class="cell-text-dim">0</text>
  <rect x="584" y="88" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="602" y="103" class="cell-text-dim">0</text>
  <rect x="620" y="88" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="638" y="103" class="cell-text-dim">0</text>
  <text x="670" y="103" class="anno" text-anchor="start">6</text>

  <!-- Row B: edges to A, D -->
  <text x="432" y="131" class="label">B</text>
  <rect x="440" y="116" width="36" height="26" rx="2" class="cell-active"/>
  <text x="458" y="131" class="cell-text">1</text>
  <rect x="476" y="116" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="494" y="131" class="cell-text-dim">0</text>
  <rect x="512" y="116" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="530" y="131" class="cell-text-dim">0</text>
  <rect x="548" y="116" width="36" height="26" rx="2" class="cell-active"/>
  <text x="566" y="131" class="cell-text">1</text>
  <rect x="584" y="116" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="602" y="131" class="cell-text-dim">0</text>
  <rect x="620" y="116" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="638" y="131" class="cell-text-dim">0</text>
  <text x="670" y="131" class="anno" text-anchor="start">6</text>

  <!-- Row C: edges to A, E -->
  <text x="432" y="159" class="label">C</text>
  <rect x="440" y="144" width="36" height="26" rx="2" class="cell-active"/>
  <text x="458" y="159" class="cell-text">1</text>
  <rect x="476" y="144" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="494" y="159" class="cell-text-dim">0</text>
  <rect x="512" y="144" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="530" y="159" class="cell-text-dim">0</text>
  <rect x="548" y="144" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="566" y="159" class="cell-text-dim">0</text>
  <rect x="584" y="144" width="36" height="26" rx="2" class="cell-active"/>
  <text x="602" y="159" class="cell-text">1</text>
  <rect x="620" y="144" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="638" y="159" class="cell-text-dim">0</text>
  <text x="670" y="159" class="anno" text-anchor="start">6</text>

  <!-- Row D: edges to B -->
  <text x="432" y="187" class="label">D</text>
  <rect x="440" y="172" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="458" y="187" class="cell-text-dim">0</text>
  <rect x="476" y="172" width="36" height="26" rx="2" class="cell-active"/>
  <text x="494" y="187" class="cell-text">1</text>
  <rect x="512" y="172" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="530" y="187" class="cell-text-dim">0</text>
  <rect x="548" y="172" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="566" y="187" class="cell-text-dim">0</text>
  <rect x="584" y="172" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="602" y="187" class="cell-text-dim">0</text>
  <rect x="620" y="172" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="638" y="187" class="cell-text-dim">0</text>
  <text x="670" y="187" class="anno" text-anchor="start">6</text>

  <!-- Row E: edges to C, F -->
  <text x="432" y="215" class="label">E</text>
  <rect x="440" y="200" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="458" y="215" class="cell-text-dim">0</text>
  <rect x="476" y="200" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="494" y="215" class="cell-text-dim">0</text>
  <rect x="512" y="200" width="36" height="26" rx="2" class="cell-active"/>
  <text x="530" y="215" class="cell-text">1</text>
  <rect x="548" y="200" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="566" y="215" class="cell-text-dim">0</text>
  <rect x="584" y="200" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="602" y="215" class="cell-text-dim">0</text>
  <rect x="620" y="200" width="36" height="26" rx="2" class="cell-active"/>
  <text x="638" y="215" class="cell-text">1</text>
  <text x="670" y="215" class="anno" text-anchor="start">6</text>

  <!-- Row F: edges to E -->
  <text x="432" y="243" class="label">F</text>
  <rect x="440" y="228" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="458" y="243" class="cell-text-dim">0</text>
  <rect x="476" y="228" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="494" y="243" class="cell-text-dim">0</text>
  <rect x="512" y="228" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="530" y="243" class="cell-text-dim">0</text>
  <rect x="548" y="228" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="566" y="243" class="cell-text-dim">0</text>
  <rect x="584" y="228" width="36" height="26" rx="2" class="cell-active"/>
  <text x="602" y="243" class="cell-text">1</text>
  <rect x="620" y="228" width="36" height="26" rx="2" class="cell-wasted"/>
  <text x="638" y="243" class="cell-text-dim">0</text>
  <text x="670" y="243" class="anno" text-anchor="start">6</text>

  <!-- Matrix total -->
  <line x1="420" y1="268" x2="700" y2="268" stroke="#30363d" stroke-width="0.8"/>
  <text x="585" y="288" class="anno" text-anchor="middle">Total: 36 ops = n x n</text>
  <text x="585" y="308" class="complexity">O(n²)</text>
  <text x="585" y="328" class="desc" text-anchor="middle">scans entire row per vertex</text>

  <!-- Legend -->
  <rect x="420" y="355" width="18" height="14" rx="2" class="cell-active"/>
  <text x="444" y="365" class="desc" text-anchor="start">actual neighbor (useful work)</text>
  <rect x="420" y="378" width="18" height="14" rx="2" class="cell-wasted"/>
  <text x="444" y="388" class="desc" text-anchor="start">no edge — wasted scan (gold tint)</text>

  <!-- Bottom annotation -->
  <text x="390" y="430" class="anno" text-anchor="middle">Sparse graph: m = 5 edges, n = 6 vertices</text>
  <text x="390" y="450" class="footnote">List scans 2m = 10 cells total  |  Matrix scans n² = 36 cells total</text>
  <text x="390" y="467" class="footnote">The sparser the graph, the greater the wasted work with matrices</text>
</svg>