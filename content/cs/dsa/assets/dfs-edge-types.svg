<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" fill="none">
  <style>
    text { font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .node { fill: rgba(30,40,55,0.95); stroke: #58a6ff; stroke-width: 1.5; }
    .node-text { font-size: 13px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .ts-text { font-size: 9px; fill: #d29922; text-anchor: middle; font-weight: 600; }
    .edge-tree { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
    .edge-back { stroke: #f85149; stroke-width: 1.8; fill: none; stroke-dasharray: 6 3; }
    .edge-forward { stroke: #79c0ff; stroke-width: 1.8; fill: none; stroke-dasharray: 4 4; }
    .edge-cross { stroke: #6e7681; stroke-width: 1.8; fill: none; stroke-dasharray: 2 3; }
    .edge-undirected { stroke: #93a3b8; stroke-width: 1.5; fill: none; }
    .edge-back-undirected { stroke: #f85149; stroke-width: 1.8; fill: none; stroke-dasharray: 6 3; }
    .arrow-tree { fill: #58a6ff; }
    .arrow-back { fill: #f85149; }
    .arrow-forward { fill: #79c0ff; }
    .arrow-cross { fill: #6e7681; }
    .edge-label { font-size: 8px; font-weight: 600; }
    .edge-label-tree { fill: #58a6ff; }
    .edge-label-back { fill: #f85149; }
    .edge-label-forward { fill: #79c0ff; }
    .edge-label-cross { fill: #6e7681; }
    .title { font-size: 11px; fill: #7b97aa; text-anchor: middle; font-weight: 600; }
    .panel-title { font-size: 10px; fill: #d29922; text-anchor: middle; font-weight: 600; }
    .sep { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .anno { font-size: 9px; fill: #8b949e; text-anchor: middle; }
    @media (prefers-color-scheme: light) {
      .node { fill: #1a1a2e; stroke: #284b63; }
      .node-text { fill: #e8e8e8; }
      .ts-text { fill: #9e6000; }
      .edge-tree { stroke: #284b63; }
      .arrow-tree { fill: #284b63; }
      .edge-back { stroke: #cf222e; }
      .arrow-back { fill: #cf222e; }
      .edge-forward { stroke: #0969da; }
      .arrow-forward { fill: #0969da; }
      .edge-cross { stroke: #b8b8b8; }
      .arrow-cross { fill: #b8b8b8; }
      .edge-undirected { stroke: #b8b8b8; }
      .edge-back-undirected { stroke: #cf222e; }
      .edge-label-tree { fill: #284b63; }
      .edge-label-back { fill: #cf222e; }
      .edge-label-forward { fill: #0969da; }
      .edge-label-cross { fill: #b8b8b8; }
      .title { fill: #284b63; }
      .panel-title { fill: #9e6000; }
      .sep { stroke: #e5e5e5; }
      .anno { fill: #6e7781; }
    }
  </style>

  <defs>
    <marker id="ah2-tree" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" class="arrow-tree"/>
    </marker>
    <marker id="ah2-back" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" class="arrow-back"/>
    </marker>
    <marker id="ah2-forward" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" class="arrow-forward"/>
    </marker>
    <marker id="ah2-cross" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" class="arrow-cross"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="26" class="title">Edge Classification: Directed vs Undirected</text>

  <!-- Separator -->
  <line x1="350" y1="40" x2="350" y2="340" class="sep"/>

  <!-- LEFT PANEL: DIRECTED
       4 nodes: u, v, w, x
       DFS from u: u to v (tree), v to w (tree), w to u (back, ancestor),
       u to w (forward, descendant not child), u to x (tree), x to w (cross, different branch)

       Timestamps:
       u: d=1, f=8
       v: d=2, f=5
       w: d=3, f=4
       x: d=6, f=7

       Layout (u centered over v,x):
       u: (175, 95)   midpoint of v(105) and x(245) = 175
       v: (105, 185)
       w: (105, 275)
       x: (245, 185)
       r=22
  -->

  <text x="175" y="52" class="panel-title">Directed Graph</text>

  <!-- Tree: u to v -->
  <line x1="160" y1="112" x2="120" y2="168" class="edge-tree" marker-end="url(#ah2-tree)"/>
  <text x="125" y="138" class="edge-label edge-label-tree">T</text>

  <!-- Tree: v to w -->
  <line x1="105" y1="207" x2="105" y2="253" class="edge-tree" marker-end="url(#ah2-tree)"/>
  <text x="90" y="232" class="edge-label edge-label-tree">T</text>

  <!-- Tree: u to x -->
  <line x1="193" y1="110" x2="231" y2="169" class="edge-tree" marker-end="url(#ah2-tree)"/>
  <text x="225" y="138" class="edge-label edge-label-tree">T</text>

  <!-- Back: w to u (descendant to ancestor, curved left) -->
  <path d="M 85,268 C 48,210 48,140 158,90" class="edge-back" marker-end="url(#ah2-back)"/>
  <text x="46" y="178" class="edge-label edge-label-back">B</text>

  <!-- Forward: u to w (ancestor to non-child descendant) -->
  <path d="M 175,117 C 175,178 142,240 123,260" class="edge-forward" marker-end="url(#ah2-forward)"/>
  <text x="162" y="200" class="edge-label edge-label-forward">F</text>

  <!-- Cross: x to w (between branches) -->
  <path d="M 225,195 C 195,240 145,270 125,278" class="edge-cross" marker-end="url(#ah2-cross)"/>
  <text x="185" y="265" class="edge-label edge-label-cross">C</text>

  <!-- Directed nodes -->
  <circle cx="175" cy="95" r="22" class="node" id="node-u-d"/>
  <text x="175" y="95" class="node-text">u</text>
  <text x="175" y="71" class="ts-text">(1,8)</text>

  <circle cx="105" cy="185" r="22" class="node" id="node-v-d"/>
  <text x="105" y="185" class="node-text">v</text>
  <text x="105" y="161" class="ts-text">(2,5)</text>

  <circle cx="105" cy="275" r="22" class="node" id="node-w-d"/>
  <text x="105" y="275" class="node-text">w</text>
  <text x="105" y="251" class="ts-text">(3,4)</text>

  <circle cx="245" cy="185" r="22" class="node" id="node-x-d"/>
  <text x="245" y="185" class="node-text">x</text>
  <text x="245" y="161" class="ts-text">(6,7)</text>

  <!-- RIGHT PANEL: UNDIRECTED
       Same 4 nodes, same layout, same tree edges.
       In undirected graphs, non-tree edges are ALL back edges.

       u: (525, 95) centered over v(455) and x(595): (455+595)/2 = 525
       v: (455, 185)
       w: (455, 275)
       x: (595, 185)
       r=22
  -->

  <text x="525" y="52" class="panel-title">Undirected Graph</text>

  <!-- Tree: u to v (no arrow for undirected) -->
  <line x1="510" y1="112" x2="470" y2="168" class="edge-tree"/>
  <text x="475" y="138" class="edge-label edge-label-tree">T</text>

  <!-- Tree: v to w -->
  <line x1="455" y1="207" x2="455" y2="253" class="edge-tree"/>
  <text x="440" y="232" class="edge-label edge-label-tree">T</text>

  <!-- Tree: u to x -->
  <line x1="543" y1="110" x2="581" y2="169" class="edge-tree"/>
  <text x="575" y="138" class="edge-label edge-label-tree">T</text>

  <!-- Back: w to u (curved left, back edge in undirected) -->
  <path d="M 435,268 C 398,210 398,140 508,90" class="edge-back-undirected"/>
  <text x="396" y="178" class="edge-label edge-label-back">B</text>

  <!-- Back: u to w (was forward in directed, is back in undirected) -->
  <path d="M 525,117 C 525,178 492,240 473,260" class="edge-back-undirected"/>
  <text x="512" y="200" class="edge-label edge-label-back">B</text>

  <!-- Back: x to w (was cross in directed, is back in undirected) -->
  <path d="M 575,195 C 545,240 495,270 475,278" class="edge-back-undirected"/>
  <text x="535" y="265" class="edge-label edge-label-back">B</text>

  <!-- Undirected nodes -->
  <circle cx="525" cy="95" r="22" class="node" id="node-u-u"/>
  <text x="525" y="95" class="node-text">u</text>
  <text x="525" y="71" class="ts-text">(1,8)</text>

  <circle cx="455" cy="185" r="22" class="node" id="node-v-u"/>
  <text x="455" y="185" class="node-text">v</text>
  <text x="455" y="161" class="ts-text">(2,5)</text>

  <circle cx="455" cy="275" r="22" class="node" id="node-w-u"/>
  <text x="455" y="275" class="node-text">w</text>
  <text x="455" y="251" class="ts-text">(3,4)</text>

  <circle cx="595" cy="185" r="22" class="node" id="node-x-u"/>
  <text x="595" y="185" class="node-text">x</text>
  <text x="595" y="161" class="ts-text">(6,7)</text>

  <!-- Bottom annotations -->
  <line x1="40" y1="345" x2="660" y2="345" class="sep"/>
  <text x="175" y="365" class="anno">Directed: tree, back, forward, cross edges</text>
  <text x="525" y="365" class="anno">Undirected: only tree and back edges</text>
</svg>
