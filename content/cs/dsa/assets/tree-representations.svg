<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 0 770 380" fill="none">
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .title { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .section { font-size: 11px; font-weight: 700; }
    .code { font-size: 10px; }
    .note { font-size: 9px; font-style: italic; }
    .node { fill: rgba(30,40,55,0.85); stroke: #58a6ff; stroke-width: 1.5; }
    .node-text { font-size: 11px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .edge { stroke: #93a3b8; stroke-width: 1.5; }
    .box { fill: none; stroke-width: 1; rx: 4; }

    .title { fill: #58a6ff; }
    .section { fill: #58a6ff; }
    .code { fill: #c9d1d9; }
    .note { fill: #8b949e; }
    .box { stroke: #30363d; }
    .box-fill { fill: rgba(88,166,255,0.04); }
    .arr-cell { fill: rgba(30,40,55,0.5); stroke: #58a6ff; stroke-width: 1; }
    .arr-text { font-size: 10px; fill: #e8e8e8; text-anchor: middle; dominant-baseline: central; }
    .arr-idx { font-size: 8px; fill: #8b949e; text-anchor: middle; }
    .anno { font-size: 10px; fill: #d29922; font-weight: 600; }
    .desc { font-size: 9px; fill: #8b949e; font-style: italic; }

    @media (prefers-color-scheme: light) {
      .title { fill: #284b63; }
      .section { fill: #284b63; }
      .code { fill: #4e4e4e; }
      .note { fill: #6e7781; }
      .node { fill: #1a1a2e; stroke: #284b63; }
      .edge { stroke: #b8b8b8; }
      .box { stroke: #e5e5e5; }
      .box-fill { fill: rgba(40,75,99,0.03); }
      .arr-cell { fill: rgba(30,40,55,0.1); stroke: #284b63; }
      .arr-text { fill: #2b2b2b; }
      .arr-idx { fill: #6e7781; }
      .anno { fill: #9e6000; }
      .desc { fill: #6e7781; }
    }
  </style>

  <!-- Title -->
  <text x="370" y="20" class="title">Tree Representations — Same Tree, Five Ways</text>

  <!-- ===== ROW 1 ===== -->

  <!-- Reference Tree -->
  <rect x="10" y="32" width="160" height="130" class="box box-fill" rx="4"/>
  <text x="90" y="48" class="section" text-anchor="middle">Reference Tree</text>
  <line x1="90" y1="70" x2="55" y2="100" class="edge"/>
  <line x1="90" y1="70" x2="125" y2="100" class="edge"/>
  <line x1="55" y1="112" x2="35" y2="140" class="edge"/>
  <line x1="55" y1="112" x2="75" y2="140" class="edge"/>
  <circle cx="90" cy="65" r="12" class="node"/>
  <text x="90" y="66" class="node-text">A</text>
  <circle cx="55" cy="105" r="12" class="node"/>
  <text x="55" y="106" class="node-text">B</text>
  <circle cx="125" cy="105" r="12" class="node"/>
  <text x="125" y="106" class="node-text">C</text>
  <circle cx="35" cy="145" r="12" class="node"/>
  <text x="35" y="146" class="node-text">D</text>
  <circle cx="75" cy="145" r="12" class="node"/>
  <text x="75" y="146" class="node-text">E</text>

  <!-- 1. Pointer Nodes (+10px gap) -->
  <rect x="195" y="32" width="250" height="130" class="box box-fill" rx="4"/>
  <text x="320" y="48" class="section" text-anchor="middle">1. Pointer Nodes</text>
  <text x="205" y="68" class="code">struct Node {</text>
  <text x="205" y="82" class="code">  val, *left, *right</text>
  <text x="205" y="96" class="code">}</text>
  <text x="205" y="118" class="note">+ Natural recursion, flexible</text>
  <text x="205" y="132" class="note">− Pointer overhead, cache-unfriendly</text>
  <text x="205" y="146" class="note">  for large trees</text>

  <!-- 2. Parent Array (+20px gap) -->
  <rect x="470" y="32" width="260" height="130" class="box box-fill" rx="4"/>
  <text x="600" y="48" class="section" text-anchor="middle">2. Parent Array</text>
  <text x="490" y="70" class="arr-idx">A</text>
  <text x="524" y="70" class="arr-idx">B</text>
  <text x="558" y="70" class="arr-idx">C</text>
  <text x="592" y="70" class="arr-idx">D</text>
  <text x="626" y="70" class="arr-idx">E</text>
  <rect x="475" y="75" width="34" height="22" class="arr-cell" rx="2"/>
  <text x="492" y="87" class="arr-text">-1</text>
  <rect x="509" y="75" width="30" height="22" class="arr-cell" rx="2"/>
  <text x="524" y="87" class="arr-text">A</text>
  <rect x="543" y="75" width="30" height="22" class="arr-cell" rx="2"/>
  <text x="558" y="87" class="arr-text">A</text>
  <rect x="577" y="75" width="30" height="22" class="arr-cell" rx="2"/>
  <text x="592" y="87" class="arr-text">B</text>
  <rect x="611" y="75" width="30" height="22" class="arr-cell" rx="2"/>
  <text x="626" y="87" class="arr-text">B</text>
  <text x="480" y="116" class="note">+ Compact; easy upward navigation</text>
  <text x="480" y="130" class="note">+ Amenable to binary lifting</text>
  <text x="480" y="144" class="note">− Downward traversal requires scan</text>

  <!-- ===== ROW 2 ===== -->

  <!-- 3. Children Arrays -->
  <rect x="10" y="178" width="220" height="130" class="box box-fill" rx="4"/>
  <text x="120" y="194" class="section" text-anchor="middle">3. Children Arrays</text>
  <text x="20" y="214" class="code">A: [B, C]</text>
  <text x="20" y="228" class="code">B: [D, E]</text>
  <text x="20" y="242" class="code">C: []  D: []  E: []</text>
  <text x="20" y="268" class="note">+ Direct downward access</text>
  <text x="20" y="282" class="note">+ Great for DP passes</text>
  <text x="20" y="296" class="note">− Variable-size per node</text>

  <!-- 4. LCRS (+10px gap) -->
  <rect x="255" y="178" width="225" height="130" class="box box-fill" rx="4"/>
  <text x="367" y="194" class="section" text-anchor="middle">4. Left-Child Right-Sibling</text>
  <text x="265" y="214" class="code">A.child→B  B.sib→C</text>
  <text x="265" y="228" class="code">B.child→D  D.sib→E</text>
  <text x="265" y="242" class="code">C.child→∅  E.sib→∅</text>
  <text x="265" y="268" class="note">+ 2 ptrs/node, unbounded arity</text>
  <text x="265" y="282" class="note">+ Binary-tree shape for any tree</text>
  <text x="265" y="296" class="note">− k-th child access is O(k)</text>

  <!-- 5. Heap Array (+20px gap) -->
  <rect x="505" y="178" width="225" height="130" class="box box-fill" rx="4"/>
  <text x="617" y="194" class="section" text-anchor="middle">5. Heap Array (Complete)</text>
  <text x="525" y="214" class="arr-idx">0</text>
  <text x="557" y="214" class="arr-idx">1</text>
  <text x="589" y="214" class="arr-idx">2</text>
  <text x="621" y="214" class="arr-idx">3</text>
  <text x="653" y="214" class="arr-idx">4</text>
  <rect x="511" y="218" width="28" height="22" class="arr-cell" rx="2"/>
  <text x="525" y="230" class="arr-text">A</text>
  <rect x="543" y="218" width="28" height="22" class="arr-cell" rx="2"/>
  <text x="557" y="230" class="arr-text">B</text>
  <rect x="575" y="218" width="28" height="22" class="arr-cell" rx="2"/>
  <text x="589" y="230" class="arr-text">C</text>
  <rect x="607" y="218" width="28" height="22" class="arr-cell" rx="2"/>
  <text x="621" y="230" class="arr-text">D</text>
  <rect x="639" y="218" width="28" height="22" class="arr-cell" rx="2"/>
  <text x="653" y="230" class="arr-text">E</text>
  <text x="515" y="258" class="code">left(i)=2i+1  right(i)=2i+2</text>
  <text x="515" y="278" class="note">+ No pointers; excellent locality</text>
  <text x="515" y="292" class="note">+ Ideal for heaps (complete trees)</text>
  <text x="515" y="306" class="note">− Wastes space if tree is sparse</text>

  <!-- Summary -->
  <text x="370" y="338" class="note" text-anchor="middle">Choose representation based on shape (complete vs sparse), direction (up vs down), and workload (static vs dynamic)</text>
</svg>
